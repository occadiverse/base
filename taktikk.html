<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BSK Fotball - Taktikk</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=2">
    <style>
        /* Taktikk-spesifikke stiler */
        .taktikk-hero {
            background: linear-gradient(135deg, #3498db 0%, #2c3e50 100%);
            border-radius: 20px;
            padding: 50px;
            color: white;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(52, 152, 219, 0.2);
        }

        .taktikk-hero h2 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .taktikk-hero p {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 600px;
            line-height: 1.5;
        }

        /* Filter-bar styling identisk med kamper.html */
        .filter-bar {
            background: var(--white);
            border-radius: 12px;
            padding: 20px 25px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .filter-bar > div {
            display: flex;
            gap: 10px;
            /* justify-content: center fjernet for å matche kamper.html (venstrestilt) */
        }

        .tab-btn {
            padding: 12px 20px;
            border: 2px solid var(--border-color);
            background: var(--white);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            transition: all 0.3s;
            font-size: 0.95rem;
            text-transform: uppercase;
        }

        .tab-btn.active {
            background-color: var(--primary); 
            color: #ffffff !important;
            border: 2px solid var(--primary);
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.2);
        }

        .tab-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* BANEN */
        .pitch-container {
            width: 95%;
            max-width: 500px;
            margin: 0 auto;
            background-color: #a8d5ba;
            position: relative;
            aspect-ratio: 3/4;
            border: 2px solid #fff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .pitch-line {
            position: absolute;
            pointer-events: none;
            border: 2px solid rgba(255, 255, 255, 0.6);
            z-index: 1;
        }

        .mid-line { top: 50%; width: 100%; height: 0; border-bottom: 2px solid rgba(255, 255, 255, 0.6); }
        .center-circle { top: 50%; left: 50%; width: 26%; aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%); }
        .center-spot { top: 50%; left: 50%; width: 6px; height: 6px; background: #fff; border-radius: 50%; transform: translate(-50%, -50%); }

        .penalty-area { left: 15%; width: 70%; height: 16%; background-color: #a8d5ba; }
        .goal-area { left: 35%; width: 30%; height: 6%; }
        .penalty-arc { left: 50%; width: 26%; aspect-ratio: 1; border-radius: 50%; transform: translateX(-50%); z-index: 0; }
        .penalty-spot { left: 50%; width: 5px; height: 5px; background: #fff; border-radius: 50%; transform: translateX(-50%); z-index: 2; }

        .top-zone .penalty-area { top: 0; border-top: none; }
        .top-zone .goal-area { top: 0; border-top: none; }
        .top-zone .penalty-arc { top: 7%; }
        .top-zone .penalty-spot { top: 11%; }

        .bottom-zone .penalty-area { bottom: 0; border-bottom: none; }
        .bottom-zone .goal-area { bottom: 0; border-bottom: none; }
        .bottom-zone .penalty-arc { bottom: 7%; }
        .bottom-zone .penalty-spot { bottom: 11%; }

        /* SPILLER-NODER */
.player-node {
    position: absolute;
    width: 75px; /* Litt bredere for å få plass til tekst */
    background-color: var(--primary);
    border: 2px solid #fff;
    border-radius: 8px;
    padding: 5px 2px;
    text-align: center;
    z-index: 5;
    transform: translate(-50%, -50%);
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

/* Stil for noder som ikke har fått tildelt spiller enda */
.player-node.empty {
    background-color: rgba(44, 62, 80, 0.6); /* Mørkegrå/blå og transparent */
    border-style: dashed; /* Stiplet linje for "ledig plass" */
}

.player-initials { 
    font-weight: 800; 
    font-size: 16px; /* Større bokstaver */
    color: #ffffff;
    display: block;
    line-height: 1.2;
}

/* Ny stil for et lite "undertekst-navn" */
.player-full-name {
    font-size: 9px;
    color: rgba(255,255,255,0.9);
    display: block;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
}

.player-node select { 
    width: 90%; 
    font-size: 9px; 
    margin-top: 4px;
    border: none;
    border-radius: 4px;
    background: white;
    cursor: pointer;
}
        /* INFO-KORT UNDER BANEN */
        .tactic-details { padding: 20px; max-width: 500px; margin: 0 auto; }
        .tactic-card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: var(--shadow); border: 1px solid var(--border-color); }
        .tactic-card h3 { margin: 0 0 12px 0; font-size: 1.1rem; font-weight: 800; color: var(--text-main); border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        
        .role-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f1f3f5; }
        .role-row select { border: 1px solid var(--border-color); padding: 8px; border-radius: 6px; width: 60%; font-size: 0.9rem; background: var(--white); }
        
        textarea { width: 100%; min-height: 80px; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; margin-top: 5px; font-family: inherit; font-size: 0.95rem; resize: none; transition: border-color 0.3s; }
        textarea:focus { border-color: var(--primary); outline: none; }
        
        .badge { display: inline-block; background: #f1f3f5; color: var(--text-main); padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; margin: 3px; border: 1px solid var(--border-color); }
        
        .btn-save { background: var(--primary); color: white; border: none; padding: 18px; border-radius: 12px; width: 100%; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.3s; margin-bottom: 60px; text-transform: uppercase; letter-spacing: 0.05em; }
        .btn-save:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(52, 152, 219, 0.3); }
        .btn-save:active { transform: scale(0.98); }

        @media (max-width: 768px) {
            .taktikk-hero { padding: 30px; }
            .taktikk-hero h2 { font-size: 1.6rem; }
            .filter-bar { padding: 15px; }
        }
    </style>
</head>
<body>

<div class="sidebar" id="sidebar"></div>

<div class="main-content">
    <!-- TOP BAR -->
    <div class="top-bar">
        <button class="menu-toggle" onclick="toggleMenu()">
            <i class="fa-solid fa-bars"></i>
        </button>
        <h2 class="section-title">BSK Fotball Herrer - A lag</h2>
    </div>

    <!-- HERO SEKSJON -->
    <section class="taktikk-hero">
        <div class="hero-content">
            <h2 id="matchOpponentTitle">Kampplan</h2>
            <p id="matchDetailsSub">Her setter du opp tropp, roller og taktiske instrukser for kampen.</p>
        </div>
    </section>

    <!-- FILTER BAR / FASE-KONTROLLER -->
    <div class="filter-bar">
        <div>
            <button class="tab-btn active" onclick="TaktikkModul.byttFase('424', this)">Fase 1 (4-2-4)</button>
            <button class="tab-btn" onclick="TaktikkModul.byttFase('2323', this)">Fase 2 (2-3-2-3)</button>
            <button class="tab-btn" onclick="TaktikkModul.byttFase('325', this)">Fase 3 (3-2-5)</button>
        </div>
    </div>

    <!-- FOTBALLBANEN -->
    <div class="pitch-container" id="pitch">
        <div class="top-zone">
            <div class="pitch-line penalty-arc"></div>
            <div class="pitch-line penalty-area"></div>
            <div class="pitch-line goal-area"></div>
            <div class="pitch-line penalty-spot"></div>
        </div>

        <div class="pitch-line mid-line"></div>
        <div class="pitch-line center-circle"></div>
        <div class="pitch-line center-spot"></div>

        <div class="bottom-zone">
            <div class="pitch-line penalty-arc"></div>
            <div class="pitch-line penalty-area"></div>
            <div class="pitch-line goal-area"></div>
            <div class="pitch-line penalty-spot"></div>
        </div>

        <div id="playerLayer"></div>
    </div>

    <!-- TAKTIKK DETALJER -->
    <div class="tactic-details">
        <div class="tactic-card">
            <h3><i class="fa-solid fa-star"></i> Nøkkelroller</h3>
            <div class="role-row">
                <span>Kaptein:</span> 
                <select id="cap-select"><option value="">Velg...</option></select>
            </div>
            <div class="role-row">
                <span>Straffe 1:</span> 
                <select id="pen1-select"><option value="">Velg...</option></select>
            </div>
            <div class="role-row">
                <span>Straffe 2:</span> 
                <select id="pen2-select"><option value="">Velg...</option></select>
            </div>
            <div class="role-row">
                <span>Corner Venstre:</span> 
                <select id="corV-select"><option value="">Velg...</option></select>
            </div>
            <div class="role-row">
                <span>Corner Høyre:</span> 
                <select id="corH-select"><option value="">Velg...</option></select>
            </div>
        </div>

        <div class="tactic-card">
            <h3><i class="fa-solid fa-arrows-to-dot"></i> Corner-instrukser</h3>
            <div style="margin-bottom: 15px;">
                <label style="font-size: 0.85rem; font-weight: 800; color: var(--primary); text-transform: uppercase;">Offensiv Corner</label>
                <textarea id="off-corner-text" placeholder="Beskriv bevegelser og soner..."></textarea>
            </div>
            <div>
                <label style="font-size: 0.85rem; font-weight: 800; color: #e74c3c; text-transform: uppercase;">Defensiv Corner</label>
                <textarea id="def-corner-text" placeholder="Markeringstype og posisjoner..."></textarea>
            </div>
        </div>

        <div class="tactic-card">
            <h3><i class="fa-solid fa-users"></i> Benken</h3>
            <div id="bench-list" style="margin-bottom: 20px;">
                <!-- Spillere på benken genereres her -->
            </div>
            <label style="font-size: 0.85rem; font-weight: 800; text-transform: uppercase;">Bytteplan / Notater</label>
            <textarea id="sub-plan-text" placeholder="Skriv inn planlagte bytter..."></textarea>
        </div>

        <button onclick="TaktikkModul.lagreTaktikk()" class="btn-save">
            <i class="fa-solid fa-floppy-disk"></i> Lagre Hele Kampplanen
        </button>
    </div>
</div>

<script src="navigation.js"></script>
<script type="module" src="taktikk.js"></script>

</body>
</html>
