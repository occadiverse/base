<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BSK Fotball - Taktikk</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Taktikk-spesifikke stiler */
        .taktikk-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
            padding: 0 10px;
        }

        .phase-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            background-color: #f0f0f0;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .phase-btn.active {
            background-color: #2d5a27;
            color: white;
        }

        /* BANEN */
        .pitch-container {
            width: 95%;
            max-width: 500px;
            margin: 0 auto;
            background-color: #a8d5ba;
            position: relative;
            aspect-ratio: 3/4;
            border: 2px solid #fff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .pitch-line {
            position: absolute;
            pointer-events: none;
            border: 2px solid rgba(255, 255, 255, 0.6);
            z-index: 1;
        }

        .mid-line { top: 50%; width: 100%; height: 0; border-bottom: 2px solid rgba(255, 255, 255, 0.6); }
        .center-circle { top: 50%; left: 50%; width: 26%; aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%); }
        .center-spot { top: 50%; left: 50%; width: 6px; height: 6px; background: #fff; border-radius: 50%; transform: translate(-50%, -50%); }

        .penalty-area { left: 15%; width: 70%; height: 16%; background-color: #a8d5ba; }
        .goal-area { left: 35%; width: 30%; height: 6%; }
        .penalty-arc { left: 50%; width: 26%; aspect-ratio: 1; border-radius: 50%; transform: translateX(-50%); z-index: 0; }
        .penalty-spot { left: 50%; width: 5px; height: 5px; background: #fff; border-radius: 50%; transform: translateX(-50%); z-index: 2; }

        .top-zone .penalty-area { top: 0; border-top: none; }
        .top-zone .goal-area { top: 0; border-top: none; }
        .top-zone .penalty-arc { top: 7%; }
        .top-zone .penalty-spot { top: 11%; }

        .bottom-zone .penalty-area { bottom: 0; border-bottom: none; }
        .bottom-zone .goal-area { bottom: 0; border-bottom: none; }
        .bottom-zone .penalty-arc { bottom: 7%; }
        .bottom-zone .penalty-spot { bottom: 11%; }

        /* SPILLER-NODER */
        .player-node {
            position: absolute;
            width: 70px;
            background-color: #fff;
            border: 2px solid #2d5a27;
            border-radius: 6px;
            padding: 4px;
            text-align: center;
            z-index: 5;
            transform: translate(-50%, -50%);
            transition: all 0.5s ease-in-out;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .player-initials { font-weight: 800; font-size: 14px; color: #2d5a27; margin-bottom: 2px; }
        .player-node select { width: 100%; font-size: 10px; border: 1px solid #ddd; border-radius: 3px; background: #f9f9f9; }

        /* INFO-KORT UNDER BANEN */
        .tactic-details { padding: 20px; max-width: 500px; margin: 0 auto; }
        .tactic-card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #eee; }
        .tactic-card h3 { margin: 0 0 12px 0; font-size: 1rem; color: #333; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        
        .role-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dotted #eee; }
        .role-row select { border: 1px solid #ddd; padding: 5px; border-radius: 4px; width: 60%; font-size: 0.85rem; background-color: #fff; }
        
        textarea { width: 100%; min-height: 60px; border: 1px solid #ddd; border-radius: 6px; padding: 10px; margin-top: 5px; font-family: inherit; font-size: 0.9rem; resize: none; }
        
        .badge { display: inline-block; background: #e8f5e9; color: #2d5a27; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; margin: 2px; border: 1px solid #c8e6c9; }
        
        .btn-save { background: #2d5a27; color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s; margin-bottom: 40px; }
        .btn-save:active { transform: scale(0.98); opacity: 0.9; }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar"></div>

    <div class="main-content">
        <div class="top-bar">
            <div class="top-bar-left">
                <button class="menu-toggle" onclick="toggleMenu()">
                    <i class="fa-solid fa-bars"></i>
                </button>
             <span class="app-title">BSK Fotball Herrer - A-lag</span>
            </div>
        </div>

        <!-- HERO SEKSJON -->
        <div class="hero-section">
            <h1 id="matchOpponentTitle">Kampplan</h1>
            <p id="matchDetailsSub">Laster kampdetaljer...</p>
        </div>

        <div class="taktikk-controls">
            <button class="phase-btn active" onclick="TaktikkModul.byttFase('424', this)">Fase 1 (4-2-4)</button>
            <button class="phase-btn" onclick="TaktikkModul.byttFase('2323', this)">Fase 2 (2-3-2-3)</button>
            <button class="phase-btn" onclick="TaktikkModul.byttFase('325', this)">Fase 3 (3-2-5)</button>
        </div>

        <!-- FOTBALLBANEN -->
        <div class="pitch-container" id="pitch">
            <div class="top-zone">
                <div class="pitch-line penalty-arc"></div>
                <div class="pitch-line penalty-area"></div>
                <div class="pitch-line goal-area"></div>
                <div class="pitch-line penalty-spot"></div>
            </div>

            <div class="pitch-line mid-line"></div>
            <div class="pitch-line center-circle"></div>
            <div class="pitch-line center-spot"></div>

            <div class="bottom-zone">
                <div class="pitch-line penalty-arc"></div>
                <div class="pitch-line penalty-area"></div>
                <div class="pitch-line goal-area"></div>
                <div class="pitch-line penalty-spot"></div>
            </div>

            <div id="playerLayer"></div>
        </div>

        <!-- TAKTIKK DETALJER -->
        <div class="tactic-details">
            <div class="tactic-card">
                <h3><i class="fa-solid fa-star"></i> Nøkkelroller</h3>
                <div class="role-row">
                    <span>Kaptein:</span> 
                    <select id="cap-select"><option value="">Velg...</option></select>
                </div>
                <div class="role-row">
                    <span>Straffe 1:</span> 
                    <select id="pen1-select"><option value="">Velg...</option></select>
                </div>
                <div class="role-row">
                    <span>Straffe 2:</span> 
                    <select id="pen2-select"><option value="">Velg...</option></select>
                </div>
                <div class="role-row">
                    <span>Corner Venstre:</span> 
                    <select id="corV-select"><option value="">Velg...</option></select>
                </div>
                <div class="role-row">
                    <span>Corner Høyre:</span> 
                    <select id="corH-select"><option value="">Velg...</option></select>
                </div>
            </div>

            <div class="tactic-card">
                <h3><i class="fa-solid fa-arrows-to-dot"></i> Corner-instrukser</h3>
                <div style="margin-bottom: 10px;">
                    <label style="font-size: 0.8rem; font-weight: 700; color: #2d5a27;">OFFENSIV:</label>
                    <textarea id="off-corner-text" placeholder="Hva gjør vi på offensiv corner?"></textarea>
                </div>
                <div>
                    <label style="font-size: 0.8rem; font-weight: 700; color: #c62828;">DEFENSIV:</label>
                    <textarea id="def-corner-text" placeholder="Hva gjør vi på defensiv corner?"></textarea>
                </div>
            </div>

            <div class="tactic-card">
                <h3><i class="fa-solid fa-couch"></i> Benken</h3>
                <div id="bench-list" style="margin-bottom: 15px;">
                    <!-- Badges for spillere på benken genereres her -->
                </div>
                <label style="font-size: 0.8rem; font-weight: 700;">BYTTEPLAN / NOTATER:</label>
                <textarea id="sub-plan-text" placeholder="Planlagte bytter eller tidspunkter..."></textarea>
            </div>

            <button onclick="TaktikkModul.lagreTaktikk()" class="btn-save">
                <i class="fa-solid fa-floppy-disk"></i> LAGRE HELE KAMPLANEN
            </button>
        </div>
    </div>

    <script src="navigation.js"></script>
    <script type="module" src="taktikk.js"></script>
</body>
</html>
