<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BSK Fotball - Taktikk</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Taktikk-spesifikke stiler */
        .taktikk-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
            padding: 0 10px;
        }

        .phase-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            background-color: #f0f0f0;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .phase-btn.active {
            background-color: #2d5a27;
            color: white;
        }

        /* BANEN */
        .pitch-container {
            width: 95%;
            max-width: 500px;
            margin: 0 auto;
            background-color: #a8d5ba;
            position: relative;
            aspect-ratio: 3/4;
            border: 2px solid #fff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            overflow: hidden; /* Holder markeringene innenfor banen */
        }

        /* FELLES FOR ALLE MARKERINGER */
        .pitch-line {
            position: absolute;
            pointer-events: none;
            border: 2px solid rgba(255, 255, 255, 0.6);
            z-index: 1;
        }

        /* MIDTEN */
        .mid-line {
            top: 50%;
            width: 100%;
            height: 0;
            border-bottom: 2px solid rgba(255, 255, 255, 0.6);
        }

        .center-circle {
            top: 50%;
            left: 50%;
            width: 26%; /* Basert på 18.3m diameter på en 70m bane */
            aspect-ratio: 1;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .center-spot {
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        /* BOKSER (16m og 5m) */
        .penalty-area {
            left: 15%;
            width: 70%;
            height: 16%;
            background-color: #a8d5ba; /* Skjuler buen inni boksen */
        }

        .goal-area {
            left: 35%;
            width: 30%;
            height: 6%;
        }

        /* BUEN (The D) */
        .penalty-arc {
            left: 50%;
            width: 26%;
            aspect-ratio: 1;
            border-radius: 50%;
            transform: translateX(-50%);
            z-index: 0; /* Ligger bak penalty-area for "klipping" */
        }

        /* STRAFFEMERKE */
        .penalty-spot {
            left: 50%;
            width: 5px;
            height: 5px;
            background: #fff;
            border-radius: 50%;
            transform: translateX(-50%);
            z-index: 2;
        }

        /* TOPP-MARKERINGER */
        .top-zone .penalty-area { top: 0; border-top: none; }
        .top-zone .goal-area { top: 0; border-top: none; }
        .top-zone .penalty-arc { top: 7%; }
        .top-zone .penalty-spot { top: 11%; }

        /* BUNN-MARKERINGER */
        .bottom-zone .penalty-area { bottom: 0; border-bottom: none; }
        .bottom-zone .goal-area { bottom: 0; border-bottom: none; }
        .bottom-zone .penalty-arc { bottom: 7%; }
        .bottom-zone .penalty-spot { bottom: 11%; }

        /* SPILLER-NODER */
        .player-node {
            position: absolute;
            width: 70px;
            background-color: #93c47d;
            border: 1px solid #444;
            padding: 2px;
            text-align: center;
            z-index: 5; /* Ligger over banemarkeringene */
            transform: translate(-50%, -50%);
            transition: all 0.5s ease-in-out;
        }

        .player-node select {
            width: 100%;
            font-size: 10px;
            border: none;
            background: transparent;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .pos-label {
            font-size: 9px;
            color: #222;
            display: block;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            margin-bottom: 2px;
        }

        .lines-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 3;
        }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar"></div>

    <div class="main-content">
        <div class="top-bar">
            <button class="menu-toggle" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
            <h2 class="section-title">Kamptaktikk</h2>
        </div>

        <div class="taktikk-controls">
            <button class="phase-btn active" onclick="TaktikkModul.byttFase('424', this)">Fase 1 (4-2-4)</button>
            <button class="phase-btn" onclick="TaktikkModul.byttFase('2323', this)">Fase 2 (2-3-2-3)</button>
            <button class="phase-btn" onclick="TaktikkModul.byttFase('325', this)">Fase 3 (3-2-5)</button>
        </div>

        <div class="pitch-container" id="pitch">
            <!-- Markeringer Topp -->
            <div class="top-zone">
                <div class="pitch-line penalty-arc"></div>
                <div class="pitch-line penalty-area"></div>
                <div class="pitch-line goal-area"></div>
                <div class="pitch-line penalty-spot"></div>
            </div>

            <!-- Markeringer Midten -->
            <div class="pitch-line mid-line"></div>
            <div class="pitch-line center-circle"></div>
            <div class="pitch-line center-spot"></div>

            <!-- Markeringer Bunn -->
            <div class="bottom-zone">
                <div class="pitch-line penalty-arc"></div>
                <div class="pitch-line penalty-area"></div>
                <div class="pitch-line goal-area"></div>
                <div class="pitch-line penalty-spot"></div>
            </div>

            <svg class="lines-overlay" id="chemistryLines"></svg>
            <div id="playerLayer"></div>
        </div>
    </div>

    <script src="navigation.js"></script>
    <script type="module">
        import { db } from './firebase-config.js';
        window.firebaseDB = db;
    </script>
    <script type="module" src="taktikk.js"></script>
</body>
</html>
