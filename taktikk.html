<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSK Fotball - Taktikk</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Taktikk-spesifikk CSS */
        .pitch-container {
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            background-color: #a8d5ba;
            position: relative;
            aspect-ratio: 3/4;
            border: 2px solid #fff;
            border-radius: 5px;
            overflow: hidden;
        }

        .player-node {
            position: absolute;
            width: 80px;
            background-color: #93c47d;
            border: 1px solid #555;
            padding: 4px;
            text-align: center;
            font-size: 12px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            z-index: 2;
        }

        .player-node .name { font-weight: bold; border-bottom: 1px solid rgba(0,0,0,0.1); }
        .player-node .stat { text-align: left; font-size: 10px; color: #333; }

        /* Stiplede linjer (SVG) */
        .lines-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar"></div>
    <div class="main-content">
        <div class="top-bar">
            <button class="menu-toggle" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
            <h2 class="section-title">Formasjon</h2>
        </div>

        <div class="pitch-container" id="pitch">
            <svg class="lines-overlay">
                <!-- Linje mellom spisser som i image.png -->
                <line x1="40%" y1="15%" x2="60%" y2="15%" stroke="#444" stroke-width="2" stroke-dasharray="4"/>
            </svg>

            <!-- Eksempel på spillere plassert som i bildet ditt -->
            <div class="player-node" style="top: 10%; left: 10%;">
                <div class="name">J. Salomon</div>
                <div class="stat">78%</div>
            </div>

            <div class="player-node" style="top: 10%; left: 40%;">
                <div class="name">P. Moi</div>
                <div class="stat">78%</div>
            </div>
            
            <!-- Flere spillere legges til her -->
        </div>
    </div>

    <script src="navigation.js"></script>
    <script type="module">
        import { db } from './firebase-config.js';
        import { ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        
        // Her kan vi senere legge inn logikk for å hente 
        // faktiske spillere fra Firebase og plassere dem
    </script>
</body>
</html>
