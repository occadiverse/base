<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base - Design System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for ikoner (brukes i din sidebar) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- DIN SIDEBAR STIL -->
    <aside class="sidebar">
        <div class="nav-links">
            <a href="#" class="nav-item active"><i class="fas fa-vial"></i><span>Test-side</span></a>
            <a href="index.html" class="nav-item"><i class="fas fa-home"></i><span>Hjem</span></a>
        </div>
    </aside>

    <!-- DITT HOVEDINNHOLD STIL -->
    <main class="main-content">
        <div class="top-bar">
            <button class="menu-toggle"><i class="fas fa-bars"></i></button>
            <h2>Design System & Test</h2>
        </div>

        <div class="welcome-hero">
            <div class="hero-content">
                <h2>Element-test</h2>
                <p>Her kan du se hvordan nye elementer ser ut før vi tar de i bruk på statistikk-siden.</p>
            </div>
        </div>

        <!-- TEST AV FILTER-BAR -->
        <div class="dashboard-grid">
            <div class="dash-card" style="display: block !important;">
                <div class="dash-info">
                    <h3>Filter-system</h3>
                    <p>Bruker klassen .base-select</p>
                    <div class="filter-wrapper">
                        <select class="base-select">
                            <option>Mai 2026</option>
                            <option>April 2026</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- TEST AV KJEMI-KORT -->
            <div class="dash-card">
                <div class="dash-icon"><i class="fas fa-hands-helping"></i></div>
                <div class="dash-info">
                    <h3>Kjemi: Sebastian & Viktor</h3>
                    <p>Seiersprosent sammen: 92%</p>
                </div>
                <i class="fas fa-chevron-right arrow"></i>
            </div>
        </div>

        <!-- TEST AV TABELL-STIL -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th class="name-col">Navn</th>
                        <th>Status</th>
                        <th>Score</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="name-col">Sebastian Mørken</td>
                        <td><span class="status-pill">SM</span></td>
                        <td>1.5</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

</body>
</html>
