<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin - BSK Fotball</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=2">
    
    <style>
        .admin-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }
        .admin-section h3 {
            color: var(--bsk-blue);
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid #f1f2f6;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .form-group label {
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--text-main);
        }
        .form-control {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1.5px solid var(--border-color);
            outline: none;
            font-family: inherit;
            font-size: 0.9rem;
        }
        .btn-admin {
            background: var(--bsk-blue);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-admin:hover {
            opacity: 0.9;
        }
        .dynamic-list {
            list-style: none;
            padding: 0;
            margin: 15px 0 0 0;
        }
        .dynamic-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 8px;
            font-weight: 600;
            border: 1px solid var(--border-color);
        }
        .btn-delete-list {
            background: none;
            border: none;
            color: #d63031;
            cursor: pointer;
            font-size: 1rem;
        }
    </style>
</head>
<body>

<header class="top-bar">
    <a href="index.html" class="logo-brand"><i class="fa-solid fa-shield-halved"></i>BSK <span>Fotball</span></a>
    <h1 class="section-title">Konfigurasjon</h1>
    <div class="filter-wrapper"></div> <!-- Holdes tom og ren -->
</header>

<div class="sidebar" id="sidebar"></div>
<nav class="bottom-nav"></nav>

<main class="main-content">
    
    <!-- SEKSJON 1: KLUBB & TRENERINFO -->
    <section class="admin-section">
        <h3><i class="fa-solid fa-circle-info"></i> Trener & Laginfo</h3>
        <form id="clubInfoForm">
            <div class="form-group">
                <label>Hovedtrener</label>
                <input type="text" id="coachName" placeholder="F.eks. Christian" class="form-control">
            </div>
            <div class="form-group">
                <label>Klubbnavn / Divisjon</label>
                <input type="text" id="clubDivision" placeholder="F.eks. BSK - 5. divisjon" class="form-control">
            </div>
            <button type="submit" class="btn-admin"><i class="fa-solid fa-floppy-disk"></i> Lagre innstillinger</button>
        </form>
    </section>

    <!-- SEKSJON 2: DYNAMISK LAGADMINISTRASJON -->
    <section class="admin-section">
        <h3><i class="fa-solid fa-people-group"></i> Administrer Lag i Troppen</h3>
        <form id="addTeamForm" style="display: flex; gap: 10px; align-items: flex-end;">
            <div class="form-group" style="flex: 1; margin-bottom: 0;">
                <label>Nytt lagnavn</label>
                <input type="text" id="newTeamName" placeholder="F.eks. Lag C eller G19" required class="form-control">
            </div>
            <button type="submit" class="btn-admin" style="height: 46px;"><i class="fa-solid fa-plus"></i> Legg til</button>
        </form>
        
        <ul id="teamListDisplay" class="dynamic-list">
            <!-- Her strømmes lagene ut live fra Firebase -->
        </ul>
    </section>

</main>

<script type="module" src="test.js"></script>
<script src="navigation.js"></script>

</body>
</html>
