<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSK Test - Design System</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- FIX 1: Legg til klassen 'collapsed' her, ellers står den alltid åpen -->
    <div id="sidebar" class="sidebar collapsed">
        <div class="nav-links">
            <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Hjem</span></a>
            <a href="#" class="nav-item active"><i class="fa-solid fa-flask"></i><span>Test-side</span></a>
        </div>
    </div>

    <main class="main-content">
        <header class="top-bar">
            <!-- Menyknapp (Hamburger) -->
            <button class="menu-toggle" onclick="toggleMenu()">
                <i class="fa-solid fa-bars"></i>
            </button>
    
            <!-- Overskrift -->
            <h1 class="section-title">Statistikk</h1>

            <!-- Filter (Ligger fast til høyre) -->
            <div class="filter-wrapper" style="margin-left: auto;">
                <select class="base-select" id="period-filter">
                    <option value="total">2026</option>
                    <option value="05">Mai</option>
                </select>
            </div>
        </header>

        <section class="welcome-hero">
            <div class="hero-content">
                <h2>Oversikt & Kjemi</h2>
                <p>Her tester vi hvordan den nye tabellen med Assists og Kjemi-kortene ser ut i ditt format.</p>
            </div>
        </section>

        <div class="dashboard-grid">
            <div class="dash-card">
                <div class="dash-icon"><i class="fa-solid fa-hands-holding-circle"></i></div>
                <div class="dash-info">
                    <h3>Beste Duo</h3>
                    <p>Sebastian & Viktor (92%)</p>
                </div>
                <i class="fa-solid fa-chevron-right arrow"></i>
            </div>

            <div class="table-container" style="grid-column: 1 / -1; margin-top: 20px;">
                <table style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr style="background-color: #f8f9fa;">
                            <th class="name-col">Spiller</th>
                            <th>K</th>
                            <th>M</th>
                            <th>A</th>
                            <th>MVP</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="name-col">Sebastian Mørken</td>
                            <td>12</td>
                            <td>5</td>
                            <td>3</td>
                            <td style="color: var(--primary); font-weight: 700;">1.5</td>
                        </tr>
                        <tr>
                            <td class="name-col">Peder Vegsund</td>
                            <td>10</td>
                            <td>2</td>
                            <td>8</td>
                            <td style="color: var(--primary); font-weight: 700;">1.2</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- FIX 3: Husk å inkludere scriptene dine nederst så funksjonene virker! -->
    <script src="navigation.js"></script>
    <script src="script.js"></script>
</body>
</html>
