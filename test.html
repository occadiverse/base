<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <title>Oppmøte - BSK Fotball</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Refererer kun til dine eksisterende stilark, akkurat som spillere.html -->
    <link rel="stylesheet" href="style.css?v=2">
    
    <style>
        /* Kun den spesifikke fargen for kamp-merket i tabellheaderen */
        .day-type-match { background: #dbeafe; color: var(--bsk-blue); }
    </style>
</head>
<body>

    <header class="top-bar">
        <a href="index.html" class="logo-brand"><i class="fa-solid fa-shield-halved"></i>BSK <span>Fotball</span></a>
        <h1 id="section-title" class="section-title">Oppmøte</h1>
        
        <div class="filter-wrapper">
            <div class="filter-container">
                <select id="statPeriodSelect" class="base-select"></select>
            </div>

            <div class="filter-container">
                <select id="lagFilterSelect" class="base-select">
                    <option value="Alle">ALLE</option>
                    <option value="Lag A">LAG A</option>
                    <option value="Lag B">LAG B</option>
                </select>
            </div>
        </div>
    </header>
    
    <aside id="sidebar" class="sidebar"></aside>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Hjem</span>
        </a>
        <a href="oppmote.html" class="nav-item active">
            <i class="fa-solid fa-calendar-check"></i>
            <span>Oppmøte</span>
        </a>
        <a href="kamper.html" class="nav-item">
            <i class="fa-solid fa-soccer-ball"></i>
            <span>Kamper</span>
        </a>
        <a href="spillere.html" class="nav-item">
            <i class="fa-solid fa-users"></i>
            <span>Tropp</span>
        </a>
        <a href="statistikk.html" class="nav-item">
            <i class="fa-solid fa-chart-line"></i>
            <span>Stats</span>
        </a>
    </nav>

    <main class="main-content">
        <!-- Bruker klassen oppmote-hero som styles via style.css -->
        <section class="oppmote-hero">
            <div class="hero-content">
                <p class="hero-intro-text">
                    Valgt gruppe har gjennomført <strong id="stat-total-events">0</strong> økter denne sesongen. 
                    Gjennomsnittlig oppmøte ligger på <strong id="stat-avg-attendance">0%</strong>, 
                    og vår mest aktive spiller har vært med på <strong id="stat-top-attendance">0</strong> økter.
                </p>
            </div>
        </section>

        <div class="table-container">
            <table id="attendanceTable" class="matrix-table">
                <thead id="attendanceHeader"></thead>
                <tbody id="attendanceBody"></tbody>
            </table>
        </div>
    </main>

    <!-- Registrer ny økt -->
    <button class="fab-btn" onclick="window.openAttendanceModal()" title="Registrer ny økt">
        <i class="fa-solid fa-plus"></i>
    </button>

    <!-- Modal for ny aktivitet - Strukturert med dine faste form-klasser -->
    <div id="attendanceModal" class="modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="color: var(--bsk-blue); margin:0;">Ny aktivitet</h3>
                <button onclick="window.closeAttendanceModal()" style="background:none; border:none; font-size: 24px; cursor:pointer; color: var(--text-muted);">&times;</button>
            </div>
            
            <form id="attendanceForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Dato</label>
                        <input type="date" id="eventDate" required class="form-control">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Type økt</label>
                        <select id="eventType" class="form-control">
                            <option value="Trening">Trening</option>
                            <option value="Kamp">Kamp</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>For hvilket lag?</label>
                        <select id="eventGroup" class="form-control">
                            <option value="Alle">Alle</option>
                            <option value="Lag A">Lag A</option>
                            <option value="Lag B">Lag B</option>
                        </select>
                    </div>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit" style="flex:2; background: var(--bsk-blue); color: white; padding:14px; border:none; border-radius:12px; font-weight:700; cursor: pointer;">LAGRE ØKT</button>
                    <button type="button" onclick="window.closeAttendanceModal()" style="flex:1; background: var(--bg-light); padding:14px; border:none; border-radius:12px; font-weight:600; cursor: pointer;">AVBRYT</button>
                </div>
            </form>
        </div>
    </div>

    <script src="navigation.js"></script>
    <script type="module" src="oppmote.js"></script>

    <script>
        window.openAttendanceModal = () => {
            document.getElementById('attendanceModal').style.display = 'flex';
            document.getElementById('eventDate').valueAsDate = new Date();
        };
        
        window.closeAttendanceModal = () => {
            document.getElementById('attendanceModal').style.display = 'none';
            document.getElementById('attendanceForm').reset();
        };

        window.onclick = function(event) {
            const modal = document.getElementById('attendanceModal');
            if (event.target === modal) {
                window.closeAttendanceModal();
            }
        };
    </script>
</body>
</html>
