            </div>

            <!-- Main Nav Links -->
            <nav class="space-y-2">

                    <i class="fa-solid fa-calendar-days w-5 text-center"></i>

                <a href="#" id="sidebar-oppmote" onclick="switchTab('oppmote')" class="tab-link flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-bsk-blueLight/50 text-slate-300 hover:text-white transition-all">

                <a href="#" id="sidebar-spillere" onclick="switchTab('spillere')" class="tab-link flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-bsk-blueLight/50 text-slate-300 hover:text-white transition-all">
                    <i class="fa-solid fa-star w-5 text-center"></i>
                    <span>Spillerbørs</span>

                <a href="#" id="sidebar-tropp" onclick="switchTab('tropp')" class="tab-link flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-bsk-blueLight/50 text-slate-300 hover:text-white transition-all">

                <a href="#" id="sidebar-statistikk" onclick="switchTab('statistikk')" class="tab-link flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-bsk-blueLight/50 text-slate-300 hover:text-white transition-all">

        <div class="border-t border-slate-700 pt-4 text-xs text-slate-400">
            <p class="font-semibold">Bækkelagets Sportsklub</p>
            <p>© 2026 App Utvikling</p>
        </div>
    </aside>
<body>

<header class="top-bar">
    <a href="index.html" class="logo-brand"><i class="fa-solid fa-shield-halved"></i>BSK <span>Fotball</span></a>
    <h1 class="section-title">Konfigurasjon</h1>
    <div class="filter-wrapper"></div> <!-- Holdes tom og ren -->
</header>

<div class="sidebar" id="sidebar"></div>
<nav class="bottom-nav"></nav>

<main class="main-content">
    
    <!-- SEKSJON 1: KLUBB & TRENERINFO -->
    <section class="admin-section">
        <h3><i class="fa-solid fa-circle-info"></i> Trener & Laginfo</h3>
        <form id="clubInfoForm">
            <div class="form-group">
                <label>Hovedtrener</label>
                <input type="text" id="coachName" placeholder="F.eks. Christian" class="form-control">
            </div>
            <div class="form-group">
                <label>Klubbnavn / Divisjon</label>
                <input type="text" id="clubDivision" placeholder="F.eks. BSK - 5. divisjon" class="form-control">
            </div>
            <button type="submit" class="btn-admin"><i class="fa-solid fa-floppy-disk"></i> Lagre innstillinger</button>
        </form>
    </section>

    <!-- SEKSJON 2: DYNAMISK LAGADMINISTRASJON -->
    <section class="admin-section">
        <h3><i class="fa-solid fa-people-group"></i> Administrer Lag i Troppen</h3>
        <form id="addTeamForm" style="display: flex; gap: 10px; align-items: flex-end;">
            <div class="form-group" style="flex: 1; margin-bottom: 0;">
                <label>Nytt lagnavn</label>
                <input type="text" id="newTeamName" placeholder="F.eks. Lag C eller G19" required class="form-control">
            </div>
            <button type="submit" class="btn-admin" style="height: 46px;"><i class="fa-solid fa-plus"></i> Legg til</button>
        </form>
        
        <ul id="teamListDisplay" class="dynamic-list">
            <!-- Her strømmes lagene ut live fra Firebase -->
        </ul>
    </section>

</main>

<script type="module" src="test.js"></script>
<script src="navigation.js"></script>

</body>
</html>
