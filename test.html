<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TEST - Databasevask Sjekk</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=2">
    
    <style>
        .test-banner {
            background: #fff3cd;
            color: #856404;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #ffeeba;
            font-weight: 600;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        .vasket-badge {
            background: #d4edda !important;
            color: #155724 !important;
            border: 1px solid #c3e6cb;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 6px;
        }
        .uvasket-badge {
            background: #f8d7da !important;
            color: #721c24 !important;
            border: 1px solid #f5c6cb;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 6px;
        }
        .table-container { 
            overflow-x: auto; 
            background: white; 
            border-radius: 15px; 
            margin: 20px 0;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }
        #attendanceTable { width: 100%; border-collapse: collapse; }
        #attendanceTable th, #attendanceTable td { padding: 14px; border-bottom: 1px solid #eef2f6; text-align: left; }
        #attendanceTable th { background: #f8f9fa; font-weight: 800; color: #1e293b; }
        .name-col { font-weight: 700; color: var(--text-main); }
    </style>
</head>
<body>

<main class="main-content" style="padding: 20px; max-width: 800px; margin: 0 auto;">
    <div class="test-banner">
        <i class="fa-solid fa-flask" style="color: #e6a23c; font-size: 1.1rem;"></i> <strong>TESTSIDE: Verifisering av databasevask</strong><br>
        • <span style="color: #155724;">Grønne spillere</span> har fått 2026-historikk i Firebase.<br>
        • <span style="color: #721c24;">Røde spillere</span> mangler mappen, og koden må foreløpig "gjette" lagtilhørighet.
    </div>

    <div class="table-container">
        <table id="attendanceTable">
            <thead>
                <tr>
                    <th>Spiller i troppen</th>
                    <th>Registrert Gruppe (2026)</th>
                    <th>Status i systemet</th>
                </tr>
            </thead>
            <tbody id="testBody">
                <tr>
                    <td colspan="3" style="text-align:center; color:var(--text-muted);">Kobler til Firebase...</td>
                </tr>
            </tbody>
        </table>
    </div>
    
    <a href="oppmote.html" style="display:inline-block; margin-top:20px; background:var(--bsk-blue); color:white; padding:12px 20px; border-radius:10px; text-decoration:none; font-weight:700; font-size:0.9rem;">
        <i class="fa-solid fa-arrow-left"></i> Tilbake til live oppmøte
    </a>
</main>

<!-- HUSK: Endre filnavnet under hvis test-js-filen din heter noe annet -->
<script type="module" src="test-oppmote.js?v=1"></script>
</body>
</html>
