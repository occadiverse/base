<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bækkelaget SK Fotball 2026</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Legg dette i <style> blokken i index.html */
.menu-card {
    border: none;
    background: white;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.menu-card:hover {
    transform: translateY(-10px) scale(1.02);
    box-shadow: var(--hover-shadow);
    background: linear-gradient(to bottom, #ffffff 0%, #f8f9fa 100%);
}

.menu-card i {
    background: #f0f7ff;
    width: 80px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    border-radius: 50%;
    font-size: 35px;
    color: var(--primary-color);
}
        /* Dashbord-spesifikk stil som passer med style.css */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }

        .menu-card {
            background: var(--card-bg);
            padding: 40px 20px;
            border-radius: var(--border-radius);
            text-align: center;
            text-decoration: none;
            color: var(--text-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #eee;
            display: block;
        }

        .menu-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            border-color: var(--primary-color);
        }

        .menu-card i {
            font-size: 40px;
            display: block;
            margin-bottom: 15px;
            font-style: normal;
        }

        .menu-card h3 {
            margin: 0;
            color: var(--primary-color);
            font-size: 22px;
        }

        .menu-card p {
            margin-top: 10px;
            color: #666;
            font-size: 14px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>Bækkelaget SK Fotball 2026</h1>
</div>

<div class="container">
    <div class="dashboard-grid">
        
        <a href="oppmote.html" class="menu-card">
            <i>📅</i>
            <h3>Oppmøte</h3>
            <p>Registrer trening og kamp. Se hvem som er her i dag.</p>
        </a>

        <a href="spillere.html" class="menu-card">
            <i>👥</i>
            <h3>Spillerstall</h3>
            <p>Administrer spillere, draktnummer og kontaktinfo.</p>
        </a>

        <a href="statistikk.html" class="menu-card">
            <i>📊</i>
            <h3>Statistikk</h3>
            <p>Se hvem som er treningskongen og har høyest oppmøte i 2026.</p>
        </a>

    </div>
</div>

</body>
</html>
