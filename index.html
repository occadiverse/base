<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oppmøteregistrering</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3><i class="fa-solid fa-calendar-check"></i> Meny</h3>
            <button class="menu-toggle" onclick="toggleMenu()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <div class="sidebar-content">
            <div class="menu-group">
                <label>Person</label>
                <input type="text" id="nameInput" placeholder="Navn...">
                <button class="btn" onclick="addName()">Legg til person</button>
            </div>
            <div class="menu-group">
                <label>Dato</label>
                <input type="date" id="dateInput">
                <button class="btn" onclick="addDate()">Legg til dato</button>
            </div>
            <button class="btn btn-danger" onclick="clearData()">Tøm oversikt</button>
        </div>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <button class="menu-toggle" id="openBtn" onclick="toggleMenu()" style="display:none;">
                <i class="fa-solid fa-bars"></i>
            </button>
            <h2 style="margin:0;">Oppmøteregistrering</h2>
        </div>
        <div class="table-container">
            <table id="attendanceTable">
                <thead><tr id="tableHeader"><th>Navn / Dato</th></tr></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
