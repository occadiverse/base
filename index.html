<!DOCTYPE html>
<html lang="no" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OCCA - BSK Fotball</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="assets/js/config/tailwind.config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/base.css">
</head>
<body class="flex flex-col md:flex-row min-h-screen text-slate-800">
    <div id="portal-sidebar"></div>
    <div id="portal-mobile-header"></div>

    <div class="flex-1 flex flex-col min-w-0 pb-20 md:pb-0 overflow-y-auto">
        <div id="portal-action-bar"></div>
        <main class="flex-1 px-4 py-6 md:px-8 md:pt-4 md:pb-8 w-full" id="main-view">
            
            <!-- FORSIDE / DASHBOARD REDESIGN -->
            <div id="view-hjem" class="space-y-6">
                <div id="hjem-hero-match-container">
                </div>
                <!-- BUNNSEKSJON: TRENING & ENGASJEMENT (50/50 SPLITT) -->
                <div id="hjem-bottom-widgets" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <!-- Det nye, delte innholdet genereres automatisk av JavaScript her -->
                </div>
            </div> <!-- Dette er den lukkende taggen for view-hjem -->
                        
            <div id="view-kamper" class="hidden space-y-6">
                <div class="w-full flex justify-center mb-6 mt-2">
                    <div class="flex items-center gap-2 max-w-full overflow-x-auto hide-scrollbar px-4 md:px-0">
                    
                        <div class="bg-slate-200/70 p-1 rounded-xl inline-flex text-xs font-bold shadow-sm shrink-0 h-10">
                            <button type="button" onclick="setMatchTimeFilter('kommende')" id="btn-filter-kommende" class="px-4 h-full rounded-lg transition-all text-bsk-blue bg-white shadow-sm shrink-0">
                                Kommende
                            </button>
                            <button type="button" onclick="setMatchTimeFilter('tidligere')" id="btn-filter-tidligere" class="px-4 h-full rounded-lg transition-all text-slate-500 hover:text-slate-800 shrink-0">
                                Tidligere
                            </button>
                        </div>

                        <div class="bg-white border border-slate-200 rounded-xl px-3 flex items-center shadow-sm shrink-0 h-10 hover:border-bsk-blueLight transition-colors">
                            <i class="fa-solid fa-users text-slate-400 text-[10px] mr-2"></i>
                            <select id="kamperLagFilterSelect" onchange="applyFilters()" class="bg-transparent text-xs font-black text-slate-600 outline-none cursor-pointer appearance-none">
                                <option value="Alle">ALLE LAG</option>
                            </select>
                            <i class="fa-solid fa-chevron-down text-slate-400 text-[9px] ml-2 pointer-events-none"></i>
                        </div>

                    </div>
                </div>

            <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse" id="matchTable">
                        <thead>
                            <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 text-[11px] font-bold uppercase tracking-wider">
                                <th class="py-4 px-4 md:px-6">Motstander</th> 
                                <th class="py-4 px-4 text-center w-24">Dato</th>
                                <th class="py-4 px-2 text-center w-16">Kl.</th>
                                <th class="py-4 px-4 text-center w-20">Resultat</th>
                                <th class="py-4 px-6 text-left hidden lg:table-cell">Bane</th>
                                <th class="py-4 px-6 text-left hidden lg:table-cell">Type</th>
                                <th class="py-4 px-4 md:px-6 w-12"></th>
                            </tr>
                        </thead>
                        <tbody id="matchTableBody" class="divide-y divide-slate-100 text-sm">
                    </tbody>
            </table>
        </div>
        
        <div id="no-matches-view" class="hidden py-16 px-4 text-center text-slate-400">
            <i class="fa-solid fa-futbol text-4xl mb-3 text-slate-300"></i>
            <p class="font-bold text-slate-600">Ingen kamper funnet</p>
            <p class="text-xs mt-1">Du kan registrere en ny kamp ved å trykke på plussknappen eller i Admin-panelet.</p>
        </div>
    </div>
</div>
            <div id="view-kampdetaljer" class="hidden space-y-6 max-w-4xl mx-auto w-full">
                <div class="flex items-center mb-2">
                    <button onclick="switchTab('kamper')" class="bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 px-4 py-2 rounded-xl transition shadow-sm font-bold text-xs flex items-center gap-2">
                        <i class="fa-solid fa-arrow-left"></i> Tilbake til terminlisten
                    </button>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="bg-slate-50 border-b border-slate-200 p-5 md:p-6 flex justify-between items-center">
                        <h2 id="kampdetaljer-title" class="font-black text-xl md:text-2xl text-bsk-blue uppercase tracking-tight">Kamp mot ...</h2>
                        <div class="flex gap-2">
                            <button id="btnEditKampdetaljer" class="bg-white border border-slate-200 hover:bg-slate-50 text-slate-500 hover:text-amber-500 w-10 h-10 rounded-xl transition shadow-sm flex items-center justify-center" title="Rediger">
                                <i class="fa-solid fa-pen text-sm"></i>
                            </button>
                            <button id="btnDeleteKampdetaljer" class="bg-white border border-slate-200 hover:bg-rose-50 text-slate-500 hover:text-rose-500 w-10 h-10 rounded-xl transition shadow-sm flex items-center justify-center" title="Slett">
                                <i class="fa-solid fa-trash text-sm"></i>
