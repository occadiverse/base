<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BSK Fotball - Hjem</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sidebar" id="sidebar"></div>

    <div class="main-content">
        <div class="top-bar">
            <button class="menu-toggle" onclick="toggleMenu()">
                <i class="fa-solid fa-bars"></i>
            </button>
            <h2 class="section-title">BSK Herrer A-lag</h2>
        </div>

        <div class="dashboard-grid">
            <a href="oppmote.html" class="dash-card">
                <div class="dash-icon"><i class="fa-solid fa-calendar-check"></i></div>
                <div class="dash-info">
                    <h3>Oppmøte</h3>
                    <p>Registrer dagens trening eller kamp</p>
                </div>
                <i class="fa-solid fa-chevron-right arrow"></i>
            </a>

            <a href="statistikk.html" class="dash-card">
                <div class="dash-icon"><i class="fa-solid fa-chart-line"></i></div>
                <div class="dash-info">
                    <h3>Statistikk</h3>
                    <p>Se hvem som topper lista denne måneden</p>
                </div>
                <i class="fa-solid fa-chevron-right arrow"></i>
            </a>

            <a href="spillere.html" class="dash-card">
                <div class="dash-icon"><i class="fa-solid fa-users"></i></div>
                <div class="dash-info">
                    <h3>Spillerstall</h3>
                    <p>Administrer spillere og informasjon</p>
                </div>
                <i class="fa-solid fa-chevron-right arrow"></i>
            </a>
        </div>
    </div>

    <script src="navigation.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof loadNavigation === 'function') loadNavigation();
        });
    </script>
</body>
</html>
