<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proff Spillerregistrering</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --border: #e5e7eb;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 { margin: 0; font-size: 1.5rem; color: var(--primary); }

        .controls { display: flex; gap: 10px; }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        button:hover { background-color: var(--primary-hover); }
        button.secondary { background-color: #6b7280; }

        .table-container {
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        th { background: #f9fafb; font-size: 0.8rem; text-transform: uppercase; color: #6b7280; }

        .sticky-col {
            position: sticky;
            left: 0;
            background: white;
            z-index: 5;
            border-right: 2px solid var(--border);
            font-weight: 600;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        tr:hover td { background-color: #f9fafb; }
        tr:hover .sticky-col { background-color: #f9fafb; }

        .delete-btn {
            color: #ef4444;
            cursor: pointer;
            font-size: 0.8rem;
            margin-left: 10px;
            background: none;
            border: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Spillerregistrering</h1>
        <div class="controls">
            <button onclick="addDate()">+ Ny dato</button>
            <button onclick="addPlayer()">+ Ny spiller</button>
            <button class="secondary" onclick="resetData()">Nullstill</button>
        </div>
    </header>

    <div class="table-container">
        <table id="attendanceTable">
            <thead>
                <tr id="headerRow">
                    <th class="sticky-col">Spiller</th>
                    </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>
</div>

<script>
    // Initial data - Hent fra localStorage eller bruk standard
    let data = JSON.parse(localStorage.getItem('attendanceDB')) || {
        dates: ["01.05", "03.05"],
        players: [
            { name: "Ole Nordmann", attendance: [true, false] },
            { name: "Kari Nordmann", attendance: [true, true] }
        ]
    };

    function saveData() {
        localStorage.setItem('attendanceDB', JSON.stringify(data));
        renderTable();
    }

    function addPlayer() {
        const name = prompt("Navn på spiller:");
        if (name) {
            data.players.push({
                name: name,
                attendance: new Array(data.dates.length).fill(false)
            });
            saveData();
        }
    }

    function addDate() {
        const date = prompt("Dato (f.eks. 05.05):");
        if (date) {
            data.dates.push(date);
            data.players.forEach(p => p.attendance.push(false));
            saveData();
        }
    }

    function toggleAttendance(playerIndex, dateIndex) {
        data.players[playerIndex].attendance[dateIndex] = !data.players[playerIndex].attendance[dateIndex];
        saveData();
    }

    function removePlayer(index) {
        if(confirm("Slette spiller?")) {
            data.players.splice(index, 1);
            saveData();
        }
    }

    function renderTable() {
        const headerRow = document.getElementById('headerRow');
        const tableBody = document.getElementById('tableBody');

        // Render Headere
        headerRow.innerHTML = '<th class="sticky-col">Spiller</th>';
        data.dates.forEach(date => {
            headerRow.innerHTML += `<th>${date}</th>`;
        });

        // Render Rader
        tableBody.innerHTML = '';
        data.players.forEach((player, pIdx) => {
            let row = `<tr><td class="sticky-col">${player.name} <button class="delete-btn" onclick="removePlayer(${pIdx})">x</button></td>`;
            
            player.attendance.forEach((present, dIdx) => {
                row += `<td><input type="checkbox" ${present ? 'checked' : ''} onchange="toggleAttendance(${pIdx}, ${dIdx})"></td>`;
            });
            
            row += '</tr>';
            tableBody.innerHTML += row;
        });
    }

    function resetData() {
        if(confirm("Vil du slette alt?")) {
            localStorage.clear();
            location.reload();
        }
    }

    // Start siden
    renderTable();
</script>

</body>
</html>
