<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hjem - Oversikt</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sidebar" id="sidebar"></div>

    <div class="main-content">
        <div class="top-bar">
            <button class="menu-toggle is-hidden" id="openBtn" onclick="toggleMenu()">
                <i class="fa-solid fa-bars"></i>
            </button>
            <h2 class="section-title">Bækkelaget SK Fotball</h2>
        </div>

        <div class="table-container home-container">
            <h1>Velkommen til ditt administrasjonspanel</h1>
            <p>Her kan du holde styr på dine prosjekter og registreringer.</p>

            <div class="quick-info-box">
                <h3><i class="fa-solid fa-circle-info"></i> Hurtiginfo</h3>
                <p>Bruk menyen til venstre for å navigere. For å registrere hvem som er tilstede i dag, trykk på knappen <strong>"Gå til Oppmøte"</strong>.</p>
            </div>
        </div>
    </div>

    <script src="database.js"></script>
    <script src="navigation.js"></script>
</body>
</html>
