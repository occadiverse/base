<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <meta name="description" content="BSK Fotball Herrer A lag - Administrasjon av lag, taktikk, oppmøte og statistikk">
    <title>BSK Fotball Herrer - A lag</title>
    
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

    <header class="top-bar">
        <a href="index.html" class="logo-brand"><i class="fa-solid fa-shield-halved"></i>BSK <span>A-LAG</span></a>
        <h1 id="section-title" class="section-title"></h1>
        <div class="filter-wrapper">
            <div class="filter-container">
                <i class="fa-solid fa-calendar-day"></i>
                <select class="base-select">
                    <option>SESONG 2026</option>
                    <option>MAI</option>
                </select>
            </div>
        </div>
    </header>

    <aside id="sidebar" class="sidebar"></aside>

    <nav class="bottom-nav"></nav>

    <main class="main-content">
        <section class="welcome-hero">
            <div class="hero-content">
                <h2>Velkommen, Christian</h2>
                <p>BSK Fotball Herrer A-lag: Ditt digitale kontrollsenter for kampanalyse og troppsledelse.</p>
            </div>
        </section>

        <div class="dashboard-grid">
            
            <div class="table-container" id="nextMatchCard" style="grid-column: 1 / -1; padding: 25px; text-align: left;">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px;">
                    <div>
                        <span class="day-type day-type-match" style="display: inline-block; margin-bottom: 8px; font-weight: 700; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.05em;">
                            Neste Kamp
                        </span>
                        <h3 id="dashNextOpponent" style="font-size: 1.8rem; font-weight: 900; color: var(--text-main); margin: 0; line-height: 1.2;">
                            Søker etter kamper...
                        </h3>
                    </div>
                    <div style="background: var(--active-bg); padding: 12px; border-radius: 12px; text-align: center; min-width: 70px;">
                        <i class="fa-solid fa-soccer-ball" style="font-size: 1.4rem; color: var(--bsk-blue);"></i>
                    </div>
                </div>

                <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; font-weight: 600; color: var(--text-main); font-size: 0.95rem;">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <i class="fa-solid fa-calendar-days" style="color: var(--bsk-blue); width: 20px;"></i>
                        <span id="dashNextDate">Laster dato...</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <i class="fa-solid fa-clock" style="color: var(--bsk-blue); width: 20px;"></i>
                        <span id="dashNextTime">Laster klokkeslett...</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <i class="fa-solid fa-location-dot" style="color: var(--bsk-blue); width: 20px;"></i>
                        <span id="dashNextPitch">Laster bane...</span>
                    </div>
                </div>

                <button onclick="window.location.href='kamper.html'" class="show-all-btn" style="margin: 0; background: var(--bsk-blue); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 700; width: 100%; text-align: center; cursor: pointer;">
                    <i class="fa-solid fa-clipboard-list" style="margin-right: 8px;"></i> GÅ TIL KAMPFORBEREDELSER
                </button>
            </div>
            
        </div>
    </main>

    <script src="navigation.js"></script>
    <script type="module" src="index.js"></script>
</body>
</html>
