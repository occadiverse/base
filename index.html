<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - BSK Fotball</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar" id="sidebar"></div>

<div class="main-content">
    <div class="top-bar">
        <button class="menu-toggle" onclick="toggleMenu()">
            <i class="fa-solid fa-bars"></i>
        </button>
        <h2 class="section-title">Dashboard</h2>
    </div>

    <div class="table-container">
        <div class="welcome-header">
            <h1>Velkommen til BSK Oppmøte</h1>
            <p>Her er en rask oversikt over status for troppen.</p>
        </div>

        <div class="dashboard-grid">
            <div class="stat-card">
                <i class="fa-solid fa-users"></i>
                <div class="stat-value" id="statActivePlayers">0</div>
                <div class="stat-label">Aktive spillere</div>
            </div>

            <div class="stat-card">
                <i class="fa-solid fa-calendar-day"></i>
                <div class="stat-value" id="statMonthlyAttendance">0%</div>
                <div class="stat-label">Oppmøte denne mnd</div>
            </div>

            <div class="stat-card">
                <i class="fa-solid fa-dumbbell"></i>
                <div class="stat-value" id="statSessions">0</div>
                <div class="stat-label">Økter registrert i år</div>
            </div>

            <div class="stat-card">
                <i class="fa-solid fa-trophy"></i>
                <div class="stat-value" id="statTopPlayer" style="font-size: 1.2rem; margin-top: 10px;">Laster...</div>
                <div class="stat-label">Treningskonge (i år)</div>
            </div>
        </div>

        <div style="margin-top: 40px; display: flex; gap: 15px;">
            <button class="btn" onclick="location.href='oppmote.html'">
                <i class="fa-solid fa-clipboard-user"></i> Gå til registrering
            </button>
            <button class="btn btn-muted" onclick="location.href='spillere.html'">
                <i class="fa-solid fa-user-gear"></i> Administrer spillere
            </button>
        </div>
    </div>
</div>

<script src="database.js"></script>
<script src="navigation.js"></script>
<script src="dashboard.js"></script>

</body>
</html>
