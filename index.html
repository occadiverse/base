<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hjem - Oversikt</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3><i class="fa-solid fa-house"></i> Navigasjon</h3>
            <button class="menu-toggle" onclick="toggleMenu()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <div class="sidebar-content">
            <div class="menu-group">
                <label>Sider</label>
                <button class="btn" onclick="location.href='index.html'">Hjem</button>
                <button class="btn" onclick="location.href='oppmote.html'" style="background: #2ecc71;">Gå til Oppmøte</button>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <button class="menu-toggle" id="openBtn" onclick="toggleMenu()" style="display:none;">
                <i class="fa-solid fa-bars"></i>
            </button>
            <h2 style="margin:0;">Velkommen</h2>
        </div>

        <div class="table-container" style="max-width: 800px;">
            <h1>Velkommen til ditt administrasjonspanel</h1>
            <p>Her kan du holde styr på dine prosjekter og registreringer.</p>
            
            <div style="background: #f8f9fa; padding: 20px; border-radius: 12px; border-left: 5px solid #3498db; margin-top: 30px;">
                <h3><i class="fa-solid fa-circle-info"></i> Hurtiginfo</h3>
                <p>Bruk menyen til venstre for å navigere. For å registrere hvem som er tilstede i dag, trykk på knappen <strong>"Gå til Oppmøte"</strong>.</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
