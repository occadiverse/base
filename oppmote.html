<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oppmøte - BSK Fotball</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar" id="sidebar"></div>

<div class="main-content">
    <div class="top-bar">
        <button class="menu-toggle" id="menuBtn" onclick="toggleMenu()">
            <i class="fa-solid fa-bars"></i>
        </button>
        <h2 class="section-title">Oppmøteregistrering</h2>
        
        <div class="top-bar-actions push-right">
            <input type="date" id="dateInput" class="date-picker">
            <button class="btn btn-inline-icon" onclick="addDate()">
                <i class="fa-solid fa-plus"></i> Legg til dato
            </button>
        </div>
    </div>

    <div class="filter-bar">
        <div class="filter-group">
            <label for="monthSelect">Velg måned:</label>
            <select id="monthSelect" class="select-input"></select>
        </div>
        <div class="info-badge">
            Sesongen <span id="currentYearLabel"></span>
        </div>
    </div>

    <div class="table-container">
        <table id="attendanceTable">
            <thead id="tableHead">
                </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>

    <div class="action-footer">
        <button class="btn btn-danger btn-small" onclick="clearData()">
            <i class="fa-solid fa-trash-can"></i> Nullstill data
        </button>
        <p class="help-text">Klikk på dato-overskriften for å endre type (T=Trening, K=Kamp, -=Ingen). Klikk på status i tabellen for å endre oppmøte.</p>
    </div>
</div>

<script src="database.js"></script>
<script src="navigation.js"></script>
<script src="script.js"></script>

</body>
</html>
