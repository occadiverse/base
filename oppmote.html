<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oppmøte - BSK Fotball</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="stylesheet" href="modals.css?v=2">
    
    <style>
        /* BSK-blå Hero - Identisk med kamper.html */
        .oppmote-hero {
            background: linear-gradient(135deg, var(--bsk-blue) 0%, #003366 100%);
            border-radius: 20px;
            padding: 40px;
            color: white;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 86, 179, 0.2);
        }

        .hero-intro-text { font-size: 1.2rem; opacity: 0.9; max-width: 800px; line-height: 1.6; margin: 0; }
        .hero-intro-text strong { color: var(--bsk-yellow); font-weight: 800; }

        /* Tabell-container og struktur */
        .table-container {
            overflow-x: auto;
            position: relative;
            background: var(--white);
            border-radius: 15px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            margin: 20px 0;
        }

        #attendanceTable {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        /* RYDDIG HEADER STYLING */
        #attendanceHeader th {
            padding: 12px 8px;
            background: #f8f9fa;
            border-bottom: 2px solid var(--border-color);
            border-right: 1px solid #eee;
            min-width: 55px;
            vertical-align: top;
        }

        /* Spesifikk vertikal midtstilling for "Spiller"-overskriften */
        #attendanceHeader th.name-col {
            vertical-align: middle !important;
        }

        .header-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .header-date {
            font-size: 0.75rem;
            font-weight: 800;
            white-space: nowrap;
        }

        /* Dag-type (T/K) som runde sirkler */
        .day-type {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 0.65rem;
            color: white;
        }
        .day-type-training { background: #cbd5e1; color: #475569; }
        .day-type-match { background: #ef4444; }

        .btn-delete-header {
            background: #fee2e2;
            color: #ef4444;
            border: none;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 9px;
            font-weight: 800;
            cursor: pointer;
            opacity: 0.3;
            transition: 0.2s;
        }
        .btn-delete-header:hover { opacity: 1; }

        /* Sticky navnekolonne som står bom fast */
        .name-col {
            position: sticky;
            left: 0;
            background: #f8f9fa !important;
            z-index: 10;
            min-width: 200px; /* God bredde for fulle navn på PC og mobil */
            border-right: 2px solid var(--border-color) !important; 
            padding: 0 15px !important;
            text-align: left !important;
        }

        /* Cellene i tabell-kroppen */
        #attendanceTable td {
            vertical-align: middle;
            border-bottom: 1px solid #f1f2f6;
            border-right: 1px solid #f1f2f6;
            padding: 12px 5px;
            text-align: center;
        }

        /* Status styling */
        .status-present { color: #2ecc71; font-size: 1.3rem; display: block; width: 100%; }
        .status-none { color: #f1f2f6; font-size: 1.3rem; display: block; width: 100%; }
        
        .attendance-badge {
            background: var(--bsk-blue);
            color: white;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* FAB Button */
        .fab-btn {
            position: fixed;
            right: 25px;
            bottom: 25px;
            width: 60px;
            height: 60px;
            background: var(--bsk-blue);
            color: var(--bsk-yellow);
            border: 2px solid var(--bsk-yellow);
            border-radius: 50%;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 1000;
        }

        /* --- SPESIFIKK MOBILHÅNDTERING FOR OPPMØTE-MATRISEN --- */
        @media (max-width: 768px) {
            .fab-btn { bottom: 85px; }

            /* Tvinger containeren til å tillate horisontal scroll innendørs på mobil */
            .table-container {
                overflow-x: auto !important;
                display: block !important;
                width: 100% !important;
                padding: 0 !important;
            }

            #attendanceTable {
                table-layout: auto !important;
                width: max-content !important; /* Lar matrisen strekke seg ut i full bredde sidelengs */
            }

            /* Låser navnekolonnen fullstendig til venstre ved rulling */
            .matrix-table .name-col {
                position: sticky !important;
                left: 0 !important;
                z-index: 20 !important;
                background: #f8f9fa !important;
                box-shadow: 2px 0 5px rgba(0, 0, 0, 0.08); /* Skillekant mot datoene */
            }

            /* Litt mer luft rundt datoene på mobil */
            .matrix-table th:not(.name-col) {
                min-width: 65px !important;
                padding: 10px 4px !important;
            }
        }
    </style>
</head>
<body>

<header class="top-bar">
    <a href="index.html" class="logo-brand"><i class="fa-solid fa-shield-halved"></i>BSK <span>A-LAG</span></a>
    <h1 id="section-title" class="section-title">Oppmøte</h1>
    <div class="filter-wrapper">
        <div class="filter-container">
            <i class="fa-solid fa-calendar-days"></i>
            <select id="monthFilter" class="base-select" onchange="window.filterByMonth(this.value)">
                <option value="Alle">HELE SESONGEN</option>
                <option value="0">JANUAR</option>
                <option value="1">FEBRUAR</option>
                <option value="2">MARS</option>
                <option value="3">APRIL</option>
                <option value="4">MAI</option>
                <option value="5">JUNI</option>
                <option value="6">JULI</option>
                <option value="7">AUGUST</option>
                <option value="8">SEPTEMBER</option>
                <option value="9">OKTOBER</option>
                <option value="10">NOVEMBER</option>
                <option value="11">DESEMBER</option>
            </select>
        </div>
    </div>
</header>

<div class="sidebar" id="sidebar"></div>

<nav class="bottom-nav">
    <a href="index.html" class="nav-item">
        <i class="fa-solid fa-house"></i>
        <span>Hjem</span>
    </a>
    <a href="oppmote.html" class="nav-item active">
        <i class="fa-solid fa-calendar-check"></i>
        <span>Oppmøte</span>
    </a>
    <a href="kamper.html" class="nav-item">
        <i class="fa-solid fa-soccer-ball"></i>
        <span>Kamper</span>
    </a>
    <a href="spillere.html" class="nav-item">
        <i class="fa-solid fa-users"></i>
        <span>Tropp</span>
    </a>
    <a href="statistikk.html" class="nav-item">
        <i class="fa-solid fa-chart-line"></i>
        <span>Stats</span>
    </a>
</nav>

<main class="main-content">
    <section class="oppmote-hero">
        <div class="hero-content">
            <p class="hero-intro-text">
                Her har du full oversikt over <strong>treningsiveren</strong> i gruppa. 
                Spillerstallen sorteres automatisk etter <strong>antall oppmøter</strong> denne sesongen.
            </p>
        </div>
    </section>

    <div class="table-container">
        <table id="attendanceTable" class="matrix-table">
            <thead id="attendanceHeader"></thead>
            <tbody id="attendanceBody"></tbody>
        </table>
    </div>
</main>

<button class="fab-btn" onclick="openAttendanceModal()" title="Legg til ny dag">
    <i class="fa-solid fa-calendar-plus"></i>
</button>

<div id="attendanceModal" class="modal">
    <div class="modal-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 style="color: var(--bsk-blue); margin:0;">Ny økt / Kamp</h3>
            <button onclick="closeAttendanceModal()" style="background:none; border:none; font-size: 24px; cursor:pointer; color: var(--text-muted);">&times;</button>
        </div>
        <form id="attendanceForm">
            <div class="form-row">
                <div class="form-group">
                    <label>Dato</label>
                    <input type="date" id="eventDate" required class="form-control">
                </div>
                <div class="form-group">
                    <label>Type</label>
                    <select id="eventType" class="form-control">
                        <option value="Trening">Trening</option>
                        <option value="Camp">Kamp</option>
                    </select>
                </div>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button type="submit" style="flex:2; background: var(--bsk-blue); color: white; padding:14px; border:none; border-radius:12px; font-weight:700; cursor: pointer;">LAGRE ØKT</button>
                <button type="button" onclick="closeAttendanceModal()" style="flex:1; background: var(--bg-light); padding:14px; border:none; border-radius:12px; font-weight:600; cursor: pointer;">AVBRYT</button>
            </div>
        </form>
    </div>
</div>

<script src="navigation.js"></script>
<script type="module" src="oppmote.js"></script>

<script>
    window.openAttendanceModal = () => {
        document.getElementById('attendanceModal').style.display = 'flex';
        document.getElementById('eventDate').valueAsDate = new Date();
    };
    
    window.closeAttendanceModal = () => {
        document.getElementById('attendanceModal').style.display = 'none';
        document.getElementById('attendanceForm').reset();
    };

    window.onclick = function(event) {
        if (event.target.classList.contains('modal')) {
            closeAttendanceModal();
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const monthFilter = document.getElementById('monthFilter');
        if (monthFilter) {
            const currentMonth = new Date().getMonth().toString();
            monthFilter.value = currentMonth;
            setTimeout(() => {
                if (window.filterByMonth) window.filterByMonth(currentMonth);
            }, 800);
        }
    });
</script>

</body>
</html>
