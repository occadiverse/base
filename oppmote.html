<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oppmøte - BSK Fotball Herrer - A lag</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=2">
    <style>
        /* Ekstra styling for oppmøte-siden */
        .oppmote-hero {
            background: linear-gradient(135deg, #3498db 0%, #2c3e50 100%);
            border-radius: 20px;
            padding: 50px;
            color: white;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(52, 152, 219, 0.2);
        }

        .oppmote-hero h2 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .oppmote-hero p {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 600px;
            line-height: 1.5;
        }

        .filter-bar {
            background: var(--white);
            border-radius: 12px;
            padding: 20px 25px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .filter-bar label {
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-bar label i {
            color: var(--primary);
            font-size: 1.1rem;
        }

        .custom-select-wrapper {
            flex: 1;
        }

        .select-input-clean {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--white);
            color: var(--text-main);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .select-input-clean:hover {
            border-color: var(--primary);
            background-color: #f8f9fa;
        }

        .select-input-clean:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        /* FAB Button styling */
        .fab-btn {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 60px;
            height: 60px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 5px 20px rgba(52, 152, 219, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
        }

        .fab-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 30px rgba(52, 152, 219, 0.6);
        }

        .fab-btn:active {
            transform: scale(0.95);
        }

        /* Modal styling */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { background-color: rgba(0, 0, 0, 0); }
            to { background-color: rgba(0, 0, 0, 0.5); }
        }

        .modal-content {
            background-color: var(--white);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
            animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .modal-header h3 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: var(--text-muted);
            transition: 0.2s;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            color: var(--text-main);
            transform: scale(1.2);
        }

        .form-stack {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .form-group input,
        .form-group select {
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s;
            color: var(--text-main);
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        .button-group {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-grow-2 {
            background: var(--primary);
            color: white;
            flex: 1;
        }

        .btn-grow-2:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }

        .btn-danger {
            background: #ecf0f1;
            color: var(--text-main);
            flex: 1;
        }

        .btn-danger:hover {
            background: #e8ebef;
        }

        /* Slett-knappen (gjort mindre og mer ryddig) */
        .btn-delete-header {
            background: #f1f2f6;
            border: none;
            color: #a4b0be;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 4px;
        }

        .btn-delete-header:hover {
            background: #ffeae6;
            color: var(--danger);
            transform: scale(1.1);
        }

        /* Tabell styling */
        .table-container {
            background: var(--white);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f8f9fa;
            padding: 12px 8px;
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            min-width: 45px;
            vertical-align: top;
        }

        td {
            padding: 14px 12px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        /* Container for innholdet i header-cella */
        .header-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        /* Selve datoen */
        .header-date {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-main);
            display: block;
            line-height: 1.1;
            margin-bottom: 2px;
        }

        /* Gjør navnekolonnen ryddig */
        .name-col {
            position: sticky;
            left: 0;
            background: white;
            z-index: 10;
            text-align: left;
            min-width: 140px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
        }

        /* T eller K brikken (sentrert og finere) */
        .day-type {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.7rem;
            color: white;
            margin: 0 auto; /* Sentrerer brikken */
        }

        .day-type-training { background: #95a5a6; }
        .day-type-match { background: var(--danger); }

        /* Responsiv */
        @media (max-width: 768px) {
            .oppmote-hero { padding: 30px; }
            .oppmote-hero h2 { font-size: 1.6rem; }
            .filter-bar { flex-direction: column; align-items: stretch; }
            .modal-content { width: 95%; }
        }
    </style>
</head>
<body>

<div class="sidebar" id="sidebar"></div>

<div class="main-content">
    <div class="top-bar">
        <button class="menu-toggle" onclick="toggleMenu()">
            <i class="fa-solid fa-bars"></i>
        </button>
        <h2 class="section-title">BSK Fotball Herrer - A lag</h2>
    </div>

    <!-- HERO SEKSJON -->
    <section class="oppmote-hero">
        <div class="hero-content">
            <h2>Oppmøte & Deltakelse</h2>
            <p>Registrer hvem som møter opp til trening og kamp. Oversikt over deltakelse per dag.</p>
        </div>
    </section>

    <!-- FILTER BAR -->
    <div class="filter-bar">
        <label for="monthFilter">
            <i class="fa-solid fa-calendar"></i>
            Filtrer etter måned:
        </label>
        <div class="custom-select-wrapper" style="width: 100%; max-width: 300px;">
            <select id="monthFilter" class="select-input-clean" onchange="window.filterByMonth(this.value)">
                <option value="Alle">Hele sesongen (Vis alle)</option>
                <option value="0">Januar</option>
                <option value="1">Februar</option>
                <option value="2">Mars</option>
                <option value="3">April</option>
                <option value="4">Mai</option>
                <option value="5">Juni</option>
                <option value="6">Juli</option>
                <option value="7">August</option>
                <option value="8">September</option>
                <option value="9">Oktober</option>
                <option value="10">November</option>
                <option value="11">Desember</option>
            </select>
        </div>
    </div>

    <!-- TABELL -->
    <div class="table-container">
        <table id="attendanceTable">
            <thead id="attendanceHeader"></thead>
            <tbody id="attendanceBody"></tbody>
        </table>
    </div>
</div>

<!-- FAB KNAPP -->
<button class="fab-btn" onclick="openAttendanceModal()" title="Legg til ny dag">
    <i class="fa-solid fa-calendar-plus"></i>
</button>

<!-- MODAL -->
<div id="attendanceModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Legg til ny dag</h3>
            <button class="close-btn" onclick="closeAttendanceModal()">&times;</button>
        </div>
        <form id="attendanceForm">
            <div class="form-stack">
                <div class="form-group">
                    <label for="eventDate">Dato</label>
                    <input type="date" id="eventDate" required>
                </div>
                <div class="form-group">
                    <label for="eventType">Type</label>
                    <select id="eventType">
                        <option value="Trening">Trening</option>
                        <option value="Kamp">Kamp</option>
                    </select>
                </div>
            </div>
            <div class="button-group">
                <button type="submit" class="btn btn-grow-2">Opprett dag</button>
                <button type="button" class="btn btn-danger" onclick="closeAttendanceModal()">Avbryt</button>
            </div>
        </form>
    </div>
</div>

<script src="navigation.js"></script>
<script type="module" src="oppmote.js"></script>

<script>
    // Grunnleggende Modal-funksjoner
    window.openAttendanceModal = () => {
        document.getElementById('attendanceModal').style.display = 'flex';
        document.getElementById('eventDate').valueAsDate = new Date();
    };
    window.closeAttendanceModal = () => {
        document.getElementById('attendanceModal').style.display = 'none';
        document.getElementById('attendanceForm').reset();
    };
    window.onclick = function(event) {
        if (event.target == document.getElementById('attendanceModal')) closeAttendanceModal();
    }

    // AUTOMATISK FILTERING PÅ NÅVÆRENDE MÅNED
    document.addEventListener('DOMContentLoaded', () => {
        const monthFilter = document.getElementById('monthFilter');
        if (monthFilter) {
            // Henter måned fra systemklokka (0-11)
            const currentMonth = new Date().getMonth().toString();
            
            // Setter dropdown-menyen til nåværende måned
            monthFilter.value = currentMonth;
            
            // Trigger filtreringen med en liten delay for å sikre at oppmote.js er lastet
            setTimeout(() => {
                if (window.filterByMonth) {
                    window.filterByMonth(currentMonth);
                }
            }, 600);
        }
    });
</script>

</body>
</html>
