<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oppmøte - BSK Fotball</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sidebar" id="sidebar"></div>

    <div class="main-content">
        <div class="top-bar">
            <button class="menu-toggle" onclick="toggleMenu()">
                <i class="fa-solid fa-bars"></i>
            </button>
            <h2 class="section-title">Oppmøteregistrering</h2>
        </div>

        <div class="filter-bar">
            <div class="centered-tools">
                <div class="tool-item">
                    <div class="custom-select-wrapper">
                        <i class="fa-solid fa-calendar-days"></i>
                        <select id="monthSelect" class="select-input-clean"></select>
                    </div>
                </div>

                <div class="tool-item">
                    <button id="toggleDateBtn" class="btn-outline" onclick="showDatePicker()">
                        <i class="fa-solid fa-calendar-plus"></i>
                        <span>Ny økt</span>
                    </button>

                    <div id="datePickerContainer" class="unified-input-group hidden">
                        <input type="date" id="dateInput" class="date-picker-minimal">
                        <button class="btn-add-inline" onclick="addDate()">
                            <i class="fa-solid fa-check"></i>
                        </button>
                        <button class="btn-cancel" onclick="hideDatePicker()">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="table-container">
            <table id="attendanceTable">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <div style="padding: 0 30px 40px 30px;">
            <p class="help-text">
                <i class="fa-solid fa-circle-info"></i> 
                Klikk på dato-etiketten (T/K) for å endre økttype. Klikk på cellene for å endre status.
            </p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDyULE6HGOINM6D8bqBZGbVMaGHAF3RkJg",
            authDomain: "base-49ce3.firebaseapp.com",
            databaseURL: "https://base-49ce3-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "base-49ce3",
            storageBucket: "base-49ce3.firebasestorage.app",
            messagingSenderId: "4752321901",
            appId: "1:4752321901:web:089814e4faefbdeff9be64",
            measurementId: "G-YZE1RSW4CN"
        };

        // Initialiser Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Gjør funksjonene tilgjengelige globalt for database.js og script.js
        window.db = db;
        window.dbRef = ref;
        window.dbSet = set;
        window.dbOnValue = onValue;
        window.dbGet = get;

        console.log("Firebase Sky-database er aktiv!");
    </script>

    <script src="database.js"></script>
    <script src="navigation.js"></script>
    <script src="script.js"></script>

    <script>
        // Sikrer at menyen tegnes opp og at Firebase-logikken får tid til å koble seg til
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof loadNavigation === 'function') {
                loadNavigation();
            }
        });
    </script>

</body>
</html>
