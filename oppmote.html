<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oppmøte Protokoll</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top-header">
    <div class="controls">
        <h2 style="margin:0; color:var(--primary-color); margin-right:15px;">⚽ Oppmøte</h2>
        <select id="monthSelect" class="month-picker" onchange="initMonth()"></select>
        <a href="spillere.html" class="nav-link">Rediger Spillerstall</a>
    </div>
    <button onclick="window.print()" class="btn-print">🖨️ Print PDF</button>
</div>

<div class="container">
    <div class="scroll-container">
        <table id="attendanceTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script src="database.js"></script>
<script>
    const months = ["Januar", "Februar", "Mars", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Desember"];
    const currentYear = 2026;
    const monthSelect = document.getElementById('monthSelect');

    // Fyller månedvelgeren
    months.forEach((m, i) => {
        let opt = document.createElement('option');
        opt.value = i;
        opt.innerText = m + " " + currentYear;
        if(i === new Date().getMonth()) opt.selected = true; 
        monthSelect.appendChild(opt);
    });

    function initMonth() {
        const monthIdx = parseInt(monthSelect.value);
        const daysInMonth = new Date(currentYear, monthIdx + 1, 0).getDate();
        
        for(let i=1; i<=daysInMonth; i++) {
            let key = `type-${currentYear}-${monthIdx}-${i}`;
            if (!localStorage.getItem(key)) {
                let day = new Date(currentYear, monthIdx, i).getDay();
                // Standard: Mandag/Lørdag = Trening, Onsdag = Kamp
                let type = (day === 1 || day === 6) ? "T" : (day === 3 ? "K" : "X");
                localStorage.setItem(key, type);
            }
        }
        renderAll();
    }

    function toggleDayType(dayNr) {
        const month = monthSelect.value;
        const key = `type-${currentYear}-${month}-${dayNr}`;
        const current = localStorage.getItem(key) || "X";
        localStorage.setItem(key, current === "X" ? "T" : (current === "T" ? "K" : "X"));
        renderAll();
    }

    function cycleStatus(playerId, dayNr) {
        const month = monthSelect.value;
        const current = DB.getAttendance(currentYear, month, playerId, dayNr);
        const states = ["?", "✅", "❌", "🤕"];
        let next = states[(states.indexOf(current) + 1) % states.length];
        DB.setAttendance(currentYear, month, playerId, dayNr, next);
        renderAll();
    }

    function renderAll() {
        const monthIdx = parseInt(monthSelect.value);
        const players = DB.getActivePlayers();
        const daysInMonth = new Date(currentYear, monthIdx + 1, 0).getDate();
        
        let days = [];
        for(let i=1; i<=daysInMonth; i++) {
            let d = new Date(currentYear, monthIdx, i);
            let dayOfWeek = d.getDay();
            let type = localStorage.getItem(`type-${currentYear}-${monthIdx}-${i}`);
            // Viser dager som er markert som aktivitet eller faste dager
            if(dayOfWeek === 1 || dayOfWeek === 3 || dayOfWeek === 6 || (type && type !== "X")) {
                days.push({nr: i, navn: ["Søn","Man","Tir","Ons","Tor","Fre","Lør"][dayOfWeek]});
            }
        }

        // Lager tabelloverskrift
        let headHtml = `<tr><th class="name-col">Spiller</th>`;
        days.forEach(d => {
            let type = localStorage.getItem(`type-${currentYear}-${monthIdx}-${d.nr}`) || "X";
            let label = type === "T" ? "T" : (type === "K" ? "K" : "-");
            let tagClass = type === "T" ? "tag-t" : (type === "K" ? "tag-k" : "tag-none");
            headHtml += `<th class="date-header" onclick="toggleDayType(${d.nr})">
                            ${d.navn} ${d.nr}.
                            <span class="type-tag ${tagClass}">${label}</span>
                         </th>`;
        });
        headHtml += `<th class="stat-col">%</th></tr>`;
        document.getElementById('tableHead').innerHTML = headHtml;

        // Lager tabellrader
        let bodyHtml = "";
        players.forEach(player => {
            bodyHtml += `<tr><td class="name-col">${player.navn}</td>`;
            let attended = 0, totalPossible = 0;
            
            days.forEach(d => {
                let type = localStorage.getItem(`type-${currentYear}-${monthIdx}-${d.nr}`);
                let status = DB.getAttendance(currentYear, monthIdx, player.id, d.nr);
                
                if(type === "T" || type === "K") {
                    totalPossible++;
                    if(status === "✅") attended++;
                }
                bodyHtml += `<td class="status-cell" onclick="cycleStatus('${player.id}', ${d.nr})">${status}</td>`;
            });
            
            let percent = totalPossible > 0 ? Math.round((attended / totalPossible) * 100) : 0;
            bodyHtml += `<td class="stat-col">${percent}%</td></tr>`;
        });
        document.getElementById('tableBody').innerHTML = bodyHtml || "<tr><td colspan='100%'>Ingen aktive spillere funnet.</td></tr>";
    }

    initMonth();
</script>
</body>
</html>
