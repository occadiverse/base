<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oppmøte - BSK Fotball Herrer - A lag</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=2">
    <style>
        /* Ekstra styling for oppmøte-siden */
        .oppmote-hero {
            background: linear-gradient(135deg, #3498db 0%, #2c3e50 100%);
            border-radius: 20px;
            padding: 50px;
            color: white;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(52, 152, 219, 0.2);
        }

        .oppmote-hero h2 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .oppmote-hero p {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 600px;
            line-height: 1.5;
        }

        /* GJENOPPRETTET FILTER BAR STYLING */
        .filter-bar {
            background: var(--white);
            border-radius: 12px;
            padding: 15px 25px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .filter-bar label {
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-bar label i {
            color: var(--primary);
            font-size: 1.1rem;
        }

        .custom-select-wrapper {
            flex: 1;
            max-width: 300px;
        }

        .select-input-clean {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--white);
            color: var(--text-main);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        /* TABELL STYLING - TILPASSET NAVNEBREDE */
        .table-container {
            background: var(--white);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        th, td {
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
        }

        th {
            background: #f8f9fa;
            padding: 10px;
            text-align: center;
            vertical-align: middle;
            height: 80px; 
            box-sizing: border-box;
        }

        /* NAVNEKOLONNE - DYNAMISK BREDDE */
        .name-col {
            position: sticky;
            left: 0;
            background: #f8f9fa;
            z-index: 10;
            min-width: 130px; /* Redusert siden vi bruker fornavn + initial */
            border-right: 2px solid #ddd !important; 
            text-align: left;
            padding: 0 12px;
        }

        th.name-col {
            background: #f8f9fa;
            display: table-cell;
        }

        .player-info-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 10px;
            padding: 10px 0;
        }

        .player-name {
            font-weight: 600;
            color: var(--text-main);
            font-size: 0.95rem;
            white-space: nowrap;
        }

        .attendance-badge {
            background: #3498db;
            color: white;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            min-width: 20px;
            text-align: center;
            flex-shrink: 0;
            box-shadow: 0 2px 4px rgba(52, 152, 219, 0.2);
        }

        .header-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            justify-content: center;
        }

        .header-date {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .day-type {
            width: 22px;
            height: 22px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.65rem;
            color: white;
        }

        .day-type-training { background: #95a5a6; }
        .day-type-match { background: var(--danger); }

        .btn-delete-header {
            background: transparent;
            border: none;
            color: #a4b0be;
            font-size: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        td {
            padding: 12px;
            background: white;
        }

        .status-present { color: var(--success); font-size: 1.3rem; }
        .status-none { color: #eee; font-size: 1.3rem; }

        /* FAB og Modal */
        .fab-btn {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 60px;
            height: 60px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 5px 20px rgba(52, 152, 219, 0.4);
            z-index: 1000;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
        }

        @media (max-width: 768px) {
            .name-col { min-width: 110px; padding: 0 8px; }
            .player-name { font-size: 0.85rem; }
            .oppmote-hero { padding: 25px; }
        }
    </style>
</head>
<body>

<div class="sidebar" id="sidebar"></div>

<div class="main-content">
    <div class="top-bar">
        <button class="menu-toggle" onclick="toggleMenu()">
            <i class="fa-solid fa-bars"></i>
        </button>
        <h1 id="section-title" class="section-title"></h1>
    </div>

    <section class="oppmote-hero">
        <div class="hero-content">
            <h2>Oppmøte & Deltakelse</h2>
            <p>Full oversikt over spillerstallen. Sortert etter innsats og oppmøte.</p>
        </div>
    </section>

    <div class="filter-bar">
        <label for="monthFilter">
            <i class="fa-solid fa-calendar"></i>
            Filtrer etter måned:
        </label>
        <div class="custom-select-wrapper">
            <select id="monthFilter" class="select-input-clean" onchange="window.filterByMonth(this.value)">
                <option value="Alle">Hele sesongen (Vis alle)</option>
                <option value="0">Januar</option>
                <option value="1">Februar</option>
                <option value="2">Mars</option>
                <option value="3">April</option>
                <option value="4">Mai</option>
                <option value="5">Juni</option>
                <option value="6">Juli</option>
                <option value="7">August</option>
                <option value="8">September</option>
                <option value="9">Oktober</option>
                <option value="10">November</option>
                <option value="11">Desember</option>
            </select>
        </div>
    </div>

    <div class="table-container">
        <table id="attendanceTable">
            <thead id="attendanceHeader"></thead>
            <tbody id="attendanceBody"></tbody>
        </table>
    </div>
</div>

<button class="fab-btn" onclick="openAttendanceModal()">
    <i class="fa-solid fa-calendar-plus"></i>
</button>

<div id="attendanceModal" class="modal">
    <div class="modal-content">
        <div class="modal-header" style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3>Legg til ny dag</h3>
            <button onclick="closeAttendanceModal()" style="background:none; border:none; font-size: 24px; cursor:pointer;">&times;</button>
        </div>
        <form id="attendanceForm">
            <div style="display:flex; flex-direction:column; gap: 15px; margin-bottom: 20px;">
                <div style="display:flex; flex-direction:column;">
                    <label style="font-weight:600; margin-bottom: 5px;">Dato</label>
                    <input type="date" id="eventDate" required style="padding: 10px; border: 1px solid #ddd; border-radius: 8px;">
                </div>
                <div style="display:flex; flex-direction:column;">
                    <label style="font-weight:600; margin-bottom: 5px;">Type</label>
                    <select id="eventType" style="padding: 10px; border: 1px solid #ddd; border-radius: 8px;">
                        <option value="Trening">Trening</option>
                        <option value="Kamp">Kamp</option>
                    </select>
                </div>
            </div>
            <div style="display:flex; gap: 10px;">
                <button type="submit" style="flex:1; background: var(--primary); color:white; border:none; padding: 12px; border-radius: 8px; font-weight:600; cursor:pointer;">Lagre</button>
                <button type="button" onclick="closeAttendanceModal()" style="flex:1; background: #eee; border:none; padding: 12px; border-radius: 8px; cursor:pointer;">Avbryt</button>
            </div>
        </form>
    </div>
</div>

<script src="navigation.js"></script>
<script type="module" src="oppmote.js"></script>

<script>
    window.openAttendanceModal = () => {
        document.getElementById('attendanceModal').style.display = 'flex';
        document.getElementById('eventDate').valueAsDate = new Date();
    };
    window.closeAttendanceModal = () => {
        document.getElementById('attendanceModal').style.display = 'none';
        document.getElementById('attendanceForm').reset();
    };
    window.onclick = (e) => { if (e.target.classList.contains('modal')) closeAttendanceModal(); }

    document.addEventListener('DOMContentLoaded', () => {
        const monthFilter = document.getElementById('monthFilter');
        if (monthFilter) {
            const currentMonth = new Date().getMonth().toString();
            monthFilter.value = currentMonth;
            setTimeout(() => {
                if (window.filterByMonth) window.filterByMonth(currentMonth);
            }, 800);
        }
    });
</script>

</body>
</html>
