<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oppmøte - BSK Fotball</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

<div class="sidebar" id="sidebar"></div>

<div class="main-content">
    <div class="top-bar">
        <button class="menu-toggle" onclick="toggleMenu()">
            <i class="fa-solid fa-bars"></i>
        </button>
        <h2 class="section-title">Oppmøteoversikt</h2>
    </div>

    <!-- Oppdatert filter-bar med dropdown -->
<div class="filter-bar">
    <div class="custom-select-wrapper" style="width: 100%; max-width: 300px;">
        <select id="monthFilter" class="select-input-clean" onchange="window.filterByMonth(this.value)">
            <option value="Alle">Hele sesongen (Vis alle)</option>
            <option value="0">Januar</option>
            <option value="1">Februar</option>
            <option value="2">Mars</option>
            <option value="3">April</option>
            <option value="4">Mai</option>
            <option value="5">Juni</option>
            <option value="6">Juli</option>
            <option value="7">August</option>
            <option value="8">September</option>
            <option value="9">Oktober</option>
            <option value="10">November</option>
            <option value="11">Desember</option>
        </select>
    </div>
</div>

    <div class="table-container">
        <table id="attendanceTable">
            <thead id="attendanceHeader"></thead>
            <tbody id="attendanceBody"></tbody>
        </table>
    </div>
</div>

<button class="fab-btn" onclick="openAttendanceModal()" title="Legg til ny dag" style="position: fixed !important; right: 20px !important; bottom: 20px !important; z-index: 9999 !important; display: flex !important;">
    <i class="fa-solid fa-calendar-plus"></i>
    <span class="fab-text">Ny dag</span>
</button>

<div id="attendanceModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Legg til ny dag</h3>
            <button class="close-btn" onclick="closeAttendanceModal()">&times;</button>
        </div>
        <form id="attendanceForm">
            <div class="form-stack">
                <div class="form-group">
                    <label>Dato</label>
                    <input type="date" id="eventDate" required>
                </div>
                <div class="form-group">
                    <label>Type</label>
                    <select id="eventType">
                        <option value="Trening">Trening</option>
                        <option value="Kamp">Kamp</option>
                    </select>
                </div>
            </div>
            <div class="button-group">
                <button type="submit" class="btn btn-grow-2">Opprett dag</button>
                <button type="button" class="btn btn-danger" onclick="closeAttendanceModal()">Avbryt</button>
            </div>
        </form>
    </div>
</div>

<script src="navigation.js"></script>
<script type="module" src="oppmote.js"></script>

<script>
    window.openAttendanceModal = () => {
        document.getElementById('attendanceModal').style.display = 'flex';
        document.getElementById('eventDate').valueAsDate = new Date();
    };
    window.closeAttendanceModal = () => {
        document.getElementById('attendanceModal').style.display = 'none';
        document.getElementById('attendanceForm').reset();
    };
    window.onclick = function(event) {
        if (event.target == document.getElementById('attendanceModal')) closeAttendanceModal();
    }
</script>

</body>
</html>
