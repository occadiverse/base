<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oppmøte Protokoll - BSK</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar" id="sidebar"></div>

<div class="main-content">
    <div class="top-bar top-bar-spread">
        <button class="menu-toggle is-hidden" id="openBtn" onclick="toggleMenu()">
            <i class="fa-solid fa-bars"></i>
        </button>

        <div class="top-title-group">
            <h2 class="section-title">Oppmøte <span id="currentYearLabel"></span></h2>
            <select id="monthSelect" class="month-picker"></select>
        </div>

        <a href="spillere.html" class="btn btn-compact btn-inline-icon">
            <i class="fa-solid fa-users"></i> Gå til Spillere
        </a>
    </div>

    <div class="table-container">
        <table id="attendanceTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>

        <div class="admin-footer">
            <div class="menu-group admin-field">
                <label>Legg til dato</label>
                <div class="inline-input-row">
                    <input type="date" id="dateInput">
                    <button class="btn" onclick="addDate()">Legg til</button>
                </div>
            </div>

            <button class="btn btn-danger btn-compact" onclick="clearData()">
                <i class="fa-solid fa-trash"></i> Nullstill år
            </button>
        </div>
    </div>
</div>

<script src="database.js"></script>
<script src="navigation.js"></script>
<script src="script.js"></script>
</body>
</html>
