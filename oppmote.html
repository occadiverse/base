<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oppmøte - BSK Fotball</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sidebar" id="sidebar"></div>

    <div class="main-content">
        <div class="top-bar">
            <button class="menu-toggle" onclick="toggleMenu()">
                <i class="fa-solid fa-bars"></i>
            </button>
            <h2 class="section-title">Oppmøteregistrering</h2>
        </div>

        <div class="filter-bar">
            <div class="centered-tools">
                <div class="tool-item">
                    <select id="monthSelect" class="select-input-clean" onchange="renderAttendanceTable()"></select>
                </div>

                <div class="tool-spacer"></div>

                <div class="tool-item">
                    <button id="toggleDateBtn" class="btn-outline" onclick="showDatePicker()">
                    <i class="fa-solid fa-calendar-plus"></i>
                    <span>Ny økt</span>
                    </button>

                    <div id="datePickerContainer" class="unified-input-group hidden">
                        <input type="date" id="dateInput" class="date-picker-minimal">
                        <button class="btn-add-inline" onclick="addDate()">
                        <i class="fa-solid fa-check"></i>
                        </button>
                        <button class="btn-cancel" onclick="hideDatePicker()">
                        <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="table-container">
            <table id="attendanceTable">
                <thead id="tableHead">
                    </thead>
                <tbody id="tableBody">
                    </tbody>
            </table>
        </div>

        <div style="padding: 0 30px 40px 30px;">
            <p class="help-text">
                <i class="fa-solid fa-circle-info"></i> 
                Klikk på dato-etiketten (T/K) for å endre økttype. Klikk på cellene for å endre status.
            </p>
        </div>
    </div>

    <script src="database.js"></script>
    <script src="navigation.js"></script>
    <script src="script.js"></script>

    <script>
        // Sikrer at menyen tegnes opp når siden lastes
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof loadNavigation === 'function') {
                loadNavigation();
            }
        });
    </script>

</body>
</html>
