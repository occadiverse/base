<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oppmøte - BSK Fotball</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=2">
    
    <style>
        /* BSK-blå Hero - Nå identisk med kamper.html */
        .oppmote-hero {
            background: linear-gradient(135deg, var(--bsk-blue) 0%, #003366 100%);
            border-radius: 20px;
            padding: 40px;
            color: white;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 86, 179, 0.2);
        }

        .oppmote-hero h2 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .oppmote-hero p {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 600px;
            line-height: 1.5;
        }

        /* Filter Bar */
        .filter-bar {
            background: var(--white);
            border-radius: 12px;
            padding: 15px 25px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid var(--border-color);
        }

        /* OPPSETT FOR STICKY NAVNEKOLONNE (Beholdes kun her) */
        .table-container {
            overflow-x: auto;
            position: relative;
        }

        /* Spesifikk overstyring for oppmøte-header for å få plass til dato + slett */
        #attendanceHeader th {
            height: 90px;
            min-width: 60px;
            vertical-align: middle;
        }

        .name-col {
            position: sticky;
            left: 0;
            background: #f8f9fa !important;
            z-index: 10;
            min-width: 140px;
            border-right: 2px solid #ddd !important; 
            text-align: left !important;
            padding: 0 15px !important;
        }

        /* Badge for antall treninger */
        .attendance-badge {
            background: var(--bsk-blue);
            color: white;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: auto;
        }

        .player-info-wrapper {
            display: flex;
            align-items: center;
            width: 100%;
        }

        /* Status-ikoner */
        .status-present { color: #2ecc71; font-size: 1.2rem; }
        .status-none { color: #eee; font-size: 1.2rem; }

        .day-type {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.6rem;
            color: white;
            margin-top: 4px;
        }
        .day-type-training { background: #95a5a6; }
        .day-type-match { background: #e74c3c; }

        /* FAB Button */
        .fab-btn {
            position: fixed;
            right: 25px;
            bottom: 25px;
            width: 60px;
            height: 60px;
            background: var(--bsk-blue);
            color: var(--bsk-yellow);
            border: 2px solid var(--bsk-yellow);
            border-radius: 50%;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 1000;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 3000;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            box-shadow: var(--shadow);
        }
    </style>
</head>
<body>

<header class="top-bar">
    <a href="index.html" class="logo-brand"><i class="fa-solid fa-shield-halved"></i>BSK <span>A-LAG</span></a>
    <h1 id="section-title" class="section-title">Oppmøte</h1>
</header>

<nav class="bottom-nav">
    <a href="index.html" class="nav-item">
        <i class="fa-solid fa-house"></i>
        <span>Hjem</span>
    </a>
    <a href="oppmote.html" class="nav-item active">
        <i class="fa-solid fa-calendar-check"></i>
        <span>Oppmøte</span>
    </a>
    <a href="kamper.html" class="nav-item">
        <i class="fa-solid fa-soccer-ball"></i>
        <span>Kamper</span>
    </a>
    <a href="spillere.html" class="nav-item">
        <i class="fa-solid fa-users"></i>
        <span>Tropp</span>
    </a>
    <a href="statistikk.html" class="nav-item">
        <i class="fa-solid fa-chart-line"></i>
        <span>Stats</span>
    </a>
</nav>

<main class="main-content">
    <section class="oppmote-hero">
        <div class="hero-content">
            <h2>Oppmøte & Innsats</h2>
            <p>Her har du full oversikt over hvem som legger ned jobben. Sortert etter treningsiver.</p>
        </div>
    </section>

    <div class="filter-bar">
        <label for="monthFilter">
            <i class="fa-solid fa-calendar-days"></i>
            Vis måned:
        </label>
        <select id="monthFilter" class="base-select" onchange="window.filterByMonth(this.value)" style="border:none; font-weight:700; color:var(--bsk-blue); cursor:pointer;">
            <option value="Alle">Hele sesongen</option>
            <option value="0">Januar</option>
            <option value="1">Februar</option>
            <option value="2">Mars</option>
            <option value="3">April</option>
            <option value="4">Mai</option>
            <option value="5">Juni</option>
            <option value="6">Juli</option>
            <option value="7">August</option>
            <option value="8">September</option>
            <option value="9">Oktober</option>
            <option value="10">November</option>
            <option value="11">Desember</option>
        </select>
    </div>

    <div class="table-container">
        <table id="attendanceTable">
            <thead id="attendanceHeader"></thead>
            <tbody id="attendanceBody"></tbody>
        </table>
    </div>
</main>

<button class="fab-btn" onclick="openAttendanceModal()">
    <i class="fa-solid fa-calendar-plus"></i>
</button>

<!-- MODAL FOR NY DAG -->
<div id="attendanceModal" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 style="color:var(--bsk-blue); margin:0;">Ny økt / Kamp</h3>
            <button onclick="closeAttendanceModal()" style="background:none; border:none; font-size: 24px; cursor:pointer;">&times;</button>
        </div>
        <form id="attendanceForm">
            <div style="display:flex; flex-direction:column; gap: 15px; margin-bottom: 20px;">
                <div style="display:flex; flex-direction:column; gap:5px;">
                    <label style="font-weight:700; font-size:0.85rem;">Dato</label>
                    <input type="date" id="eventDate" required class="form-control">
                </div>
                <div style="display:flex; flex-direction:column; gap:5px;">
                    <label style="font-weight:700; font-size:0.85rem;">Type</label>
                    <select id="eventType" class="form-control">
                        <option value="Trening">Trening</option>
                        <option value="Kamp">Kamp</option>
                    </select>
                </div>
            </div>
            <div style="display:flex; gap: 10px;">
                <button type="submit" style="flex:2; background: var(--bsk-blue); color:white; border:none; padding: 14px; border-radius: 12px; font-weight:700; cursor:pointer;">LAGRE</button>
                <button type="button" onclick="closeAttendanceModal()" style="flex:1; background: var(--bg-light); border:none; padding: 14px; border-radius: 12px; font-weight:600; cursor:pointer;">AVBRYT</button>
            </div>
        </form>
    </div>
</div>

<script src="navigation.js"></script>
<script type="module" src="oppmote.js"></script>

<script>
    window.openAttendanceModal = () => {
        document.getElementById('attendanceModal').style.display = 'flex';
        document.getElementById('eventDate').valueAsDate = new Date();
    };
    window.closeAttendanceModal = () => {
        document.getElementById('attendanceModal').style.display = 'none';
        document.getElementById('attendanceForm').reset();
    };
    window.onclick = (e) => { if (e.target.classList.contains('modal')) closeAttendanceModal(); }

    document.addEventListener('DOMContentLoaded', () => {
        const monthFilter = document.getElementById('monthFilter');
        if (monthFilter) {
            const currentMonth = new Date().getMonth().toString();
            monthFilter.value = currentMonth;
            // Litt forsinkelse så Firebase rekker å laste
            setTimeout(() => {
                if (window.filterByMonth) window.filterByMonth(currentMonth);
            }, 800);
        }
    });
</script>

</body>
</html>
