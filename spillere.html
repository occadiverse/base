<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spillerstall - BSK Fotball</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

<div class="sidebar" id="sidebar"></div>

<div class="main-content">
    <div class="top-bar">
        <button class="menu-toggle" onclick="toggleMenu()">
            <i class="fa-solid fa-bars"></i>
        </button>
        <h2 class="section-title">Spillere</h2>
    </div>

    <div class="filter-bar"></div>

    <div class="table-container">
        <table id="playerTable">
            <thead>
                <tr>
                    <th>#</th>
                    <th class="text-left">Navn</th>
                    <th>Status</th>
                    <th>Mobil</th>
                    <th>Handling</th>
                </tr>
            </thead>
            <tbody id="playerTableBody"></tbody>
        </table>
    </div>
</div>

<button class="fab-btn" onclick="openModal()" title="Registrer ny spiller" style="position: fixed !important; right: 20px !important; bottom: 20px !important; z-index: 9999 !important; display: flex !important;">
    <i class="fa-solid fa-user-plus"></i>
    <span class="fab-text">Ny spiller</span>
</button>

<div id="playerModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="formTitle">Registrer ny spiller</h3>
            <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
        <form id="playerForm">
            <input type="hidden" id="editId">
            <div class="form-stack">
                <div class="form-group">
                    <label>Fullt navn *</label>
                    <input type="text" id="navn" required>
                </div>
                <div class="form-group">
                    <label>Fødselsdato</label>
                    <input type="date" id="fodselsdato">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="status">
                        <option value="Aktiv">Aktiv</option>
                        <option value="Passiv">Passiv</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Mobil</label>
                    <input type="tel" id="mobil">
                </div>
                <div class="form-group">
                    <label>Draktnummer</label>
                    <input type="number" id="draktnummer">
                </div>
            </div>
            <div class="button-group">
                <button type="submit" id="submitBtn" class="btn btn-grow-2">Lagre</button>
                <button type="button" class="btn btn-danger" onclick="closeModal()">Avbryt</button>
            </div>
        </form>
    </div>
</div>

<script src="navigation.js"></script>
<script type="module" src="spillere.js"></script>

<script>
    window.openModal = () => {
        document.getElementById('formTitle').innerText = 'Registrer ny spiller';
        document.getElementById('submitBtn').innerText = 'Lagre spiller';
        document.getElementById('playerModal').style.display = 'flex';
    };

    window.closeModal = () => {
        document.getElementById('playerModal').style.display = 'none';
        document.getElementById('playerForm').reset();
        document.getElementById('editId').value = '';
    };

    window.onclick = function(event) {
        if (event.target == document.getElementById('playerModal')) closeModal();
    }
</script>

</body>
</html>
