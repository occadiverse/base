<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spilleradministrasjon</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f0f2f5; color: #333; }
        .header { background: #1a73e8; color: white; padding: 20px; text-align: center; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #666; }
        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        
        .button-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn-save { background: #28a745; color: white; border: none; padding: 12px 25px; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 2; }
        .btn-cancel { background: #6c757d; color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; flex: 1; display: none; }

        .table-container { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; color: #1a73e8; font-size: 12px; }
        
        .status-pill { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; }
        .status-aktiv { background: #d4edda; color: #155724; }
        .status-passiv { background: #e2e3e5; color: #383d41; }
        
        .action-btns { display: flex; gap: 8px; }
        .edit-btn { color: #1a73e8; cursor: pointer; background: none; border: 1px solid #1a73e8; padding: 5px 8px; border-radius: 4px; font-size: 12px; }
        .delete-btn { color: #dc3545; cursor: pointer; background: none; border: 1px solid #dc3545; padding: 5px 8px; border-radius: 4px; font-size: 12px; }
        
        .nav-links { margin-bottom: 20px; }
        .nav-links a { text-decoration: none; color: #1a73e8; font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <h1>Spillerstall</h1>
</div>

<div class="container">
    <div class="nav-links">
        <a href="index.html">← Tilbake til Oppmøte</a>
    </div>

    <div class="card">
        <h3 id="formTitle">Registrer ny spiller</h3>
        <form id="playerForm">
            <input type="hidden" id="editId">
            <div class="form-grid">
                <div class="form-group">
                    <label>Fullt navn *</label>
                    <input type="text" id="navn" required>
                </div>
                <div class="form-group">
                    <label>Fødselsdato</label>
                    <input type="date" id="fodselsdato">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="status">
                        <option value="Aktiv">Aktiv</option>
                        <option value="Passiv">Passiv</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Mobil</label>
                    <input type="tel" id="mobil">
                </div>
                <div class="form-group">
                    <label>E-post</label>
                    <input type="email" id="epost">
                </div>
                <div class="form-group">
                    <label>Draktnummer</label>
                    <input type="number" id="draktnummer">
                </div>
            </div>
            <div class="button-group">
                <button type="submit" id="submitBtn" class="btn-save">Lagre Spiller</button>
                <button type="button" id="cancelBtn" class="btn-cancel" onclick="resetForm()">Avbryt</button>
            </div>
        </form>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Navn</th>
                    <th>Født</th>
                    <th>Status</th>
                    <th>Mobil</th>
                    <th>E-post</th>
                    <th>Handlinger</th>
                </tr>
            </thead>
            <tbody id="playerTableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let spillerliste = JSON.parse(localStorage.getItem('full-spillerliste')) || [];
    const playerForm = document.getElementById('playerForm');
    const submitBtn = document.getElementById('submitBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const formTitle = document.getElementById('formTitle');

    playerForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const editId = document.getElementById('editId').value;
        
        const spillerData = {
            id: editId ? parseInt(editId) : Date.now(),
            navn: document.getElementById('navn').value,
            fodselsdato: document.getElementById('fodselsdato').value,
            status: document.getElementById('status').value,
            mobil: document.getElementById('mobil').value,
            epost: document.getElementById('epost').value,
            draktnummer: document.getElementById('draktnummer').value
        };

        if (editId) {
            const index = spillerliste.findIndex(s => s.id === parseInt(editId));
            spillerliste[index] = spillerData;
        } else {
            spillerliste.push(spillerData);
        }

        saveAndRender();
        resetForm();
    });

    function editPlayer(id) {
        const spiller = spillerliste.find(s => s.id === id);
        if (!spiller) return;

        document.getElementById('editId').value = spiller.id;
        document.getElementById('navn').value = spiller.navn;
        document.getElementById('fodselsdato').value = spiller.fodselsdato;
        document.getElementById('status').value = spiller.status;
        document.getElementById('mobil').value = spiller.mobil;
        document.getElementById('epost').value = spiller.epost;
        document.getElementById('draktnummer').value = spiller.draktnummer;

        formTitle.innerText = "Rediger spiller";
        submitBtn.innerText = "Oppdater Spiller";
        cancelBtn.style.display = "block";
        window.scrollTo(0, 0);
    }

    function resetForm() {
        playerForm.reset();
        document.getElementById('editId').value = "";
        formTitle.innerText = "Registrer ny spiller";
        submitBtn.innerText = "Lagre Spiller";
        cancelBtn.style.display = "none";
    }

    function deletePlayer(id) {
        if(confirm("Vil du slette spilleren?")) {
            spillerliste = spillerliste.filter(s => s.id !== id);
            saveAndRender();
        }
    }

    function saveAndRender() {
        localStorage.setItem('full-spillerliste', JSON.stringify(spillerliste));
        renderPlayers();
    }

    function renderPlayers() {
        const tableBody = document.getElementById('playerTableBody');
        tableBody.innerHTML = "";
        
        const sorted = [...spillerliste].sort((a, b) => (parseInt(a.draktnummer) || 999) - (parseInt(b.draktnummer) || 999));

        sorted.forEach(s => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><strong>${s.draktnummer || '-'}</strong></td>
                <td>${s.navn}</td>
                <td>${s.fodselsdato || '-'}</td>
                <td><span class="status-pill ${s.status === 'Aktiv' ? 'status-aktiv' : 'status-passiv'}">${s.status}</span></td>
                <td>${s.mobil || '-'}</td>
                <td><small>${s.epost || '-'}</small></td>
                <td class="action-btns">
                    <button class="edit-btn" onclick="editPlayer(${s.id})">Rediger</button>
                    <button class="delete-btn" onclick="deletePlayer(${s.id})">Slett</button>
                </td>
            `;
            tableBody.appendChild(row);
        });
    }

    renderPlayers();
</script>

</body>
</html>
