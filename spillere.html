<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spillerstall - BSK Fotball</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=2">
    <style>
        /* Ekstra styling for spillere-siden */
        .spiller-hero {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            border-radius: 20px;
            padding: 50px;
            color: white;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(231, 76, 60, 0.2);
        }

        .spiller-hero h2 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .spiller-hero p {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 600px;
            line-height: 1.5;
        }

        .filter-bar {
            background: var(--white);
            border-radius: 12px;
            padding: 20px 25px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .filter-bar > div {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            padding: 12px 20px;
            border: 2px solid var(--border-color);
            background: var(--white);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            transition: all 0.3s;
            font-size: 0.95rem;
        }

        .tab-btn:hover {
            border-color: #e74c3c;
            color: #e74c3c;
        }

        /* Oppdatert stil for aktiv knapp uten gradient */
        .tab-btn.active {
            background-color: #e74c3c !important; 
            color: #ffffff !important;
           border: 2px solid #c0392b;
           box-shadow: 0 4px 10px rgba(231, 76, 60, 0.3);
        }

        .tab-btn:not(.active):hover {
            border-color: #e74c3c;
            color: #e74c3c;
            background-color: #fcf3f2; /* En veldig lys rød nyanse */
        }

        /* Tabell styling */
        .table-container {
            background: var(--white);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f8f9fa;
            padding: 16px 12px;
            text-align: center;
            font-weight: 600;
            color: var(--text-main);
            border-bottom: 2px solid var(--border-color);
            font-size: 0.9rem;
        }

        td {
            padding: 14px 12px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        .name-col {
            text-align: left;
            font-weight: 600;
            min-width: 150px;
        }

        .action-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            transition: 0.2s;
            padding: 4px 8px;
        }

        .btn-delete:hover {
            color: #e74c3c;
            transform: scale(1.2);
        }

        .btn-edit:hover {
            color: var(--primary);
            transform: scale(1.2);
        }

        /* FAB Button styling */
        .fab-btn {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 60px;
            height: 60px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 5px 20px rgba(231, 76, 60, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
        }

        .fab-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 30px rgba(231, 76, 60, 0.6);
        }

        .fab-btn:active {
            transform: scale(0.95);
        }

        .fab-text {
            display: none;
        }

        /* Modal styling */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { background-color: rgba(0, 0, 0, 0); }
            to { background-color: rgba(0, 0, 0, 0.5); }
        }

        .modal-content {
            background-color: var(--white);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
            animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .modal-header h3 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: var(--text-muted);
            transition: 0.2s;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            color: var(--text-main);
            transform: scale(1.2);
        }

        .form-stack {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .form-group input,
        .form-group select {
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s;
            color: var(--text-main);
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #e74c3c;
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.1);
        }

        .button-group {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-grow-2 {
            background: #e74c3c;
            color: white;
            flex: 1;
        }

        .btn-grow-2:hover {
            background: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.3);
        }

        .btn-danger {
            background: #ecf0f1;
            color: var(--text-main);
            flex: 1;
        }

        .btn-danger:hover {
            background: #e8ebef;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
        }

        /* Responsiv */
        @media (max-width: 768px) {
            .spiller-hero {
                padding: 30px;
            }

            .spiller-hero h2 {
                font-size: 1.6rem;
            }

            .tab-btn {
                padding: 10px 16px;
                font-size: 0.9rem;
            }

            .modal-content {
                width: 95%;
            }
        }
    </style>
</head>
<body>

<div class="sidebar" id="sidebar"></div>

<div class="main-content">
    <div class="top-bar">
        <button class="menu-toggle" onclick="toggleMenu()">
            <i class="fa-solid fa-bars"></i>
        </button>
        <h2 class="section-title">BSK Fotball Herrer - A lag</h2>
    </div>

    <!-- HERO SEKSJON -->
    <section class="spiller-hero">
        <div class="hero-content">
            <h2>Spillertropp</h2>
            <p>Oversikt over alle spillerne i troppen. Administrer draktnummer, posisjoner og personlige data.</p>
        </div>
    </section>

    <!-- FILTER BAR MED POSISJONSFILTRER -->
    <div class="filter-bar">
        <div>
            <button id="btnAlle" class="tab-btn active" onclick="window.switchPlayerView('Alle')">ALLE</button>
            <button id="btn1" class="tab-btn" onclick="window.switchPlayerView('Keeper')">1 - KEEPER</button>
            <button id="btn2" class="tab-btn" onclick="window.switchPlayerView('Høyre bekk')">2 - HØYRE BK</button>
            <button id="btn3" class="tab-btn" onclick="window.switchPlayerView('Venstre bekk')">3 - VENSTRE BK</button>
            <button id="btn4" class="tab-btn" onclick="window.switchPlayerView('Høyre stopper')">4 - HØYRE ST</button>
            <button id="btn5" class="tab-btn" onclick="window.switchPlayerView('Venstre stopper')">5 - VENSTRE ST</button>
            <button id="btn6" class="tab-btn" onclick="window.switchPlayerView('Defensiv midtbane')">6 - DEF MB</button>
            <button id="btn7" class="tab-btn" onclick="window.switchPlayerView('Høyre kant')">7 - HØYRE KANT</button>
            <button id="btn8" class="tab-btn" onclick="window.switchPlayerView('Offensiv midtbane')">8 - OFF MB</button>
            <button id="btn9" class="tab-btn" onclick="window.switchPlayerView('Spiss')">9 - SPISS</button>
            <button id="btn10" class="tab-btn" onclick="window.switchPlayerView('Playmaker')">10 - PLAYMAKER</button>
            <button id="btn11" class="tab-btn" onclick="window.switchPlayerView('Venstre kant')">11 - VENSTRE KANT</button>
        </div>
    </div>

    <!-- TABELL -->
    <div class="table-container">
        <table id="playerTable">
            <thead>
                <tr>
                    <th style="width: 50px;">#</th>
                    <th class="name-col">Navn</th>
                    <th>Pos</th>
                    <th>Fot</th>
                    <th>Alder</th>
                    <th style="width: 100px;"></th>
                </tr>
            </thead>
            <tbody id="playerTableBody"></tbody>
        </table>
    </div>
</div>

<!-- FAB KNAPP -->
<button class="fab-btn" onclick="window.openModal()" title="Registrer ny spiller">
    <i class="fa-solid fa-user-plus"></i>
    <span class="fab-text">Ny spiller</span>
</button>

<!-- MODAL -->
<div id="playerModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="formTitle">Registrer ny spiller</h3>
            <button class="close-btn" onclick="window.closeModal()">&times;</button>
        </div>
        <form id="playerForm">
            <input type="hidden" id="editId">
            <div class="form-stack">
                <div class="form-group">
                    <label>Fullt navn *</label>
                    <input type="text" id="navn" required>
                </div>
                
                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Fødselsår</label>
                        <input type="number" id="fodselsaar" placeholder="f.eks. 1998">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Draktnummer</label>
                        <input type="number" id="draktnummer">
                    </div>
                </div>

                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Posisjon 1</label>
                        <select id="pos1">
                            <option value="Keeper">1 - Keeper</option>
                            <option value="Høyre bekk">2 - Høyre bekk</option>
                            <option value="Venstre bekk">3 - Venstre bekk</option>
                            <option value="Høyre stopper">4 - Høyre stopper</option>
                            <option value="Venstre stopper">5 - Venstre stopper</option>
                            <option value="Defensiv midtbane">6 - Defensiv midtbane</option>
                            <option value="Høyre kant">7 - Høyre kant</option>
                            <option value="Offensiv midtbane">8 - Offensiv midtbane</option>
                            <option value="Spiss">9 - Spiss</option>
                            <option value="Playmaker">10 - Playmaker</option>
                            <option value="Venstre kant">11 - Venstre kant</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Posisjon 2</label>
                        <select id="pos2">
                            <option value="-">- Ingen -</option>
                            <option value="Keeper">1 - Keeper</option>
                            <option value="Høyre bekk">2 - Høyre bekk</option>
                            <option value="Venstre bekk">3 - Venstre bekk</option>
                            <option value="Høyre stopper">4 - Høyre stopper</option>
                            <option value="Venstre stopper">5 - Venstre stopper</option>
                            <option value="Defensiv midtbane">6 - Defensiv midtbane</option>
                            <option value="Høyre kant">7 - Høyre kant</option>
                            <option value="Offensiv midtbane">8 - Offensiv midtbane</option>
                            <option value="Spiss">9 - Spiss</option>
                            <option value="Playmaker">10 - Playmaker</option>
                            <option value="Venstre kant">11 - Venstre kant</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Foretrukket fot</label>
                    <select id="fot">
                        <option value="Høyre">Høyre</option>
                        <option value="Venstre">Venstre</option>
                        <option value="Begge">Begge</option>
                    </select>
                </div>
            </div>
            <div class="button-group">
                <button type="submit" id="submitBtn" class="btn btn-grow-2">Lagre spiller</button>
                <button type="button" class="btn btn-danger" onclick="window.closeModal()">Avbryt</button>
            </div>
        </form>
    </div>
</div>

<script src="navigation.js"></script>
<script type="module" src="spillere.js"></script>

<script>
    window.openModal = () => {
        document.getElementById('formTitle').innerText = 'Registrer ny spiller';
        document.getElementById('submitBtn').innerText = 'Lagre spiller';
        document.getElementById('playerModal').style.display = 'flex';
    };

    window.closeModal = () => {
        document.getElementById('playerModal').style.display = 'none';
        document.getElementById('playerForm').reset();
        document.getElementById('editId').value = '';
    };

    window.onclick = function(event) {
        if (event.target == document.getElementById('playerModal')) window.closeModal();
    }
</script>

</body>
</html>
