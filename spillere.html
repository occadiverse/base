<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spillerstall - BSK Fotball</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Siden vi har en rød hero her, beholder vi denne spesifikke stylingen */
        .spiller-hero {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            border-radius: 20px;
            padding: 40px; /* Litt mindre enn før for Gemini-stil */
            color: white;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(231, 76, 60, 0.2);
        }

        .spiller-hero h2 { font-size: 2rem; font-weight: 800; margin-bottom: 10px; }
        .spiller-hero p { font-size: 1.1rem; opacity: 0.9; max-width: 600px; line-height: 1.5; }

        /* Filter-linjen (Tabs) */
        .filter-bar {
            background: var(--white);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }

        .filter-bar > div { display: flex; gap: 8px; }

        .tab-btn {
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            background: var(--white);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-muted);
            transition: 0.2s;
            font-size: 0.85rem;
        }

        .tab-btn.active {
            background-color: #e74c3c !important; 
            color: #ffffff !important;
            border-color: #e74c3c;
        }

        /* Modal og form styling (Beholdes for funksjonalitet) */
        .modal {
            display: none;
            position: fixed;
            z-index: 3000; /* Høyere enn sidebar */
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: var(--white);
            padding: 25px;
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        /* FAB Button */
        .fab-btn {
            position: fixed;
            right: 25px;
            bottom: 25px;
            width: 56px;
            height: 56px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
            z-index: 1000;
        }
    </style>
</head>
<body>

<div class="sidebar" id="sidebar"></div>

<main class="main-content">
    <header class="top-bar">
        <button class="menu-toggle" onclick="toggleMenu()">
            <i class="fa-solid fa-bars"></i>
        </button>
        <!-- Navnet fylles nå automatisk av navigation.js ("Spillere") -->
        <h1 class="section-title"></h1>
        
        <!-- Her kan vi ha et søkefelt eller la det stå tomt for Gemini-look -->
        <div class="filter-wrapper"></div>
    </header>

    <section class="spiller-hero">
        <div class="hero-content">
            <h2>Spillertropp</h2>
            <p>Administrer draktnummer, posisjoner og personlige data for alle spillerne i troppen.</p>
        </div>
    </section>

    <div class="filter-bar">
        <div>
            <button id="btnAlle" class="tab-btn active" onclick="window.switchPlayerView('Alle')">ALLE</button>
            <button id="btn1" class="tab-btn" onclick="window.switchPlayerView('Keeper')">KEEPER</button>
            <button id="btn-for" class="tab-btn" onclick="window.switchPlayerView('Forsvar')">FORSVAR</button>
            <button id="btn-mid" class="tab-btn" onclick="window.switchPlayerView('Midtbane')">MIDTBANE</button>
            <button id="btn-ang" class="tab-btn" onclick="window.switchPlayerView('Angrep')">ANGREP</button>
        </div>
    </div>

    <div class="table-container">
        <table id="playerTable">
            <thead>
                <tr>
                    <th style="width: 50px;">#</th>
                    <th class="name-col">Navn</th>
                    <th>Pos</th>
                    <th>Fot</th>
                    <th>Alder</th>
                    <th style="width: 80px;"></th>
                </tr>
            </thead>
            <tbody id="playerTableBody"></tbody>
        </table>
    </div>
</main>

<button class="fab-btn" onclick="window.openModal()" title="Registrer ny spiller">
    <i class="fa-solid fa-plus"></i>
</button>

<!-- Modal (Samme form-logikk som før) -->
<div id="playerModal" class="modal">
    <div class="modal-content">
        <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 id="formTitle">Registrer ny spiller</h3>
            <button onclick="window.closeModal()" style="background:none; border:none; font-size: 24px; cursor:pointer;">&times;</button>
        </div>
        <form id="playerForm">
            <input type="hidden" id="editId">
            <div style="display: flex; flex-direction: column; gap: 15px;">
                <div class="form-group">
                    <label style="display:block; font-weight:600; margin-bottom:5px;">Fullt navn *</label>
                    <input type="text" id="navn" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
                </div>
                <!-- ... Resten av formen din her ... -->
                <div style="display: flex; gap: 10px;">
                    <button type="submit" id="submitBtn" class="btn" style="flex:2; background:#e74c3c; color:white; padding:12px; border:none; border-radius:8px; font-weight:600;">Lagre</button>
                    <button type="button" onclick="window.closeModal()" class="btn" style="flex:1; background:#eee; padding:12px; border:none; border-radius:8px;">Avbryt</button>
                </div>
            </div>
        </form>
    </div>
</div>

<script src="navigation.js"></script>
<script type="module" src="spillere.js"></script>

<script>
    window.openModal = () => { document.getElementById('playerModal').style.display = 'flex'; };
    window.closeModal = () => { document.getElementById('playerModal').style.display = 'none'; };
</script>

</body>
</html>
