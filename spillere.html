<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spillerstall - BSK Fotball</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar" id="sidebar"></div>

<div class="main-content">
    <div class="top-bar">
        <button class="menu-toggle" onclick="toggleMenu()">
            <i class="fa-solid fa-bars"></i>
        </button>
        <h2 class="section-title">Spillerstall</h2>

        <button class="btn btn-inline-icon push-right" onclick="openModal()">
            <i class="fa-solid fa-user-plus"></i> Ny spiller
        </button>
    </div>

    <div class="table-container">
        <table id="playerTable">
            <thead>
                <tr>
                    <th>#</th>
                    <th class="text-left">Navn</th>
                    <th>Født</th>
                    <th>Status</th>
                    <th>Mobil</th>
                    <th>Handling</th>
                </tr>
            </thead>
            <tbody id="playerTableBody">
                </tbody>
        </table>
    </div>
</div>

<div id="playerModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="formTitle">Registrer ny spiller</h3>
            <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
        <form id="playerForm">
            <input type="hidden" id="editId">
            <div class="form-stack">
                <div class="form-group">
                    <label>Fullt navn *</label>
                    <input type="text" id="navn" required placeholder="Navn på spiller">
                </div>
                <div class="form-group">
                    <label>Fødselsdato</label>
                    <input type="date" id="fodselsdato">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="status">
                        <option value="Aktiv">Aktiv</option>
                        <option value="Passiv">Passiv</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Mobil</label>
                    <input type="tel" id="mobil" placeholder="Mobilnummer">
                </div>
                <div class="form-group">
                    <label>Draktnummer</label>
                    <input type="number" id="draktnummer" placeholder="Nr">
                </div>
            </div>
            <div class="button-group">
                <button type="submit" id="submitBtn" class="btn btn-grow-2">Lagre Spiller</button>
                <button type="button" class="btn btn-danger btn-grow-1" onclick="closeModal()">Avbryt</button>
            </div>
        </form>
    </div>
</div>

<script src="database.js"></script>
<script src="navigation.js"></script>
<script src="spillere.js"></script>

</body>
</html>
