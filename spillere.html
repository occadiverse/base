<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <title>Spillerstall - BSK Fotball</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=2">
    
    <style>
        /* BSK-blå Hero */
        .spiller-hero {
            background: linear-gradient(135deg, var(--bsk-blue) 0%, #003366 100%);
            border-radius: 20px;
            padding: 40px;
            color: white;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 86, 179, 0.2);
        }

        .hero-intro-text { font-size: 1.2rem; opacity: 0.9; max-width: 800px; line-height: 1.6; margin: 0; }
        .hero-intro-text strong { color: var(--bsk-yellow); font-weight: 800; }

        /* Filter Tabs */
        .filter-bar {
            background: var(--white);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            overflow-x: auto;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            padding: 10px 18px;
            border: 1px solid transparent;
            background: transparent;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            color: var(--text-muted);
            transition: 0.2s;
            font-size: 0.8rem;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .tab-btn.active {
            background-color: var(--active-bg) !important; 
            color: var(--bsk-blue) !important;
            border: 1px solid var(--bsk-blue);
        }

        /* Form styling */
        .form-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .form-group { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-weight: 600; font-size: 0.85rem; color: var(--text-main); }
        .form-control { 
            width: 100%; padding: 12px; border-radius: 10px; 
            border: 1.5px solid var(--border-color); outline: none; font-family: inherit;
        }

        /* FAB Button */
        .fab-btn {
            position: fixed;
            right: 25px;
            bottom: 25px;
            width: 60px;
            height: 60px;
            background: var(--bsk-blue);
            color: var(--bsk-yellow);
            border: 2px solid var(--bsk-yellow);
            border-radius: 50%;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 1000;
        }

        @media (max-width: 768px) { .fab-btn { bottom: 85px; } }

        .modal {
            display: none;
            position: fixed;
            z-index: 3000;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background-color: var(--white);
            padding: 30px;
            border-radius: 20px;
            width: 95%;
            max-width: 500px;
            box-shadow: var(--shadow);
            max-height: 90vh;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <a href="index.html" class="logo-brand"><i class="fa-solid fa-shield-halved"></i>BSK <span id="logo-lag-navn">LAG A</span></a>
        <h1 id="section-title" class="section-title">Tropp</h1>
        
        <div class="filter-wrapper" style="display: flex; gap: 8px;">
            <!-- Globalt Sesongsfilter -->
            <div class="filter-container">
                <i class="fa-solid fa-calendar-days"></i>
                <select id="statPeriodSelect" class="base-select"></select>
            </div>

            <!-- Dynamisk lagfilter -->
            <div class="filter-container">
                <i class="fa-solid fa-filter"></i>
                <select id="lagFilterSelect" class="base-select">
                    <option value="Alle">ALLE LAG</option>
                    <option value="Lag A">LAG A</option>
                    <option value="Lag B">LAG B</option>
                </select>
            </div>
        </div>
    </header>

    <aside id="sidebar" class="sidebar"></aside>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Hjem</span>
        </a>
        <a href="oppmote.html" class="nav-item">
            <i class="fa-solid fa-calendar-check"></i>
            <span>Oppmøte</span>
        </a>
        <a href="kamper.html" class="nav-item">
            <i class="fa-solid fa-soccer-ball"></i>
            <span>Kamper</span>
        </a>
        <a href="spillere.html" class="nav-item active">
            <i class="fa-solid fa-users"></i>
            <span>Tropp</span>
        </a>
        <a href="statistikk.html" class="nav-item">
            <i class="fa-solid fa-chart-line"></i>
            <span>Stats</span>
        </a>
    </nav>

    <main class="main-content">
        <section class="spiller-hero">
            <div class="hero-content">
                <p class="hero-intro-text">
                    I valgt sesong består troppen av <strong id="stat-total-players">0 spillere</strong> med en gjennomsnittsalder på 
                    <strong id="stat-avg-age">0 år</strong>. Vi har for øyeblikket <strong id="stat-total-rekrutt">0 rekrutter</strong> tilknyttet troppen. 
                </p>
            </div>
        </section>

        <div class="table-container">
            <table id="playerTable" class="match-table">
                <thead>
                    <tr>
                        <th class="name-col" style="text-align: left;">Navn</th>
                        <th style="width: 50px;">#</th>
                        <th>Pos</th>
                        <th>Fot</th>
                        <th>Alder</th>
                        <th style="width: 80px;"></th>
                    </tr>
                </thead>
                <tbody id="playerTableBody"></tbody>
            </table>
        </div>
    </main>

    <button class="fab-btn" onclick="window.openPlayerModal()" title="Registrer ny spiller">
        <i class="fa-solid fa-plus"></i>
    </button>

    <div id="playerModal" class="modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 id="formTitle" style="color: var(--bsk-blue); margin:0;">Registrer spiller</h3>
                <button onclick="window.closePlayerModal()" style="background:none; border:none; font-size: 24px; cursor:pointer; color: var(--text-muted);">&times;</button>
            </div>
            
            <form id="playerForm">
                <input type="hidden" id="editId">
                
                <div class="form-row">
                    <div class="form-group" style="flex: 3;">
                        <label>Fullt navn</label>
                        <input type="text" id="navn" required class="form-control" placeholder="Navn Navnesen">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Nr #</label>
                        <input type="number" id="draktnummer" class="form-control" placeholder="00">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Fødselsår</label>
                        <input type="number" id="fodselsaar" class="form-control" placeholder="f.eks 1998">
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="status" class="form-control">
                            <option value="Aktiv">Aktiv</option>
                            <option value="Rekrutt">Rekrutt</option>
                            <option value="Passiv">Passiv</option>
                        </select>
                    </div>
                </div>

                <!-- Tildeling av lag -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="spillerLag">Tilhører lag</label>
                        <select id="spillerLag" class="form-control">
                            <option value="Lag A">Lag A</option>
                            <option value="Lag B">Lag B</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Hovedposisjon</label>
                        <select id="pos1" class="form-control">
                            <option value="Keeper">Keeper</option>
                            <option value="Høyre bekk">Høyre bekk</option>
                            <option value="Venstre bekk">Venstre bekk</option>
                            <option value="Høyre stopper">Høyre stopper</option>
                            <option value="Venstre stopper">Venstre stopper</option>
                            <option value="Defensiv midtbane">Defensiv midtbane</option>
                            <option value="Høyre kant">Høyre kant</option>
                            <option value="Offensiv midtbane">Offensiv midtbane</option>
                            <option value="Spiss">Spiss</option>
                            <option value="Playmaker">Playmaker</option>
                            <option value="Venstre kant">Venstre kant</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Sekundærposisjon</label>
                        <select id="pos2" class="form-control">
                            <option value="-">- Ingen -</option>
                            <option value="Høyre bekk">Høyre bekk</option>
                            <option value="Venstre bekk">Venstre bekk</option>
                            <option value="Høyre stopper">Høyre stopper</option>
                            <option value="Venstre stopper">Venstre stopper</option>
                            <option value="Defensiv midtbane">Defensiv midtbane</option>
                            <option value="Høyre kant">Høyre kant</option>
                            <option value="Offensiv midtbane">Offensiv midtbane</option>
                            <option value="Spiss">Spiss</option>
                            <option value="Playmaker">Playmaker</option>
                            <option value="Venstre kant">Venstre kant</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Foretrukket fot</label>
                        <select id="fot" class="form-control">
                            <option value="Høyre">Høyre</option>
                            <option value="Venstre">Venstre</option>
                            <option value="Begge">Begge</option>
                        </select>
                    </div>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button type="submit" id="submitBtn" style="flex:2; background: var(--bsk-blue); color: white; padding:14px; border:none; border-radius:12px; font-weight:700; cursor: pointer;">LAGRE SPILLER</button>
                    <button type="button" onclick="window.closePlayerModal()" style="flex:1; background: var(--bg-light); padding:14px; border:none; border-radius:12px; font-weight:600; cursor: pointer;">AVBRYT</button>
                </div>
            </form>
        </div>
    </div>

    <script src="navigation.js"></script>
    <script type="module" src="spillere.js"></script>
</body>
</html>
