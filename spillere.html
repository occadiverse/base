<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spillerstall - BSK Fotball</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar" id="sidebar"></div>

<div class="main-content">
    <div class="top-bar">
        <button class="menu-toggle" onclick="toggleMenu()">
            <i class="fa-solid fa-bars"></i>
        </button>
        <h2 class="section-title">Spillerstall</h2>
        
        <button class="btn-outline" onclick="openModal()">
            <i class="fa-solid fa-user-plus"></i> <span>Ny spiller</span>
        </button>
    </div>

    <div class="filter-bar">
        <div class="centered-tools">
            <p class="help-text" style="margin: 0;">Administrer troppen og spillerdetaljer</p>
        </div>
    </div>

    <div class="table-container">
        <table id="playerTable" class="player-management-table">
            <thead>
                <tr>
                    <th style="width: 50px;">#</th>
                    <th class="text-left">Navn</th>
                    <th>Status</th>
                    <th>Mobil</th>
                    <th style="width: 100px;">Handlinger</th>
                </tr>
            </thead>
            <tbody id="playerTableBody"></tbody>
        </table>
    </div>
</div>
