<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spillerstall - BSK Fotball</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="nav-brand">BSK Fotball 2026</a>
    <div class="nav-links-container">
        <a href="oppmote.html" class="nav-item">📅 Oppmøte</a>
        <a href="spillere.html" class="nav-item active">👥 Spillere</a>
        <a href="statistikk.html" class="nav-item">📊 Stats</a>
    </div>
</nav>

<div class="container">
    <div class="card">
        <h3 id="formTitle" style="margin-top:0; color: var(--primary-color);">Registrer ny spiller</h3>
        <form id="playerForm">
            <input type="hidden" id="editId">
            <div class="form-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px;">
                <div class="form-group">
                    <label style="display:block; font-size: 0.8rem; margin-bottom: 5px;">Fullt navn *</label>
                    <input type="text" id="navn" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
                </div>
                <div class="form-group">
                    <label style="display:block; font-size: 0.8rem; margin-bottom: 5px;">Fødselsdato</label>
                    <input type="date" id="fodselsdato" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
                </div>
                <div class="form-group">
                    <label style="display:block; font-size: 0.8rem; margin-bottom: 5px;">Status</label>
                    <select id="status" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
                        <option value="Aktiv">Aktiv</option>
                        <option value="Passiv">Passiv</option>
                    </select>
                </div>
                <div class="form-group">
                    <label style="display:block; font-size: 0.8rem; margin-bottom: 5px;">Mobil</label>
                    <input type="tel" id="mobil" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
                </div>
                <div class="form-group">
                    <label style="display:block; font-size: 0.8rem; margin-bottom: 5px;">E-post</label>
                    <input type="email" id="epost" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
                </div>
                <div class="form-group">
                    <label style="display:block; font-size: 0.8rem; margin-bottom: 5px;">Draktnummer</label>
                    <input type="number" id="draktnummer" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
                </div>
            </div>
            <div class="button-group" style="display: flex; gap: 10px;">
                <button type="submit" id="submitBtn" class="btn-save">Lagre Spiller</button>
                <button type="button" id="cancelBtn" class="btn-print" onclick="resetForm()" style="display:none; border: 1px solid #ccc; color: #666;">Avbryt</button>
            </div>
        </form>
    </div>

    <div class="card" style="padding: 10px; overflow-x: auto;">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th style="text-align: left;">Navn</th>
                    <th>Født</th>
                    <th>Status</th>
                    <th>Mobil</th>
                    <th>Handling</th>
                </tr>
            </thead>
            <tbody id="playerTableBody"></tbody>
        </table>
    </div>
</div>

<script src="database.js"></script>
<script>
    let spillerliste = DB.getPlayers();

    document.getElementById('playerForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const editId = document.getElementById('editId').value;
        const spillerData = {
            id: editId || DB.generateId(),
            navn: document.getElementById('navn').value,
            fodselsdato: document.getElementById('fodselsdato').value,
            status: document.getElementById('status').value,
            mobil: document.getElementById('mobil').value,
            epost: document.getElementById('epost').value,
            draktnummer: document.getElementById('draktnummer').value
        };

        if (editId) {
            const index = spillerliste.findIndex(s => s.id === editId);
            spillerliste[index] = spillerData;
        } else {
            spillerliste.push(spillerData);
        }

        DB.savePlayers(spillerliste);
        renderPlayers();
        resetForm();
    });

    function editPlayer(id) {
        const spiller = spillerliste.find(s => s.id === id);
        if (!spiller) return;
        document.getElementById('editId').value = spiller.id;
        document.getElementById('navn').value = spiller.navn;
        document.getElementById('fodselsdato').value = spiller.fodselsdato;
        document.getElementById('status').value = spiller.status;
        document.getElementById('mobil').value = spiller.mobil;
        document.getElementById('epost').value = spiller.epost;
        document.getElementById('draktnummer').value = spiller.draktnummer;
        
        document.getElementById('formTitle').innerText = "Rediger spiller";
        document.getElementById('submitBtn').innerText = "Oppdater Spiller";
        document.getElementById('cancelBtn').style.display = "block";
        window.scrollTo(0, 0);
    }

    function deletePlayer(id) {
        if(confirm("Er du sikker på at du vil slette denne spilleren?")) {
            spillerliste = spillerliste.filter(s => s.id !== id);
            DB.savePlayers(spillerliste);
            renderPlayers();
        }
    }

    function resetForm() {
        document.getElementById('playerForm').reset();
        document.getElementById('editId').value = "";
        document.getElementById('formTitle').innerText = "Registrer ny spiller";
        document.getElementById('submitBtn').innerText = "Lagre Spiller";
        document.getElementById('cancelBtn').style.display = "none";
    }

    function renderPlayers() {
        const sorted = [...spillerliste].sort((a, b) => (parseInt(a.draktnummer) || 999) - (parseInt(b.draktnummer) || 999));
        
        document.getElementById('playerTableBody').innerHTML = sorted.map(s => `
            <tr>
                <td><strong>${s.draktnummer || '-'}</strong></td>
                <td style="text-align: left;">${s.navn}</td>
                <td>${s.fodselsdato || '-'}</td>
                <td><span class="type-tag ${s.status === 'Aktiv' ? 'tag-t' : 'tag-none'}" style="padding: 5px 10px; border-radius: 20px;">${s.status}</span></td>
                <td>${s.mobil || '-'}</td>
                <td>
                    <button onclick="editPlayer('${s.id}')" style="padding: 5px 10px; font-size: 0.7rem; background: #eee; color: #333; margin-right:5px;">Endre</button>
                    <button onclick="deletePlayer('${s.id}')" style="padding: 5px 10px; font-size: 0.7rem; background: #ffebee; color: #c62828;">Slett</button>
                </td>
            </tr>`).join('');
    }

    renderPlayers();
</script>
</body>
</html>
