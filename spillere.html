<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spillerstall - BSK Fotball</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar" id="sidebar"></div>

<div class="main-content">
    <div class="top-bar">
        <button class="menu-toggle" id="openBtn" onclick="toggleMenu()" style="display:none;">
            <i class="fa-solid fa-bars"></i>
        </button>
        <h2 style="margin:0; font-size: 1.1rem;">Spillere</h2>
    </div>

    <div class="table-container">
        <div class="card" style="margin-bottom: 30px; padding: 20px; border: 1px solid var(--border-color); border-radius: 8px;">
            <h3 id="formTitle" style="margin-top:0; color: var(--primary);">Registrer ny spiller</h3>
            <form id="playerForm">
                <input type="hidden" id="editId">
                <div class="form-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px;">
                    <div class="form-group">
                        <label>Fullt navn *</label>
                        <input type="text" id="navn" required>
                    </div>
                    <div class="form-group">
                        <label>Fødselsdato</label>
                        <input type="date" id="fodselsdato">
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="status">
                            <option value="Aktiv">Aktiv</option>
                            <option value="Passiv">Passiv</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Mobil</label>
                        <input type="tel" id="mobil">
                    </div>
                    <div class="form-group">
                        <label>Draktnummer</label>
                        <input type="number" id="draktnummer">
                    </div>
                </div>
                <div class="button-group" style="display: flex; gap: 10px;">
                    <button type="submit" id="submitBtn" class="btn">Lagre Spiller</button>
                    <button type="button" id="cancelBtn" class="btn btn-danger" onclick="resetForm()" style="display:none;">Avbryt</button>
                </div>
            </form>
        </div>

        <table id="attendanceTable"> <thead>
                <tr>
                    <th>#</th>
                    <th style="text-align: left;">Navn</th>
                    <th>Født</th>
                    <th>Status</th>
                    <th>Mobil</th>
                    <th>Handling</th>
                </tr>
            </thead>
            <tbody id="playerTableBody"></tbody>
        </table>
    </div>
</div>

<script src="database.js"></script>
<script src="navigation.js"></script> <script>
    let spillerliste = DB.getPlayers();

    // Logikken din beholdes, men vi bruker DB-funksjonene konsekvent
    document.getElementById('playerForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const editId = document.getElementById('editId').value;
        const spillerData = {
            id: editId || (Date.now().toString()), // Enkel ID-generator
            navn: document.getElementById('navn').value,
            fodselsdato: document.getElementById('fodselsdato').value,
            status: document.getElementById('status').value,
            mobil: document.getElementById('mobil').value,
            draktnummer: document.getElementById('draktnummer').value
        };

        if (editId) {
            const index = spillerliste.findIndex(s => s.id === editId);
            spillerliste[index] = spillerData;
        } else {
            spillerliste.push(spillerData);
        }

        DB.savePlayers(spillerliste);
        renderPlayers();
        resetForm();
    });

    // ... behold resten av funksjonene dine (editPlayer, deletePlayer, resetForm) ...

    function renderPlayers() {
        const sorted = [...spillerliste].sort((a, b) => (parseInt(a.draktnummer) || 999) - (parseInt(b.draktnummer) || 999));
        
        document.getElementById('playerTableBody').innerHTML = sorted.map(s => `
            <tr>
                <td><strong>${s.draktnummer || '-'}</strong></td>
                <td style="text-align: left;">${s.navn}</td>
                <td>${s.fodselsdato || '-'}</td>
                <td><span style="background: ${s.status === 'Aktiv' ? 'var(--bsk-gul)' : '#eee'}; padding: 4px 8px; border-radius: 4px; font-size: 11px;">${s.status}</span></td>
                <td>${s.mobil || '-'}</td>
                <td>
                    <button class="btn" style="padding: 5px 10px; font-size: 11px; background: var(--hover-bg); color: var(--text-dark);" onclick="editPlayer('${s.id}')">Endre</button>
                    <button class="btn btn-danger" style="padding: 5px 10px; font-size: 11px;" onclick="deletePlayer('${s.id}')">Slett</button>
                </td>
            </tr>`).join('');
    }

    renderPlayers();
</script>
</body>
</html>
