<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spillerstall - BSK Fotball</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar" id="sidebar"></div>

<div class="main-content">
    <div class="top-bar">
        <button class="menu-toggle" onclick="toggleMenu()">
            <i class="fa-solid fa-bars"></i>
        </button>
        <h2 class="section-title">Spillerstall</h2>

        <button class="btn-outline" onclick="openModal()">
            <i class="fa-solid fa-user-plus"></i> <span>Ny spiller</span>
        </button>
    </div>

    <div class="filter-bar">
        <div class="centered-tools">
            <p class="help-text">Administrer spillerstallen i skyen</p>
        </div>
    </div>

    <div class="table-container">
        <table id="playerTable">
            <thead>
                <tr>
                    <th>#</th>
                    <th class="text-left">Navn</th>
                    <th>Status</th>
                    <th>Mobil</th>
                    <th>Handling</th>
                </tr>
            </thead>
            <tbody id="playerTableBody"></tbody>
        </table>
    </div>
</div>

<div id="playerModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="formTitle">Registrer ny spiller</h3>
            <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
        <form id="playerForm">
            <input type="hidden" id="editId">
            <div class="form-stack">
                <div class="form-group">
                    <label>Fullt navn *</label>
                    <input type="text" id="navn" required>
                </div>
                <div class="form-group">
                    <label>Fødselsdato</label>
                    <input type="date" id="fodselsdato">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="status">
                        <option value="Aktiv">Aktiv</option>
                        <option value="Passiv">Passiv</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Mobil</label>
                    <input type="tel" id="mobil">
                </div>
                <div class="form-group">
                    <label>Draktnummer</label>
                    <input type="number" id="draktnummer">
                </div>
            </div>
            <div class="button-group">
                <button type="submit" id="submitBtn" class="btn btn-grow-2">Lagre</button>
                <button type="button" class="btn btn-danger" onclick="closeModal()">Avbryt</button>
            </div>
        </form>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDyULE6HGOINM6D8bqBZGbVMaGHAF3RkJg",
        authDomain: "base-49ce3.firebaseapp.com",
        databaseURL: "https://base-49ce3-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "base-49ce3",
        storageBucket: "base-49ce3.firebasestorage.app",
        messagingSenderId: "4752321901",
        appId: "1:4752321901:web:089814e4faefbdeff9be64",
        measurementId: "G-YZE1RSW4CN"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.db = db;
    window.dbRef = ref;
    window.dbSet = set;
    window.dbOnValue = onValue;
    window.dbGet = get;

    console.log("Firebase tilkoblet spillere.html");
</script>

<script src="database.js"></script>
<script src="navigation.js"></script>
<script src="spillere.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Sjekker om navigation.js er lastet riktig
        if (typeof window.loadNavigation === 'function') {
            window.loadNavigation();
        }
    });
</script>

</body>
</html>
