<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spillerstall - BSK Fotball</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar" id="sidebar"></div>

<div class="main-content">
    <div class="top-bar">
        <button class="menu-toggle" id="openBtn" onclick="toggleMenu()" style="display:none;">
            <i class="fa-solid fa-bars"></i>
        </button>
        <h2 style="margin:0; font-size: 1.1rem;">Spillere</h2>
    </div>

    <div class="table-container">
        <div class="card" style="margin-bottom: 30px; padding: 25px; border: 1px solid var(--border-color); border-radius: 8px; max-width: 500px;">
            <h3 id="formTitle" style="margin-top:0; color: var(--primary); margin-bottom: 20px;">Registrer ny spiller</h3>
            <form id="playerForm">
            <input type="hidden" id="editId">
        
            <div class="form-stack" style="display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px;">
            <div class="form-group">
                <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: var(--text-main);">Fullt navn *</label>
                <input type="text" id="navn" required placeholder="F.eks. Ola Nordmann" style="width: 100%; box-sizing: border-box;">
            </div>

            <div class="form-group">
                <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: var(--text-main);">Fødselsdato</label>
                <input type="date" id="fodselsdato" style="width: 100%; box-sizing: border-box;">
            </div>

            <div class="form-group">
                <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: var(--text-main);">Status</label>
                <select id="status" style="width: 100%; box-sizing: border-box;">
                    <option value="Aktiv">Aktiv</option>
                    <option value="Passiv">Passiv</option>
                </select>
            </div>

            <div class="form-group">
                <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: var(--text-main);">Mobil</label>
                <input type="tel" id="mobil" placeholder="8 siffer" style="width: 100%; box-sizing: border-box;">
            </div>

            <div class="form-group">
                <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: var(--text-main);">Draktnummer</label>
                <input type="number" id="draktnummer" placeholder="F.eks. 10" style="width: 100%; box-sizing: border-box;">
            </div>
        </div>

        <div class="button-group" style="display: flex; gap: 10px;">
            <button type="submit" id="submitBtn" class="btn" style="flex: 1;">Lagre Spiller</button>
            <button type="button" id="cancelBtn" class="btn btn-danger" onclick="resetForm()" style="display:none; flex: 1;">Avbryt</button>
        </div>
    </form>
</div>

        <table id="attendanceTable"> 
            <thead>
                <tr>
                    <th>#</th>
                    <th style="text-align: left;">Navn</th>
                    <th>Født</th>
                    <th>Status</th>
                    <th>Mobil</th>
                    <th>Handling</th>
                </tr>
            </thead>
            <tbody id="playerTableBody"></tbody>
        </table>
    </div>
</div>

<script src="database.js"></script>
<script src="navigation.js"></script> 
<script>
    // Hent listen fra databasen med en gang siden lastes
    let spillerliste = DB.getPlayers();

    // HÅNDTERING AV SKJEMA (LAGRE/OPPDATERE)
    document.getElementById('playerForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const editId = document.getElementById('editId').value;
        const spillerData = {
            id: editId || (Date.now().toString()), 
            navn: document.getElementById('navn').value,
            fodselsdato: document.getElementById('fodselsdato').value,
            status: document.getElementById('status').value,
            mobil: document.getElementById('mobil').value,
            draktnummer: document.getElementById('draktnummer').value
        };

        if (editId) {
            const index = spillerliste.findIndex(s => s.id === editId);
            if (index !== -1) spillerliste[index] = spillerData;
        } else {
            spillerliste.push(spillerData);
        }

        DB.savePlayers(spillerliste);
        renderPlayers();
        resetForm();
    });

    // REDIGER SPILLER
    function editPlayer(id) {
        const spiller = spillerliste.find(s => s.id === id);
        if (!spiller) return;

        document.getElementById('editId').value = spiller.id;
        document.getElementById('navn').value = spiller.navn;
        document.getElementById('fodselsdato').value = spiller.fodselsdato;
        document.getElementById('status').value = spiller.status;
        document.getElementById('mobil').value = spiller.mobil;
        document.getElementById('draktnummer').value = spiller.draktnummer;
        
        document.getElementById('formTitle').innerText = "Rediger spiller";
        document.getElementById('submitBtn').innerText = "Oppdater Spiller";
        document.getElementById('cancelBtn').style.display = "block";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // SLETT SPILLER (Denne du trengte!)
    function deletePlayer(id) {
        if (confirm("Er du sikker på at du vil slette denne spilleren?")) {
            // Filtrer ut spilleren som skal slettes
            spillerliste = spillerliste.filter(s => s.id !== id);
            // Lagre den nye listen til localStorage via database.js
            DB.savePlayers(spillerliste);
            // Tegn tabellen på nytt
            renderPlayers();
        }
    }

    // NULLSTILL SKJEMA
    function resetForm() {
        document.getElementById('playerForm').reset();
        document.getElementById('editId').value = "";
        document.getElementById('formTitle').innerText = "Registrer ny spiller";
        document.getElementById('submitBtn').innerText = "Lagre Spiller";
        document.getElementById('cancelBtn').style.display = "none";
    }

    // TEGN TABELLEN
    function renderPlayers() {
        const sorted = [...spillerliste].sort((a, b) => (parseInt(a.draktnummer) || 999) - (parseInt(b.draktnummer) || 999));
        
        document.getElementById('playerTableBody').innerHTML = sorted.map(s => `
            <tr>
                <td><strong>${s.draktnummer || '-'}</strong></td>
                <td style="text-align: left;">${s.navn}</td>
                <td>${s.fodselsdato || '-'}</td>
                <td><span style="background: ${s.status === 'Aktiv' ? 'var(--bsk-gul)' : '#eee'}; padding: 4px 8px; border-radius: 4px; font-size: 11px;">${s.status}</span></td>
                <td>${s.mobil || '-'}</td>
                <td>
                    <button class="btn" style="padding: 5px 10px; font-size: 11px; background: var(--hover-bg); color: var(--text-dark);" onclick="editPlayer('${s.id}')">Endre</button>
                    <button class="btn btn-danger" style="padding: 5px 10px; font-size: 11px;" onclick="deletePlayer('${s.id}')">Slett</button>
                </td>
            </tr>`).join('');
    }

    // Kjør tegning av tabell ved oppstart
    renderPlayers();
</script>
</body>
</html>
