<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Test Statistikk - BSK Fotball</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=2">
    
    <style>
        /* Ekte BSK-blå Hero kopiert inn på testsiden */
        .kamper-hero {
            background: linear-gradient(135deg, var(--bsk-blue) 0%, #003366 100%);
            border-radius: 20px;
            padding: 40px;
            color: white;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 86, 179, 0.2);
        }

        .hero-intro-text { font-size: 1.2rem; opacity: 0.9; max-width: 800px; line-height: 1.6; margin: 0; }
        .hero-intro-text strong { color: var(--bsk-yellow); font-weight: 800; }

        /* Hovedkortet for statistikken */
        .main-stat-card {
            background: var(--white);
            border-radius: 15px;
            padding: 25px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            margin-bottom: 50px;
            display: flex;
            flex-direction: column;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #f1f5f9; 
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
        }

        /* Den nye "Kampinfo"-inspirerte knappen */
        .show-all-btn {
            width: 100%;
            background: var(--active-bg);
            border: none;
            color: var(--bsk-blue);
            padding: 14px;
            border-radius: 10px;
            margin-top: 20px;
            margin-bottom: 10px;
            font-weight: 800;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            text-align: center;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            -webkit-tap-highlight-color: transparent;
        }

        .show-all-btn:active {
            background: rgba(0, 86, 179, 0.16);
            transform: scale(0.98);
        }
    </style>
</head>
<body style="background:#f4f7f6; padding: 15px;">

    <!-- Topp-bar for filter og måned (Simulert på testsiden) -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1 style="font-size: 1.2rem; font-weight: 900; color: var(--text-main);">TESTMILJØ</h1>
        <select id="statPeriodSelect" style="padding: 8px 12px; border-radius: 8px; font-weight: 700; border: 1px solid var(--border-color); background: white; color: var(--bsk-blue);">
            <option value="total">Sesong 2026</option>
        </select>
    </div>

    <!-- Ekte Hero-boks med dynamisk tekst -->
    <section class="kamper-hero">
        <div class="hero-content">
            <p class="hero-intro-text">
                <strong id="stat-period-word">Hele sesongen</strong> har så langt gitt oss <strong id="teamMatches">-</strong> kamper, totalt 
                <strong id="teamGoals">-</strong> scorede mål, og en seiersprosent på 
                <strong id="teamWinRate">-%</strong> basert på dine kamprapporter.
            </p>
        </div>
    </section>

    <!-- Hovedkortet med de 6 fanene og den nye "Kampinfo"-knappen -->
    <div class="main-stat-card">
        <div class="stat-tabs" style="display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; margin-bottom: 15px; width: 100%;">
            <button class="tab-btn" onclick="window.switchStatTab('maal')" id="tab-maal" style="padding: 10px 0; border-radius: 6px; border: none; font-weight: 800; font-size: 0.65rem; text-align: center; cursor: pointer; background: var(--bsk-blue); color: white;">MÅL</button>
            <button class="tab-btn" onclick="window.switchStatTab('assist')" id="tab-assist" style="padding: 10px 0; border-radius: 6px; border: none; font-weight: 800; font-size: 0.65rem; text-align: center; cursor: pointer; background: var(--bg-light); color: var(--text-muted);">ASSIST</button>
            <button class="tab-btn" onclick="window.switchStatTab('trening')" id="tab-trening" style="padding: 10px 0; border-radius: 6px; border: none; font-weight: 800; font-size: 0.65rem; text-align: center; cursor: pointer; background: var(--bg-light); color: var(--text-muted);">TREN</button>
            <button class="tab-btn" onclick="window.switchStatTab('kamp')" id="tab-kamp" style="padding: 10px 0; border-radius: 6px; border: none; font-weight: 800; font-size: 0.65rem; text-align: center; cursor: pointer; background: var(--bg-light); color: var(--text-muted);">KAMP</button>
            <button class="tab-btn" onclick="window.switchStatTab('mvpkamp')" id="tab-mvpkamp" style="padding: 10px 0; border-radius: 6px; border: none; font-weight: 800; font-size: 0.65rem; text-align: center; cursor: pointer; background: var(--bg-light); color: var(--text-muted);">MVP</button>
            <button class="tab-btn" onclick="window.switchStatTab('mvplag')" id="tab-mvplag" style="padding: 10px 0; border-radius: 6px; border: none; font-weight: 800; font-size: 0.65rem; text-align: center; cursor: pointer; background: var(--bg-light); color: var(--text-muted);">LAG</button>
        </div>

        <div id="tabContentContainer"></div>
    </div>

    <script type="module" src="statistikk-test.js"></script>
</body>
</html>
