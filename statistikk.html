<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Statistikk - BSK Fotball</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="stylesheet" href="modals.css?v=2">
    
    <style>
        /* BSK-blå Hero - Hentet direkte fra din kamper.html */
        .kamper-hero {
            background: linear-gradient(135deg, var(--bsk-blue) 0%, #003366 100%);
            border-radius: 20px;
            padding: 40px;
            color: white;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 86, 179, 0.2);
        }

        .hero-intro-text { font-size: 1.2rem; opacity: 0.9; max-width: 800px; line-height: 1.6; margin: 0; }
        .hero-intro-text strong { color: var(--bsk-yellow); font-weight: 800; }

        /* Stilrent samlekort for statistikken */
        .main-stat-card {
            background: var(--white);
            border-radius: 15px;
            padding: 25px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            margin-bottom: 50px;
            display: flex;
            flex-direction: column;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #f1f5f9; 
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
        }

        /* Dynamisk infofelt i bunn av kortet */
        .dynamic-stat-info {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed var(--border-color);
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.5;
        }
        .dynamic-stat-info i { margin-right: 6px; color: var(--bsk-blue); }
    </style>
</head>
<body>

<header class="top-bar">
    <a href="index.html" class="logo-brand"><i class="fa-solid fa-shield-halved"></i>BSK <span>A-LAG</span></a>
    <h1 id="section-title" class="section-title">Stats</h1>
    <div class="filter-wrapper">
        <div class="filter-container">
            <i class="fa-solid fa-calendar-check"></i>
            <select id="statPeriodSelect" class="base-select">
                <option value="total">Hele sesongen</option>
            </select>
        </div>
    </div>
</header>

<div class="sidebar" id="sidebar"></div>

<nav class="bottom-nav"></nav>

<main class="main-content">
    <!-- Hero-boks med lagsammendrag -->
    <section class="kamper-hero">
        <div class="hero-content">
            <p class="hero-intro-text">
                <strong id="stat-period-word">Hele sesongen</strong> har så langt gitt oss <strong id="teamMatches">-</strong> kamper, totalt 
                <strong id="teamGoals">-</strong> scorede mål, og en seiersprosent på 
                <strong id="teamWinRate">-%</strong> basert på dine kamprapportorter.
            </p>
        </div>
    </section>

    <!-- Hovedkontor for statistikken: De 6 app-fanene låst på én rad -->
    <div class="main-stat-card">
        <div class="stat-tabs" style="display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; margin-bottom: 15px; width: 100%;">
            <button class="tab-btn" onclick="window.switchStatTab('maal')" id="tab-maal" style="padding: 10px 0; border-radius: 6px; border: none; font-weight: 800; font-size: 0.65rem; text-align: center; cursor: pointer; background: var(--bsk-blue); color: white; transition: 0.2s;">MÅL</button>
            <button class="tab-btn" onclick="window.switchStatTab('assist')" id="tab-assist" style="padding: 10px 0; border-radius: 6px; border: none; font-weight: 800; font-size: 0.65rem; text-align: center; cursor: pointer; background: var(--bg-light); color: var(--text-muted); transition: 0.2s;">ASSIST</button>
            <button class="tab-btn" onclick="window.switchStatTab('trening')" id="tab-trening" style="padding: 10px 0; border-radius: 6px; border: none; font-weight: 800; font-size: 0.65rem; text-align: center; cursor: pointer; background: var(--bg-light); color: var(--text-muted); transition: 0.2s;">TREN</button>
            <button class="tab-btn" onclick="window.switchStatTab('kamp')" id="tab-kamp" style="padding: 10px 0; border-radius: 6px; border: none; font-weight: 800; font-size: 0.65rem; text-align: center; cursor: pointer; background: var(--bg-light); color: var(--text-muted); transition: 0.2s;">KAMP</button>
            <button class="tab-btn" onclick="window.switchStatTab('mvpkamp')" id="tab-mvpkamp" style="padding: 10px 0; border-radius: 6px; border: none; font-weight: 800; font-size: 0.65rem; text-align: center; cursor: pointer; background: var(--bg-light); color: var(--text-muted); transition: 0.2s;">MVP</button>
            <button class="tab-btn" onclick="window.switchStatTab('mvplag')" id="tab-mvplag" style="padding: 10px 0; border-radius: 6px; border: none; font-weight: 800; font-size: 0.65rem; text-align: center; cursor: pointer; background: var(--bg-light); color: var(--text-muted); transition: 0.2s;">LAG</button>
        </div>

        <!-- Beholderen der rekkefølgen tegnes ut trinnvis -->
        <div id="tabContentContainer"></div>

        <!-- Dynamisk hjelpetekst som tilpasser seg aktiv fane -->
        <div id="dynamicStatInfo" class="dynamic-stat-info">
            <i class="fa-solid fa-circle-info"></i>
            <span id="infoTextSpan">Viser oversikt over lagets toppscorere i valgt periode.</span>
        </div>
    </div>
</main>

<script src="navigation.js"></script>
<script type="module" src="statistikk.js"></script>

</body>
</html>
