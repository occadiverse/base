<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BSK Fotball Herrer A-lag</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=2">
    <style>
        .stats-hero-clean {
            background: linear-gradient(135deg, #2c3e50 0%, #000000 100%);
            border-radius: 20px;
            padding: 50px;
            color: white;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .stats-hero-clean h2 { font-size: 2.2rem; font-weight: 800; margin-bottom: 10px; }
        .stats-hero-clean p { font-size: 1.1rem; opacity: 0.8; }

        /* Lag-statistikk boksene */
        .team-stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .team-card {
            background: var(--white);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: var(--shadow);
            border-top: 4px solid var(--primary);
        }
        .team-card div:first-child { font-size: 0.8rem; text-transform: uppercase; color: #666; margin-bottom: 5px; }
        .team-card div:last-child { font-size: 1.8rem; font-weight: 800; color: var(--text-main); }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .stat-card {
            background: var(--white);
            border-radius: 15px;
            padding: 25px;
            box-shadow: var(--shadow);
        }

        .stat-card h3 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-main);
            border-bottom: 2px solid #f8f9fa;
            padding-bottom: 15px;
        }

        .top-list { list-style: none; padding: 0; margin: 0; }
        .top-list li {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 1rem;
        }
        .top-list li:last-child { border-bottom: none; }
        .rank { font-weight: 800; color: var(--primary); margin-right: 12px; width: 25px; display: inline-block; }
        .player-name { flex: 1; font-weight: 600; color: #333; }
        .score-val { font-weight: 800; color: var(--text-main); background: #f8f9fa; padding: 2px 8px; border-radius: 5px; }

        .top-list li:first-child .player-name { color: var(--primary); font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="sidebar" id="sidebar"></div>

<div class="main-content">
    <div class="top-bar">
        <button class="menu-toggle" onclick="toggleMenu()">
            <i class="fa-solid fa-bars"></i>
        </button>
        <!-- Oppdatert tittel -->
        <h2 class="section-title">BSK Fotball Herrer A-lag</h2>
    </div>

    <section class="stats-hero-clean">
        <h2>Sesongens Høydepunkter</h2>
        <p>En oversikt over de som har utmerket seg på banen og treningsfeltet.</p>
    </section>

    <!-- Filter bar stylet som de andre sidene -->
    <div class="filter-bar">
        <div class="centered-tools">
            <div class="tool-item">
                <div class="custom-select-wrapper">
                    <i class="fa-solid fa-filter"></i>
                    <select id="statPeriodSelect" class="select-input-clean">
                        <option value="total">Total sesong</option>
                        <option value="current">Denne måneden</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- 3 Gode Lag-stats -->
    <div class="team-stats-row">
        <div class="team-card">
            <div>Kamper Spilt</div>
            <div id="teamMatches">-</div>
        </div>
        <div class="team-card">
            <div>Totalt Mål</div>
            <div id="teamGoals">-</div>
        </div>
        <div class="team-card">
            <div>Seiersprosent</div>
            <div id="teamWinRate">-</div>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <h3><i class="fa-solid fa-crown" style="color: #f1c40f;"></i> Poengkongen</h3>
            <ul id="listPoeng" class="top-list"></ul>
        </div>

        <div class="stat-card">
            <h3><i class="fa-solid fa-shield-halved" style="color: #3498db;"></i> Komplett Lagspiller</h3>
            <ul id="listKomplett" class="top-list"></ul>
        </div>

        <div class="stat-card">
            <h3><i class="fa-solid fa-calendar-check" style="color: #2ecc71;"></i> Treningsiver</h3>
            <ul id="listOppmote" class="top-list"></ul>
        </div>
    </div>
</div>

<script src="navigation.js"></script>
<script type="module" src="statistikk.js"></script>

</body>
</html>
