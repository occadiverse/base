<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistikk - BSK Fotball</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="nav-brand">BSK Fotball 2026</a>
    <div class="nav-links-container">
        <a href="oppmote.html" class="nav-item">📅 Oppmøte</a>
        <a href="spillere.html" class="nav-item">👥 Spillere</a>
        <a href="statistikk.html" class="nav-item active">📊 Stats</a>
    </div>
</nav>

<div class="container">
    <div class="stats-card">
        <table id="statsTable">
            <thead>
                <tr>
                    <th>#</th>
                    <th style="text-align: left;">Spiller</th>
                    <th>Oppmøte</th>
                    <th>Prosent</th>
                </tr>
            </thead>
            <tbody id="statsBody"></tbody>
        </table>
    </div>
</div>

<script src="database.js"></script>
<script>
    function calculateStats() {
        const players = DB.getActivePlayers();
        const currentYear = 2026;
        let stats = [];

        players.forEach(player => {
            let attended = 0;
            let totalPossible = 0;

            for (let m = 0; m < 12; m++) {
                const daysInMonth = new Date(currentYear, m + 1, 0).getDate();
                for (let d = 1; d <= daysInMonth; d++) {
                    const typeKey = `type-${currentYear}-${m}-${d}`;
                    const type = localStorage.getItem(typeKey);
                    
                    if (type === "T" || type === "K") {
                        totalPossible++;
                        const status = DB.getAttendance(currentYear, m, player.id, d);
                        if (status === "✅") attended++;
                    }
                }
            }

            const percent = totalPossible > 0 ? Math.round((attended / totalPossible) * 100) : 0;
            stats.push({
                navn: player.navn,
                attended: attended,
                total: totalPossible,
                percent: percent
            });
        });

        stats.sort((a, b) => b.percent - a.percent || b.attended - a.attended);
        renderStats(stats);
    }

    function renderStats(stats) {
        const body = document.getElementById('statsBody');
        body.innerHTML = stats.map((s, index) => {
            let rankClass = index < 3 ? `rank-${index + 1}` : '';
            let medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : '';
            
            return `
                <tr class="${rankClass}">
                    <td>${medal || index + 1}</td>
                    <td style="text-align: left;"><strong>${s.navn}</strong></td>
                    <td>${s.attended} / ${s.total}</td>
                    <td>
                        ${s.percent}%
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" style="width: ${s.percent}%"></div>
                        </div>
                    </td>
                </tr>
            `;
        }).join('');
    }

    calculateStats();
</script>
</body>
</html>
