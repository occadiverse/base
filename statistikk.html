<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Statistikk - BSK Fotball</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=2">
    <style>
        .stats-hero {
            background: linear-gradient(135deg, #2c3e50 0%, #000000 100%);
            border-radius: 20px;
            padding: 30px;
            color: white;
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .hero-stat-item { 
            text-align: center; 
            padding: 10px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
        }
        .hero-stat-item div:first-child { 
            font-size: 0.7rem; 
            opacity: 0.7; 
            text-transform: uppercase; 
            margin-bottom: 8px; 
            letter-spacing: 0.05em;
        }
        .hero-stat-item div:last-child { 
            font-size: 1.4rem; 
            font-weight: 800; 
            color: var(--primary); 
            line-height: 1.2;
        }
        
        #heroTopScorer { color: #2ecc71 !important; }
        #heroCompletePlayer { color: #f1c40f !important; }

        /* Filter bar styling for å matche de andre sidene */
        .filter-bar {
            background: var(--white);
            border-radius: 12px;
            padding: 15px 25px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: center;
        }

        .centered-tools {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        th { text-align: center !important; }
        .name-col { text-align: left !important; }
        
        .badge-point { 
            background: #e8f5e9; 
            color: #2e7d32; 
            padding: 4px 10px; 
            border-radius: 6px; 
            font-weight: 800; 
            font-size: 0.85rem; 
            display: inline-block;
            min-width: 30px;
        }
        
        .badge-work { 
            background: #fff3e0; 
            color: #e65100; 
            padding: 4px 10px; 
            border-radius: 6px; 
            font-weight: 800; 
            font-size: 0.85rem; 
            display: inline-block;
            min-width: 45px;
        }

        @media (max-width: 768px) {
            .stats-hero { grid-template-columns: repeat(2, 1fr); }
            .hero-stat-item:last-child { grid-column: span 2; }
            .hero-stat-item div:last-child { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar"></div>

    <div class="main-content">
        <div class="top-bar">
            <button class="menu-toggle" onclick="toggleMenu()">
                <i class="fa-solid fa-bars"></i>
            </button>
            <h2 class="section-title">Sesongstatistikk</h2>
        </div>

        <!-- LAGDATA HERO -->
        <div class="stats-hero" id="teamStatsHero">
            <div class="hero-stat-item">
                <div>Kamper</div>
                <div id="heroTotalMatches">-</div>
            </div>
            <div class="hero-stat-item">
                <div>Mål scoret</div>
                <div id="heroTotalGoals">-</div>
            </div>
            <div class="hero-stat-item">
                <div>Snitt Oppmøte</div>
                <div id="heroAvgAttendance">-</div>
            </div>
            <div class="hero-stat-item">
                <div>Poengkonge</div>
                <div id="heroTopScorer">-</div>
            </div>
            <div class="hero-stat-item">
                <div>Komplett Spiller</div>
                <div id="heroCompletePlayer">-</div>
            </div>
        </div>

        <!-- OPPDATERT FILTER BAR -->
        <div class="filter-bar">
            <div class="centered-tools">
                <div class="tool-item">
                    <div class="custom-select-wrapper">
                        <i class="fa-solid fa-calendar-alt"></i>
                        <select id="statPeriodSelect" class="select-input-clean">
                            <option value="total">Total sesong</option>
                            <option value="current">Denne måneden</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="table-container">
            <table id="statsTable">
                <thead>
                    <tr>
                        <th class="name-col">Spiller</th>
                        <th>Mål</th>
                        <th>Assist</th>
                        <th>Poeng</th>
                        <th>Jobb (snitt)</th>
                        <th>Oppmøte %</th>
                    </tr>
                </thead>
                <tbody id="statsBody"></tbody>
            </table>
        </div>
    </div>

    <script src="navigation.js"></script>
    <script type="module" src="statistikk.js"></script>

</body>
</html>
