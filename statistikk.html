<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BSK Fotball Herrer A-lag</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=2">
    <style>
        .stats-hero-clean {
            background: linear-gradient(135deg, #2c3e50 0%, #000000 100%);
            border-radius: 20px;
            padding: 50px;
            color: white;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .stats-hero-clean h2 { font-size: 2.2rem; font-weight: 800; margin-bottom: 10px; }
        .stats-hero-clean p { font-size: 1.1rem; opacity: 0.8; }

        .team-stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .team-card {
            background: var(--white);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: var(--shadow);
            border-top: none;
        }
        .team-card .label { font-size: 0.75rem; text-transform: uppercase; color: #666; margin-bottom: 8px; font-weight: 700; }
        .team-card .value { font-size: 1.8rem; font-weight: 800; color: var(--text-main); }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .stat-card {
            background: var(--white);
            border-radius: 15px;
            padding: 25px;
            box-shadow: var(--shadow);
        }

        /* --- RAD-STYLING --- */
        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0; /* Standard tynn linje */
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
        }

        /* Fjerner linje på absolutt siste rad i hele kortet */
        .hidden-list .stat-row:last-child { border-bottom: none; }

        .rank { font-weight: 800; color: var(--primary); margin-right: 12px; width: 25px; display: inline-block; }
        .player-name { flex: 1; font-weight: 600; color: #333; }
        .score-val { font-weight: 800; color: var(--text-main); background: #f8f9fa; padding: 2px 8px; border-radius: 5px; }

        /* Sørger for at linjen under vinneren (nr 1) er identisk med de andre */
        #winnerPoeng .stat-row, 
        #winnerKomplett .stat-row, 
        #winnerOppmote .stat-row {
            border-bottom: 1px solid #f0f0f0;
        }

        /* --- ACCORDION LOGIKK (MOBIL) --- */
        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 2px solid #f8f9fa;
            cursor: pointer;
        }
        .stat-header h3 { font-size: 1.2rem; display: flex; align-items: center; gap: 12px; color: var(--text-main); margin: 0; }
        .toggle-icon { color: #ccc; transition: transform 0.3s; }
        .stat-header.active .toggle-icon { transform: rotate(180deg); }

        .hidden-list {
            display: none;
        }
        .hidden-list.show { display: block; }

        /* --- PC VISNING (BREDE SKJERMER) --- */
        @media (min-width: 769px) {
            .stat-header {
                cursor: default;
                pointer-events: none;
            }
            .toggle-icon {
                display: none;
            }
            .hidden-list {
                display: block !important;
            }
        }

        /* Filter bar */
        .filter-bar {
            background: var(--white);
            border-radius: 12px;
            padding: 15px 25px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .filter-bar label { font-weight: 600; color: var(--text-main); white-space: nowrap; display: flex; align-items: center; gap: 8px; }
        .filter-bar label i { color: var(--primary); font-size: 1.1rem; }
        .custom-select-wrapper { flex: 1; max-width: 300px; }
        .select-input-clean {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--white);
            color: var(--text-main);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 1em;
        }
    </style>
</head>
<body>

<div class="sidebar" id="sidebar"></div>

<div class="main-content">
    <div class="top-bar">
        <button class="menu-toggle" onclick="toggleMenu()">
            <i class="fa-solid fa-bars"></i>
        </button>
        <h2 class="section-title">BSK Fotball Herrer A-lag</h2>
    </div>

    <section class="stats-hero-clean">
        <h2>Sesongens Høydepunkter</h2>
        <p>En dypere titt på prestasjonene som definerer oss i år.</p>
    </section>

    <div class="filter-bar">
        <label for="statPeriodSelect">
            <i class="fa-solid fa-calendar"></i>
            Filtrer etter måned:
        </label>
        <div class="custom-select-wrapper">
            <select id="statPeriodSelect" class="select-input-clean">
                <option value="total">Hele sesongen</option>
            </select>
        </div>
    </div>

    <div class="team-stats-row">
        <div class="team-card">
            <div class="label">Kamper Spilt</div>
            <div id="teamMatches" class="value">-</div>
        </div>
        <div class="team-card">
            <div class="label">Mål Scoret</div>
            <div id="teamGoals" class="value">-</div>
        </div>
        <div class="team-card">
            <div class="label">Seiersprosent</div>
            <div id="teamWinRate" class="value">-%</div>
        </div>
    </div>

    <div class="stats-grid">
        <!-- POENGKONGEN -->
        <div class="stat-card">
            <div class="stat-header" onclick="toggleStatList('listPoengContainer', this)">
                <h3><i class="fa-solid fa-crown" style="color: var(--primary);"></i> Poengkongen</h3>
                <i class="fa-solid fa-chevron-down toggle-icon"></i>
            </div>
            <div id="winnerPoeng"></div>
            <div id="listPoengContainer" class="hidden-list"></div>
        </div>

        <!-- LAGSPILLER -->
        <div class="stat-card">
            <div class="stat-header" onclick="toggleStatList('listKomplettContainer', this)">
                <h3><i class="fa-solid fa-shield-halved" style="color: var(--primary);"></i> Lagspiller</h3>
                <i class="fa-solid fa-chevron-down toggle-icon"></i>
            </div>
            <div id="winnerKomplett"></div>
            <div id="listKomplettContainer" class="hidden-list"></div>
        </div>

        <!-- TRENINGSIVER -->
        <div class="stat-card">
            <div class="stat-header" onclick="toggleStatList('listOppmoteContainer', this)">
                <h3><i class="fa-solid fa-calendar-check" style="color: var(--primary);"></i> Treningsiver</h3>
                <i class="fa-solid fa-chevron-down toggle-icon"></i>
            </div>
            <div id="winnerOppmote"></div>
            <div id="listOppmoteContainer" class="hidden-list"></div>
        </div>
    </div>
</div>

<script>
    function toggleStatList(id, header) {
        if (window.innerWidth > 768) return; 
        const container = document.getElementById(id);
        container.classList.toggle('show');
        header.classList.toggle('active');
    }
</script>

<script src="navigation.js"></script>
<script type="module" src="statistikk.js"></script>

</body>
</html>
