<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistikk - Bækkelaget SK</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .stats-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .rank-1 { background-color: #ffd70044; } /* Gull */
        .rank-2 { background-color: #c0c0c044; } /* Sølv */
        .rank-3 { background-color: #cd7f3244; } /* Bronse */
        .medal { font-size: 1.2em; margin-right: 5px; }
        .progress-bar-bg {
            background: #eee;
            border-radius: 10px;
            height: 10px;
            width: 100%;
            margin-top: 5px;
        }
        .progress-bar-fill {
            background: var(--primary-color);
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s ease-out;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>📊 Statistikk 2026</h1>
    <a href="index.html" class="nav-link">🏠 Meny</a>
</div>

<div class="container">
    <div class="stats-card">
        <table id="statsTable">
            <thead>
                <tr>
                    <th>Plass</th>
                    <th style="text-align: left;">Spiller</th>
                    <th>Oppmøte</th>
                    <th>%</th>
                </tr>
            </thead>
            <tbody id="statsBody"></tbody>
        </table>
    </div>
</div>

<script src="database.js"></script>
<script>
    function calculateStats() {
        const players = DB.getActivePlayers();
        const currentYear = 2026;
        let stats = [];

        players.forEach(player => {
            let attended = 0;
            let totalPossible = 0;

            // Vi går gjennom alle måneder (0-11)
            for (let m = 0; m < 12; m++) {
                const daysInMonth = new Date(currentYear, m + 1, 0).getDate();
                
                for (let d = 1; d <= daysInMonth; d++) {
                    const typeKey = `type-${currentYear}-${m}-${d}`;
                    const type = localStorage.getItem(typeKey);
                    
                    // Sjekker om det var en aktivitet (Trening eller Kamp)
                    if (type === "T" || type === "K") {
                        totalPossible++;
                        const status = DB.getAttendance(currentYear, m, player.id, d);
                        if (status === "✅") {
                            attended++;
                        }
                    }
                }
            }

            const percent = totalPossible > 0 ? Math.round((attended / totalPossible) * 100) : 0;
            stats.push({
                navn: player.navn,
                attended: attended,
                total: totalPossible,
                percent: percent
            });
        });

        // Sorterer fra høyest til lavest prosent
        stats.sort((a, b) => b.percent - a.percent || b.attended - a.attended);
        renderStats(stats);
    }

    function renderStats(stats) {
        const body = document.getElementById('statsBody');
        body.innerHTML = stats.map((s, index) => {
            let rankClass = index < 3 ? `rank-${index + 1}` : '';
            let medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : '';
            
            return `
                <tr class="${rankClass}">
                    <td>${medal || index + 1}</td>
                    <td style="text-align: left;"><strong>${s.navn}</strong></td>
                    <td>${s.attended} / ${s.total}</td>
                    <td>
                        ${s.percent}%
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" style="width: ${s.percent}%"></div>
                        </div>
                    </td>
                </tr>
            `;
        }).join('');
    }

    calculateStats();
</script>
</body>
</html>
