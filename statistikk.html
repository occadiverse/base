<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistikk - BSK Fotball</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sidebar" id="sidebar"></div>

    <div class="main-content">
        <div class="top-bar">
            <button class="menu-toggle" onclick="toggleMenu()">
                <i class="fa-solid fa-bars"></i>
            </button>
            <h2 class="section-title">Statistikk</h2>
        </div>

        <div class="filter-bar">
            <div class="centered-tools">
                <div class="tool-item">
                    <div class="custom-select-wrapper">
                        <i class="fa-solid fa-chart-line"></i>
                        <select id="statPeriodSelect" class="select-input-clean">
                            <option value="current">Denne måneden</option>
                            <option value="total">Total sesong</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="table-container">
            <table id="statsTable">
                <thead>
                    <tr>
                        <th class="name-col">Spiller</th>
                        <th>Treninger</th>
                        <th>Kamper</th>
                        <th class="stat-col">Total %</th>
                    </tr>
                </thead>
                <tbody id="statsBody">
                    <!-- Data injiseres her av statistikk.js -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- 1. Navigasjon lastes først -->
    <script src="navigation.js"></script>

    <!-- 2. Statistikk-logikken lastes som MODUL (løser SyntaxError) -->
    <script type="module" src="statistikk.js"></script>

    <!-- 3. Initialisering av UI-komponenter -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Sjekker om navigasjonsfunksjonen eksisterer før kjøring
            if (typeof window.loadNavigation === 'function') {
                window.loadNavigation();
            }
        });
    </script>
</body>
</html>
