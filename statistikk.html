<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BSK Fotball Herrer A-lag</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=2">
    <style>
        .stats-hero-clean {
            background: linear-gradient(135deg, #2c3e50 0%, #000000 100%);
            border-radius: 20px;
            padding: 50px;
            color: white;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .stats-hero-clean h2 { font-size: 2.2rem; font-weight: 800; margin-bottom: 10px; }
        .stats-hero-clean p { font-size: 1.1rem; opacity: 0.8; }

        /* Lag-statistikk rader */
        .team-stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .team-card {
            background: var(--white);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: var(--shadow);
            border-top: 4px solid var(--primary);
        }
        .team-card .label { font-size: 0.75rem; text-transform: uppercase; color: #666; margin-bottom: 8px; font-weight: 700; }
        .team-card .value { font-size: 1.8rem; font-weight: 800; color: var(--text-main); }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .stat-card {
            background: var(--white);
            border-radius: 15px;
            padding: 25px;
            box-shadow: var(--shadow);
        }

        .stat-card h3 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-main);
            border-bottom: 2px solid #f8f9fa;
            padding-bottom: 15px;
        }

        .top-list { list-style: none; padding: 0; margin: 0; }
        .top-list li {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 1rem;
        }
        .top-list li:last-child { border-bottom: none; }
        .rank { font-weight: 800; color: var(--primary); margin-right: 12px; width: 25px; display: inline-block; }
        .player-name { flex: 1; font-weight: 600; color: #333; }
        .score-val { font-weight: 800; color: var(--text-main); background: #f8f9fa; padding: 2px 8px; border-radius: 5px; }

        .top-list li:first-child .player-name { color: var(--primary); font-size: 1.1rem; }

        /* --- GJENOPPRETTET FILTER BAR STYLING FRA OPPMOTE.HTML --- */
        .filter-bar {
            background: var(--white);
            border-radius: 12px;
            padding: 15px 25px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .filter-bar label {
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .filter-bar label i { color: var(--primary); font-size: 1.1rem; }

        .custom-select-wrapper {
            flex: 1;
            max-width: 300px;
        }

        .select-input-clean {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--white);
            color: var(--text-main);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            /* Sikrer at pilen forsvinner hvis style.css fjerner den, eller beholder den ren */
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 1em;
        }

        .select-input-clean:hover {
            border-color: var(--primary);
        }
    </style>
</head>
<body>

<div class="sidebar" id="sidebar"></div>

<div class="main-content">
    <div class="top-bar">
        <button class="menu-toggle" onclick="toggleMenu()">
            <i class="fa-solid fa-bars"></i>
        </button>
        <h2 class="section-title">BSK Fotball Herrer A-lag</h2>
    </div>

    <section class="stats-hero-clean">
        <h2>Sesongens Høydepunkter</h2>
        <p>En dypere titt på prestasjonene som definerer oss i år.</p>
    </section>

    <!-- Filter Bar - NÅ HELT LIK oppmote.html -->
    <div class="filter-bar">
        <label for="statPeriodSelect">
            <i class="fa-solid fa-calendar"></i>
            Filtrer periode:
        </label>
        <div class="custom-select-wrapper">
            <select id="statPeriodSelect" class="select-input-clean">
                <option value="total">Hele sesongen (Vis alle)</option>
                <option value="current">Inneværende måned</option>
            </select>
        </div>
    </div>

    <!-- 3 GODE LAG STATS -->
    <div class="team-stats-row">
        <div class="team-card">
            <div class="label">Kamper Spilt</div>
            <div id="teamMatches" class="value">-</div>
        </div>
        <div class="team-card">
            <div class="label">Mål Scoret</div>
            <div id="teamGoals" class="value">-</div>
        </div>
        <div class="team-card">
            <div class="label">Seiersprosent</div>
            <div id="teamWinRate" class="value">-%</div>
        </div>
    </div>

    <div class="stats-grid">
        <!-- POENGKONGEN -->
        <div class="stat-card">
            <h3><i class="fa-solid fa-crown" style="color: #f1c40f;"></i> Poengkongen</h3>
            <ul id="listPoeng" class="top-list"></ul>
        </div>

        <!-- KOMPLETT LAGSPILLER -->
        <div class="stat-card">
            <h3><i class="fa-solid fa-shield-halved" style="color: #3498db;"></i> Komplett Lagspiller</h3>
            <ul id="listKomplett" class="top-list"></ul>
        </div>

        <!-- TRENINGSIVER -->
        <div class="stat-card">
            <h3><i class="fa-solid fa-calendar-check" style="color: #2ecc71;"></i> Treningsiver</h3>
            <ul id="listOppmote" class="top-list"></ul>
        </div>
    </div>
</div>

<script src="navigation.js"></script>
<script type="module" src="statistikk.js"></script>

</body>
</html>
