<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kamper - BSK Fotball</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=2">
    <style>
        /* Synkronisert styling fra oppmote.html */
        .kamper-hero {
            background: linear-gradient(135deg, #3498db 0%, #2c3e50 100%);
            border-radius: 20px;
            padding: 50px;
            color: white;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(52, 152, 219, 0.2);
        }

        .kamper-hero h2 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .kamper-hero p {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 600px;
            line-height: 1.5;
        }

        th {
            background: #f8f9fa;
            padding: 20px 12px;
            text-align: center;
            font-weight: 700;
            color: var(--text-main);
            border-bottom: 2px solid var(--border-color);
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .filter-bar {
            background: var(--white);
            border-radius: 12px;
            padding: 20px 25px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            overflow-x: auto;
        }

        .filter-bar > div {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            padding: 12px 20px;
            border: 2px solid var(--border-color);
            background: var(--white);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            transition: all 0.3s;
            font-size: 0.95rem;
            text-transform: uppercase;
        }

        .tab-btn.active {
            background-color: var(--primary); 
            color: #ffffff !important;
            border: 2px solid var(--primary);
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.2);
        }

        /* MODAL SYSTEM - FELLES FOR ALLE POPUPER */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background-color: var(--white);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 450px; /* Standard bredde */
            width: 90%;
            animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Spesifikk bredde for info-modalen siden den har spillerlister */
        #matchInfoModal .modal-content {
            max-width: 550px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-header h3 {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
            margin: 0;
        }

        /* FORM OG ELEMENTER INNE I MODALER */
        .form-stack {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .form-group input,
        .form-group select {
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            color: var(--text-main);
        }

        /* SPILLERLISTE I INFO-MODAL */
        #matchPlayerList {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
        }

        #matchPlayerList.show {
            max-height: 1000px;
            opacity: 1;
            margin-top: 15px;
            padding: 10px 5px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
        }

        /* KNAPPER OG HANDLINGER */
        .modal-action-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid var(--border-color);
            margin-top: 10px;
        }

        .modal-action-bar:hover {
            border-color: var(--primary);
            background: #f1f3f5;
        }

        .modal-action-bar.open i.fa-chevron-down {
            transform: rotate(180deg);
        }

        .button-group {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-grow-2 {
            background: var(--primary);
            color: white;
            flex: 1;
        }

        .btn-danger {
            background: #ecf0f1;
            color: var(--text-main);
            flex: 1;
        }

        .close-btn {
            background: #f1f3f5;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-muted);
            transition: 0.2s;
        }

        .close-btn:hover {
            background: #e9ecef;
            color: var(--danger);
        }

        .fab-btn {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 60px;
            height: 60px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 5px 20px rgba(52, 152, 219, 0.4);
            z-index: 1000;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideIn { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        @media (max-width: 768px) {
            .modal-content { width: 95%; padding: 20px; }
        }
    </style>
</head>
<body>

<div class="sidebar" id="sidebar"></div>

<div class="main-content">
    <div class="top-bar">
        <button class="menu-toggle" onclick="toggleMenu()">
            <i class="fa-solid fa-bars"></i>
        </button>
        <h2 class="section-title">BSK Fotball Herrer - A lag</h2>
    </div>

    <section class="kamper-hero">
        <div class="hero-content">
            <h2>Terminliste & Resultater</h2>
            <p>Full oversikt over sesongens kamper, baner og resultater for BSK Fotball.</p>
        </div>
    </section>

    <div class="filter-bar">
        <div>
            <button id="btnKommende" class="tab-btn active" onclick="switchView('kommende')">KOMMENDE</button>
            <button id="btnTidligere" class="tab-btn" onclick="switchView('tidligere')">TIDLIGERE</button>
        </div>
    </div>

    <div class="table-container">
        <table id="matchTable">
            <thead>
                <tr>
                    <th class="text-left">DATO & KL.</th>
                    <th class="text-left">MOTSTANDER</th> 
                    <th>RESULTAT</th> 
                    <th>BANE</th>
                    <th>TYPE</th>
                    <th>HANDLING</th>
                </tr>
            </thead>
            <tbody id="matchTableBody"></tbody>
        </table>
    </div>
</div>

<button class="fab-btn" onclick="openMatchModal()" title="Registrer ny kamp">
    <i class="fa-solid fa-plus"></i>
</button>

<!-- MODAL FOR REGISTRERING -->
<div id="matchModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Legg til ny kamp</h3>
            <button type="button" class="close-btn" onclick="closeMatchModal()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <form id="matchForm">
            <input type="hidden" id="editMatchId">
            <div class="form-stack">
                <div class="form-group">
                    <label>Dato</label>
                    <input type="date" id="matchDate" required>
                </div>
                <div class="form-group">
                    <label>Klokkeslett</label>
                    <input type="time" id="matchTime"> 
                </div>
                <div class="form-group">
                    <label>Motstander</label>
                    <input type="text" id="opponent" placeholder="F.eks. KFUM" required>
                </div>
                <div class="form-group">
                    <label>Bane / Sted</label>
                    <input type="text" id="pitch" placeholder="F.eks. BSK Kunstgress"> 
                </div>
                <div class="form-group">
                    <label>Kamp-type</label>
                    <select id="matchType">
                        <option value="Serie">Seriekamp</option>
                        <option value="Cup">Cupkamp</option>
                        <option value="Treningskamp">Treningskamp</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Resultat (valgfritt)</label>
                    <input type="text" id="result" placeholder="f.eks. 3-1">
                </div>
            </div>
            <div class="button-group">
                <button type="submit" id="saveBtn" class="btn btn-grow-2">Lagre kamp</button>
                <button type="button" class="btn btn-danger" onclick="closeMatchModal()">Avbryt</button>
            </div>
        </form>
    </div>
</div>

<!-- MODAL FOR KAMPINFO - NÅ MED SAMME STIL -->
<div id="matchInfoModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="infoTitle">Laster...</h3>
            <button type="button" class="close-btn" onclick="closeMatchInfo()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div id="matchInfoDetails"></div>
        <div id="matchPlayerList"></div>
        <div id="tacticBarContainer"></div>
        <div class="button-group">
            <button class="btn btn-grow-2" onclick="closeMatchInfo()">Lukk</button>
        </div>
    </div>
</div>

<script type="module">
    import { db } from './firebase-config.js';
    import { ref, set, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    window.db = db; 
    window.dbRef = ref; 
    window.dbSet = set; 
    window.dbPush = push; 
    window.dbRemove = remove; 
    window.dbOnValue = onValue;
</script>

<script src="navigation.js"></script>
<script src="kamper_ny.js"></script>

<script>
    window.closeMatchModal = () => {
        document.getElementById('matchModal').style.display = 'none';
        document.getElementById('matchForm').reset();
        document.getElementById('editMatchId').value = '';
    };
    
    window.openMatchModal = () => {
        document.getElementById('matchModal').style.display = 'flex';
        document.getElementById('matchDate').valueAsDate = new Date();
    };

    window.closeMatchInfo = () => {
        document.getElementById('matchInfoModal').style.display = 'none';
    };

    window.onclick = function(event) {
        if (event.target.classList.contains('modal')) {
            closeMatchModal();
            closeMatchInfo();
        }
    }
</script>

</body>
</html>
