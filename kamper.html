    <!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kamper - BSK Fotball</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=2">
    <style>
        /* Synkronisert styling fra oppmote.html */
        .kamper-hero {
            background: linear-gradient(135deg, #3498db 0%, #2c3e50 100%);
            border-radius: 20px;
            padding: 50px;
            color: white;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(52, 152, 219, 0.2);
        }

        .kamper-hero h2 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .kamper-hero p {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 600px;
            line-height: 1.5;
        }

        th {
            background: #f8f9fa;
            padding: 20px 12px; /* Beholder den gode høyden/størrelsen din */
            text-align: center;
            font-weight: 700;
            color: var(--text-main);
            border-bottom: 2px solid var(--border-color);
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            text-transform: uppercase; /* Gjør teksten til store bokstaver som i spillere.html */
        }

        .filter-bar {
            background: var(--white);
            border-radius: 12px;
            padding: 20px 25px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            /* Gjør det mulig å scrolle knappene på mobil */
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .filter-bar > div {
            display: flex;
            gap: 10px;
        }

        .filter-bar label {
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .filter-bar label i {
            color: var(--primary);
            font-size: 1.1rem;
        }

        .filter-label {
            font-weight: 700;
            color: var(--text-main);
            margin-right: 15px;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
        }

        .tab-btn {
            padding: 12px 20px;
            border: 2px solid var(--border-color); /* Tykkere ramme som på spiller-siden */
            background: var(--white);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            transition: all 0.3s;
            font-size: 0.95rem;
            text-transform: uppercase; /* Store bokstaver for sportslig preg */
        }

        .tab-btn.active {
            background-color: var(--primary); 
            color: #ffffff !important;
            border: 2px solid var(--primary);
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.2);
        }

        .tab-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .tab-btn:not(.active):hover {
            border-color: var(--primary);
            color: var(--primary);
            background-color: #f8f9fa;
        }

        /* X-knappen i modal-header */
        .close-btn {
            background: #f1f3f5; /* Lys grå bakgrunn som standard */
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s ease;
            width: 36px;
            height: 36px;
            border-radius: 50%; /* Gjør den helt rund */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .close-btn:hover {
            background: #e9ecef;
            color: var(--danger); /* Blir rød når man skal lukke */
            transform: rotate(90deg); /* En liten detalj som gjør den "levende" */
        }

        /* FAB Button styling for konsistens */
        .fab-btn {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 60px;
            height: 60px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 5px 20px rgba(52, 152, 219, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
        }

        .fab-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 30px rgba(52, 152, 219, 0.6);
        }

        /* Modal animasjoner */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { background-color: rgba(0, 0, 0, 0); }
            to { background-color: rgba(0, 0, 0, 0.5); }
        }

        .modal-content {
            background-color: var(--white);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 90%;
            animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Responsiv tilpasning for mobil (maks 768px bredde) */
        @media (max-width: 768px) {
            /* Justerer Hero-seksjonen */
            .kamper-hero {
            padding: 30px;
            margin-bottom: 20px;
            }

            .kamper-hero h2 {
            font-size: 1.6rem;
            }

            /* Endrer filter-baren til vertikal visning */
            .filter-bar {
            flex-direction: column;
            align-items: stretch;
            padding: 15px; /* Litt mindre padding på mobil */
            }

            .filter-bar label {
            justify-content: flex-start;
            margin-bottom: 10px;
            }

            .tab-container-inner {
            max-width: 100%; /* Lar knappene bruke hele bredden */
            }

            /* Gjør modalene mer brukervennlige på små skjermer */
            .modal-content {
            width: 95%;
            padding: 20px;
            }
        }
        
    </style>
</head>
<body>

<div class="sidebar" id="sidebar"></div>

<div class="main-content">
    <div class="top-bar">
        <button class="menu-toggle" onclick="toggleMenu()">
            <i class="fa-solid fa-bars"></i>
        </button>
        <h2 class="section-title">BSK Fotball Herrer - A lag</h2>
    </div>

    <!-- HERO SEKSJON -->
    <section class="kamper-hero">
        <div class="hero-content">
            <h2>Terminliste & Resultater</h2>
            <p>Her får du full oversikt over sesongens kamper, baner og resultater for BSK Fotball.</p>
        </div>
    </section>

    <!-- FILTER BAR -->
    <div class="filter-bar">
        <div>
            <button id="btnKommende" class="tab-btn active" onclick="switchView('kommende')">KOMMENDE</button>
            <button id="btnTidligere" class="tab-btn" onclick="switchView('tidligere')">TIDLIGERE</button>
        </div>
    </div>

    <!-- TABELL-CONTAINER -->
    <div class="table-container">
        <table id="matchTable">
            <thead>
                <tr>
                    <th class="name-col">DATO & KL.</th>
                    <th class="text-left">MOTSTANDER</th> 
                    <th>RESULTAT</th> 
                    <th>BANE</th>
                    <th>TYPE</th>
                    <th>HANDLING</th>
                </tr>
            </thead>
            <tbody id="matchTableBody"></tbody>
        </table>
    </div>

<!-- FAB KNAPP: Nøyaktig lik posisjon og stil som oppmøte -->
<button class="fab-btn" onclick="openMatchModal()" title="Registrer ny kamp" style="position: fixed; right: 20px; bottom: 20px; width: 60px; height: 60px; background: var(--primary); color: white; border: none; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 5px 20px rgba(52, 152, 219, 0.4); z-index: 1000;">
    <i class="fa-solid fa-plus"></i>
</button>

<!-- MODAL FOR REGISTRERING -->
<div id="matchModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Registrer kamp</h3>
            <button class="close-btn" onclick="closeMatchModal()">&times;</button>
        </div>
        <form id="matchForm">
            <input type="hidden" id="editMatchId">
            <div class="form-stack">
                <div class="form-group">
                    <label>Dato</label>
                    <input type="date" id="matchDate" required>
                </div>
                <div class="form-group">
                    <label>Klokkeslett</label>
                    <input type="time" id="matchTime"> 
                </div>
                <div class="form-group">
                    <label>Motstander</label>
                    <input type="text" id="opponent" placeholder="F.eks. KFUM" required>
                </div>
                <div class="form-group">
                    <label>Bane / Sted</label>
                    <input type="text" id="pitch" placeholder="F.eks. BSK Kunstgress"> 
                </div>
                <div class="form-group">
                    <label>Kamp-type</label>
                    <select id="matchType">
                        <option value="Serie">Seriekamp</option>
                        <option value="Cup">Cupkamp</option>
                        <option value="Treningskamp">Treningskamp</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Resultat (valgfritt)</label>
                    <input type="text" id="result" placeholder="f.eks. 3-1">
                </div>
            </div>
            <div class="button-group">
                <button type="submit" id="saveBtn" class="btn btn-grow-2">Lagre kamp</button>
                <button type="button" class="btn btn-danger" onclick="closeMatchModal()">Avbryt</button>
            </div>
        </form>
    </div>
</div>

<!-- MODAL FOR KAMPINFO (Spillerliste) -->
<div id="matchInfoModal" class="modal">
    <div class="modal-content" style="max-width: 550px;">
        <div class="modal-header">
            <h3 id="infoTitle">Laster...</h3>
            <button class="close-btn" onclick="closeMatchInfo()">&times;</button>
        </div>
        <div id="matchInfoDetails"></div>
        <div id="matchPlayerList" style="margin-top: 10px;"></div>
        <div class="button-group" style="margin-top: 25px;">
            <button class="btn btn-grow-2" onclick="closeMatchInfo()">Lukk</button>
        </div>
    </div>
</div>

<script type="module">
    import { db } from './firebase-config.js';
    import { ref, set, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    window.db = db; 
    window.dbRef = ref; 
    window.dbSet = set; 
    window.dbPush = push; 
    window.dbRemove = remove; 
    window.dbOnValue = onValue;
</script>

<script src="navigation.js"></script>
<script src="kamper.js"></script>

<script>
    window.closeMatchModal = () => {
        document.getElementById('matchModal').style.display = 'none';
        document.getElementById('matchForm').reset();
        document.getElementById('editMatchId').value = '';
        document.getElementById('modalTitle').innerText = 'Registrer kamp';
    };
    
    window.openMatchModal = () => {
        document.getElementById('modalTitle').innerText = 'Registrer kamp';
        document.getElementById('matchModal').style.display = 'flex';
        document.getElementById('matchDate').valueAsDate = new Date();
    };

    window.closeMatchInfo = () => {
        document.getElementById('matchInfoModal').style.display = 'none';
    };

    window.onclick = function(event) {
        if (event.target.classList.contains('modal')) {
            event.target.style.display = 'none';
        }
    }
</script>

</body>
</html>
